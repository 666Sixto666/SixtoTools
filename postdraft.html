<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixto Custom Guitars · Posts</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#150f0d">
<style>
  :root{
    --bg:#150f0d; --card:#211814; --card-2:#2a1f1a; --line:#3a2c24;
    --text:#f3ead9; --dim:#b4a28a; --brass:#c7a165; --gold:#dcbb82; --ok:#8fae6a;
    --serif:'Fraunces', Georgia, serif; --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;color:var(--text);font-family:var(--sans);
    background:radial-gradient(120% 55% at 50% -12%, rgba(199,161,101,.11), transparent 62%), var(--bg);background-attachment:fixed;}
  body{padding:20px 16px calc(60px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;}
  a{color:var(--gold);}

  header{display:flex;gap:14px;align-items:center;margin-bottom:22px;}
  header .mark{width:46px;height:46px;flex-shrink:0;border:1.5px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:600;font-size:23px;color:var(--brass);text-decoration:none;}
  header .eyebrow{font-weight:600;letter-spacing:.22em;font-size:10px;text-transform:uppercase;color:var(--brass);margin-bottom:3px;}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.05;margin:0;}

  .card{background:linear-gradient(180deg,var(--card),#1d1511);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.025) inset,0 10px 26px rgba(0,0,0,.28);}
  .card.ready{border-color:rgba(199,161,101,.55);box-shadow:0 0 0 4px rgba(199,161,101,.07),0 10px 26px rgba(0,0,0,.28);}
  h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--brass);margin:26px 2px 10px;}
  h2:first-of-type{margin-top:0;}
  h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 4px;line-height:1.2;}
  .meta{font-size:13px;color:var(--dim);margin-bottom:14px;line-height:1.45;}
  .muted{font-size:13px;color:var(--dim);line-height:1.5;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--sans);font-size:13.5px;font-weight:600;
    border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--gold);}
  .btn:active{background:var(--card-2);}
  .btn.primary{background:linear-gradient(135deg,var(--gold),var(--brass));color:#1a120d;border:none;}
  .btn.done{border-color:var(--ok);color:var(--ok);}
  .btn.small{font-size:12px;padding:7px 11px;}

  .block{margin-top:14px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:10px;}
  .block-head span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;}
  .text{white-space:pre-wrap;background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:14px;line-height:1.55;
    max-height:220px;overflow:auto;}
  details summary{cursor:pointer;font-size:12.5px;color:var(--dim);margin-top:12px;list-style:none;}
  details summary::before{content:"▸ ";color:var(--brass);}
  details[open] summary::before{content:"▾ ";}
  .hint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.4;}
  .status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}

  .week{display:flex;align-items:center;gap:12px;}
  .week .count{font-family:var(--serif);font-weight:600;font-size:26px;color:var(--gold);min-width:52px;}
  .bar{flex:1;height:6px;border-radius:6px;background:var(--card-2);overflow:hidden;}
  .bar>div{height:100%;background:linear-gradient(90deg,#8a6a35,var(--gold));}

  .done-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;}
  .done-row:first-child{border-top:none;padding-top:0;}
  .done-row .when{color:var(--dim);font-size:12.5px;white-space:nowrap;}

  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--brass);color:#1a120d;padding:10px 18px;border-radius:20px;font-size:13.5px;font-weight:600;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <a class="mark" href="./" title="Werkplaats">S</a>
  <div>
    <div class="eyebrow">Sixto Custom Guitars</div>
    <h1>Posts</h1>
  </div>
</header>

<div id="ready"></div>

<h2>Deze week</h2>
<div class="card">
  <div class="week"><div class="count" id="wk-count">0</div><div class="bar"><div id="wk-bar" style="width:0%"></div></div></div>
  <div class="muted" id="wk-text" style="margin-top:8px;"></div>
</div>

<div id="posted"></div>

<div id="oldlog"></div>

<div class="toast" id="toast"></div>

<script>
/* Sixto Custom Guitars · Posts (v3, 27/10/2026)
   Claude zet video + teksten klaar in data/posts-queue.json (video als GitHub release-bijlage).
   Tom bewaart de video, kopieert de tekst en tikt "Gepost" aan; dat gaat terug naar de repo, zodat Claude het ziet.
   Token: hetzelfde als in Builds (zelfde site, zelfde opslag). */
const OWNER = '666sixto666', REPO = 'SixtoTools', QPATH = 'data/posts-queue.json';
const TOKEN_KEY = 'sixto_tools_gh_token';
const OLD_LOG_KEY = 'sixto-postdraft-log-v1';   // log van de vroegere tekstgenerator, enkel nog om te exporteren
const WEEK_TARGET = 2;                           // ritme: start 2 per week (00_WERKWIJZE_CONTENT)
let queue = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = () => { try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } };
const fmt = iso => new Date(iso).toLocaleDateString('nl-BE', {day:'numeric', month:'short'});
const fullyPosted = p => !!(p.posted && p.posted.instagram && p.posted.youtube);

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2000);
}

/* Lezen via de API (met token) geeft altijd de laatste versie; raw.githubusercontent kan minuten achterlopen. */
async function fetchQueue(){
  const t = token();
  if(t){
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${QPATH}?ref=main`,
      {headers:{Authorization:'Bearer '+t, Accept:'application/vnd.github+json'}, cache:'no-store'});
    if(res.ok){ const j = await res.json(); return {data: JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))), sha: j.sha}; }
  }
  const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${QPATH}?t=${Date.now()}`, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return {data: await res.json(), sha: null};
}

async function load(){
  try{ queue = (await fetchQueue()).data; }
  catch(e){ document.getElementById('ready').innerHTML = `<div class="card"><div class="muted">Kon de posts niet laden (offline?). Probeer straks opnieuw.</div></div>`; return; }
  render();
}

function render(){
  const posts = (queue && queue.posts) || [];
  const open = posts.filter(p => !fullyPosted(p));
  const done = posts.filter(fullyPosted);

  document.getElementById('ready').innerHTML = open.length
    ? `<h2>Klaar om te posten</h2>` + open.map(renderReady).join('')
    : `<h2>Klaar om te posten</h2><div class="card"><div class="muted">Niets klaar op dit moment. Claude zet hier de volgende reel klaar, met video en tekst.</div></div>`;

  const posted = posts.filter(p => p.posted && (p.posted.instagram || p.posted.youtube));
  document.getElementById('posted').innerHTML = done.length ? `<h2>Gepost</h2><div class="card">` + done
    .sort((a,b) => lastPosted(b).localeCompare(lastPosted(a)))
    .map(p => `<div class="done-row"><div>${esc(p.title)}</div><div class="when">${fmt(lastPosted(p))}</div></div>`).join('') + `</div>` : '';

  // week = maandag t/m zondag; telt elke reel één keer, ook als hij op beide platformen staat
  const now = new Date(), monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const n = posted.filter(p => new Date(firstPosted(p)) >= monday).length;
  document.getElementById('wk-count').textContent = `${n}/${WEEK_TARGET}`;
  document.getElementById('wk-bar').style.width = Math.min(100, n / WEEK_TARGET * 100) + '%';
  document.getElementById('wk-text').textContent = n >= WEEK_TARGET ? 'Ritme gehaald deze week.' : `Nog ${WEEK_TARGET - n} te gaan om het ritme van ${WEEK_TARGET} per week te halen.`;

  renderOldLog();
}
const stamps = p => Object.values(p.posted || {}).filter(Boolean).sort();
const firstPosted = p => stamps(p)[0] || '';
const lastPosted = p => stamps(p).slice(-1)[0] || '';

function renderReady(p){
  const st = p.posted || {};
  const block = (label, text) => text ? `<div class="block"><div class="block-head"><span>${esc(label)}</span>
      <button class="btn small" onclick="copyText(this)">Kopieer</button></div><div class="text">${esc(text)}</div></div>` : '';
  return `<div class="card ready">
    <h3>${esc(p.title)}</h3>
    <div class="meta">${esc(p.note || '')}</div>
    ${p.videoUrl ? `<a class="btn primary" style="width:100%" href="${esc(p.videoUrl)}" download>⬇ Video bewaren</a>
      <div class="hint">iPhone: tik › Download › open in Bestanden › Deel › Bewaar video. Daarna staat hij in Foto's.</div>` : ''}
    ${block('Instagram', p.igCaption)}
    ${p.igCaptionLong ? `<details><summary>Langere versie</summary>${block('Instagram, lang', p.igCaptionLong)}</details>` : ''}
    ${block('YouTube Short: titel', p.ytTitle)}
    ${block('YouTube Short: beschrijving', p.ytDescription)}
    <div class="status">
      <button class="btn ${st.instagram ? 'done' : ''}" onclick="markPosted('${esc(p.id)}','instagram')">${st.instagram ? '✓ Instagram' : 'Gepost op Instagram'}</button>
      <button class="btn ${st.youtube ? 'done' : ''}" onclick="markPosted('${esc(p.id)}','youtube')">${st.youtube ? '✓ YouTube' : 'Gepost als Short'}</button>
    </div>
  </div>`;
}

async function copyText(btn){
  const text = btn.closest('.block').querySelector('.text').textContent;
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Gekopieerd');
}

async function markPosted(id, platform){
  const t = token();
  if(!t){ toast('Geen token: zet het eerst in Builds › Instellingen'); return; }
  const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${QPATH}`;
  try{
    const {data, sha} = await fetchQueue();
    const post = (data.posts || []).find(p => p.id === id);
    if(!post) throw new Error('post niet gevonden');
    post.posted = post.posted || {};
    post.posted[platform] = post.posted[platform] ? null : new Date().toISOString();
    const body = {message: `Post ${id}: ${platform} ${post.posted[platform] ? 'gepost' : 'teruggezet'}`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))), sha, branch: 'main'};
    const put = await fetch(api, {method:'PUT', headers:{Authorization:'Bearer '+t, Accept:'application/vnd.github+json', 'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if(!put.ok){ const j = await put.json().catch(() => ({})); throw new Error(j.message || ('HTTP '+put.status)); }
    queue = data; render();
    toast(post.posted[platform] ? 'Genoteerd ✓' : 'Teruggezet');
  }catch(e){ toast('Mislukt: ' + e.message); }
}

/* De vroegere tekstgenerator hield een log bij op dit toestel. Staat er nog iets in, dan kan Tom het één keer exporteren en wissen. */
function oldLog(){ try{ return JSON.parse(localStorage.getItem(OLD_LOG_KEY)) || []; }catch(e){ return []; } }
function renderOldLog(){
  const log = oldLog();
  document.getElementById('oldlog').innerHTML = log.length ? `<h2>Oude log</h2><div class="card">
    <div class="muted">Op dit toestel staan nog ${log.length} notities uit de vroegere tekstgenerator. Bewaar ze als bestand en wis ze daarna.</div>
    <div class="status"><button class="btn" onclick="exportOldLog()">⬇ Bewaar als bestand</button><button class="btn" onclick="clearOldLog()">Wis</button></div></div>` : '';
}
function exportOldLog(){
  const blob = new Blob([JSON.stringify(oldLog(), null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sixto-posts-oude-log.json'; a.click();
}
function clearOldLog(){
  if(!confirm('Oude log wissen? Bewaar hem eerst als bestand als je hem wil houden.')) return;
  localStorage.removeItem(OLD_LOG_KEY); renderOldLog(); toast('Gewist');
}

// opslag van de vroegere generator en de oude koppeling met Builds: niet meer gebruikt
try{ ['sixto-postdraft-yt-enabled','sixto_pending_posts_v1','sixto_post_confirmations_v1'].forEach(k => localStorage.removeItem(k));
  Object.keys(localStorage).filter(k => k.startsWith('sixto-pd-varhist-')).forEach(k => localStorage.removeItem(k)); }catch(e){}
load();
</script>
</body>
</html>
