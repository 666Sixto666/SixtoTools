<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sixto Post Draft</title>
<style>
  :root{
    --bg:#1b1712;
    --card:#242019;
    --card-2:#2c2620;
    --line:#3a3227;
    --text:#ece3d2;
    --text-dim:#a99d87;
    --accent:#c1793f;
    --accent-2:#7d8563;
    --mono: "SF Mono", "Courier New", monospace;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding:20px 16px 60px;max-width:640px;margin:0 auto;}
  header{margin-bottom:24px;}
  header .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px;color:var(--text);}
  header p{margin:0;font-size:14px;color:var(--text-dim);line-height:1.5;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;}
  .card h2{font-family:var(--serif);font-weight:400;font-size:16px;margin:0 0 14px;color:var(--text);}

  label{display:block;font-size:12px;color:var(--text-dim);margin:14px 0 5px;}
  label:first-of-type{margin-top:0;}
  label .req{color:var(--accent);}
  label .hint{display:block;font-size:11px;color:var(--text-dim);opacity:.75;margin-top:2px;font-style:italic;}

  input[type=text], textarea, select{
    width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:7px;
    color:var(--text);padding:10px 11px;font-size:15px;font-family:var(--sans);
  }
  textarea{resize:vertical;min-height:56px;line-height:1.4;}
  select{appearance:none;background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:420px){.row2{grid-template-columns:1fr;}}

  button{
    font-family:var(--sans);font-size:14px;font-weight:600;border:none;border-radius:7px;
    padding:12px 18px;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#1b1712;width:100%;margin-top:18px;font-size:15px;padding:13px;}
  .btn-primary:active{opacity:.85;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text-dim);font-size:12px;padding:7px 12px;}
  .btn-ghost:active{background:var(--card-2);}

  .output{display:none;}
  .output.show{display:block;}
  .out-block{margin-bottom:16px;}
  .out-block .out-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .out-block .out-head span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);}
  .out-text{white-space:pre-wrap;background:var(--card-2);border:1px solid var(--line);border-radius:7px;
    padding:12px;font-size:14px;line-height:1.55;font-family:var(--sans);color:var(--text);}

  .log-entry{border-top:1px solid var(--line);padding:10px 0;font-size:13px;}
  .log-entry:first-child{border-top:none;}
  .log-entry .lt{color:var(--text-dim);font-family:var(--mono);font-size:11px;}
  .log-entry .ll{cursor:pointer;color:var(--text);margin-top:2px;}
  .empty{color:var(--text-dim);font-size:13px;font-style:italic;}

  .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1b1712;
    padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Sixto Tools</div>
  <h1>Post Draft</h1>
  <p>Korte notities in &rarr; kant-en-klare Instagram caption + YouTube beschrijving uit, in de vaste Sixto-toon. Schrijf de vrije velden bij voorkeur in het Engels &mdash; de tool structureert, jij blijft de stem.</p>
</header>

<div class="card">
  <h2>Build notities</h2>

  <label>Build / project naam</label>
  <input type="text" id="f-project" placeholder="bv. Sixto Bass #1">

  <label>Fase</label>
  <select id="f-phase">
    <option value="wood">Houtselectie</option>
    <option value="shaping">Vormgeven</option>
    <option value="neck">Nekwerk</option>
    <option value="finish">Afwerking</option>
    <option value="assembly">Assemblage</option>
    <option value="setup">Setup / detail</option>
    <option value="done">Voltooid instrument</option>
  </select>

  <label>Hout &amp; herkomst <span class="req">*verplicht</span>
    <span class="hint">Vaste anchor (Decision 010) &mdash; zonder dit veld geen bruikbare caption.</span>
  </label>
  <textarea id="f-wood" placeholder="e.g. reclaimed oak from a demolished barn beam near Blaasveld"></textarea>

  <label>Wat is er gebeurd</label>
  <textarea id="f-update" placeholder="e.g. carved the top contour, first time shaping this transition by hand"></textarea>

  <label>Hoe voelt/klinkt het nu <span class="hint">(optioneel &mdash; YouTube-anchor 3)</span></label>
  <textarea id="f-feel" placeholder="e.g. neck feels fast, still needs fret levelling before I can judge sustain"></textarea>

  <div class="row2">
    <div>
      <label>Toon</label>
      <select id="f-tone">
        <option value="calm">Rustig / bedachtzaam</option>
        <option value="milestone">Trots / mijlpaal</option>
        <option value="curious">Nieuwsgierig / experimenteel</option>
        <option value="technical">Technisch / precies</option>
      </select>
    </div>
    <div>
      <label>Klaar instrument?</label>
      <select id="f-final">
        <option value="no">Nee, work in progress</option>
        <option value="yes">Ja, volledig af</option>
      </select>
    </div>
  </div>

  <button class="btn-primary" onclick="generate()">Genereer draft</button>
</div>

<div class="output" id="output">
  <div class="card">
    <div class="out-block">
      <div class="out-head"><span>Instagram caption</span><button class="btn-ghost" onclick="copyBlock('ig')">Kopieer</button></div>
      <div class="out-text" id="out-ig"></div>
    </div>
    <div class="out-block" style="margin-bottom:0;">
      <div class="out-head"><span>YouTube beschrijving</span><button class="btn-ghost" onclick="copyBlock('yt')">Kopieer</button></div>
      <div class="out-text" id="out-yt"></div>
    </div>
  </div>
</div>

<div class="card">
  <div class="footer-row">
    <h2 style="margin:0;">Log</h2>
    <div>
      <button class="btn-ghost" onclick="exportLog()">Export JSON</button>
      <button class="btn-ghost" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importLog(event)">
    </div>
  </div>
  <div id="log-list" style="margin-top:10px;"></div>
</div>

<div class="toast" id="toast">Gekopieerd</div>

<script>
const STORAGE_KEY = 'sixto-postdraft-log-v1';

const PHASE_LABEL = {
  wood:'wood selection', shaping:'shaping', neck:'neck work',
  finish:'finishing', assembly:'assembly', setup:'setup', done:'finished build'
};

const OPENERS = {
  calm: {
    wood:"Starting quiet, with the wood.",
    shaping:"Slow, deliberate work today.",
    neck:"Taking my time with the neck.",
    finish:"Letting the finish do its work.",
    assembly:"Bringing the pieces together, unhurried.",
    setup:"The last, quiet adjustments.",
    done:"It's finished. No rush to say more than that."
  },
  milestone: {
    wood:"Big decision made today.",
    shaping:"Real progress on the body today.",
    neck:"The neck is coming together, and it feels right.",
    finish:"The finish is going on, and the wood is finally showing itself.",
    assembly:"It's starting to look like a guitar.",
    setup:"Final setup &mdash; almost there.",
    done:"Done. This one's ready."
  },
  curious: {
    wood:"Trying something I haven't done before with this wood.",
    shaping:"Experimenting with a shape I haven't cut before.",
    neck:"A new approach to the neck on this one.",
    finish:"Testing a finish approach I haven't used before.",
    assembly:"Curious how these choices come together.",
    setup:"Fine-tuning &mdash; still learning what this one wants to be.",
    done:"Finished, and I learned something new building it."
  },
  technical: {
    wood:"Wood selection, and why it matters here.",
    shaping:"Some notes on the shaping process.",
    neck:"Neck construction notes.",
    finish:"Finish process, in detail.",
    assembly:"Assembly notes.",
    setup:"Setup specs and reasoning.",
    done:"Build complete &mdash; full specs below."
  }
};

const CLOSERS = {
  calm:["More soon.","Following where the wood leads.","Next step when it's ready."],
  milestone:["Proud of where this one's headed.","Can't wait to show you the finished piece.","Onward."],
  curious:["We'll see how it turns out.","Still figuring this one out as I go.","Open to seeing where this leads."],
  technical:["Full build documented as it progresses.","More technical notes to follow.","Next: continuing the build log."]
};

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function buildCaption(d){
  const opener = OPENERS[d.tone][d.phase] || OPENERS.calm[d.phase];
  let lines = [opener, ""];
  lines.push(`Wood: ${d.wood}`);
  if(d.update) lines.push("", d.update);
  if(d.final === 'yes'){
    lines.push("", `${d.project || 'This build'} is complete &mdash; a one-of-one, built from reclaimed and locally sourced wood, finished with a translucent tint so the wood keeps telling its own story.`);
  }
  lines.push("", pick(CLOSERS[d.tone]));
  lines.push("", "#SixtoCustomGuitars #ReclaimedWood #OneOfOne #HandbuiltGuitar");
  return lines.join("\n");
}

function buildYT(d){
  const title = d.project ? `${d.project} &mdash; ${PHASE_LABEL[d.phase]}` : PHASE_LABEL[d.phase];
  let lines = [title, ""];
  lines.push("Origin of the wood:");
  lines.push(d.wood, "");
  lines.push("What happened in this stage:");
  lines.push(d.update || "(add build notes here)", "");
  if(d.feel){
    lines.push("How it feels / sounds right now:");
    lines.push(d.feel, "");
  }
  lines.push("Every Sixto instrument is a one-of-one, built from reclaimed and locally sourced wood in Blaasveld, Belgium. No models, no production line &mdash; every build is designed with the person it's for.");
  lines.push("");
  lines.push("Instagram: @sixtocustomguitars");
  return lines.join("\n");
}

function generate(){
  const wood = document.getElementById('f-wood').value.trim();
  if(!wood){
    document.getElementById('f-wood').style.borderColor = '#c1793f';
    document.getElementById('f-wood').focus();
    return;
  }
  const d = {
    project: document.getElementById('f-project').value.trim(),
    phase: document.getElementById('f-phase').value,
    wood: wood,
    update: document.getElementById('f-update').value.trim(),
    feel: document.getElementById('f-feel').value.trim(),
    tone: document.getElementById('f-tone').value,
    final: document.getElementById('f-final').value
  };
  const ig = buildCaption(d);
  const yt = buildYT(d);
  document.getElementById('out-ig').textContent = ig;
  document.getElementById('out-yt').textContent = yt;
  document.getElementById('output').classList.add('show');
  document.getElementById('output').scrollIntoView({behavior:'smooth', block:'start'});

  saveLog(d, ig, yt);
}

function saveLog(d, ig, yt){
  let log = [];
  try{ log = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ log = []; }
  log.unshift({date: new Date().toISOString(), project: d.project, phase: d.phase, ig, yt});
  log = log.slice(0, 50);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
  renderLog();
}

function renderLog(){
  let log = [];
  try{ log = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ log = []; }
  const el = document.getElementById('log-list');
  if(log.length === 0){ el.innerHTML = '<div class="empty">Nog geen drafts gegenereerd.</div>'; return; }
  el.innerHTML = log.map((e,i) => {
    const d = new Date(e.date);
    const dstr = d.toLocaleDateString('nl-BE', {day:'2-digit', month:'short', year:'numeric'});
    return `<div class="log-entry">
      <div class="lt">${dstr} &middot; ${PHASE_LABEL[e.phase]||e.phase}</div>
      <div class="ll" onclick="loadLog(${i})">${e.project || '(zonder naam)'}</div>
    </div>`;
  }).join('');
}

function loadLog(i){
  let log = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  const e = log[i];
  if(!e) return;
  document.getElementById('out-ig').textContent = e.ig;
  document.getElementById('out-yt').textContent = e.yt;
  document.getElementById('output').classList.add('show');
  document.getElementById('output').scrollIntoView({behavior:'smooth', block:'start'});
}

function copyBlock(which){
  const text = document.getElementById(which === 'ig' ? 'out-ig' : 'out-yt').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1400);
  });
}

function exportLog(){
  const log = localStorage.getItem(STORAGE_KEY) || '[]';
  const blob = new Blob([log], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sixto-postdraft-log-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importLog(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      renderLog();
    }catch(err){ alert('Kon bestand niet lezen.'); }
  };
  reader.readAsText(file);
}

renderLog();
</script>

</body>
</html>
