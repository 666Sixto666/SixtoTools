<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixto Builds</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#171412; --bg2:#1f1b18; --card:#242019; --card2:#2c2620;
  --wood:#b9793f; --wood-d:#8a5a2c; --gold:#d9a15b;
  --text:#f1e9df; --text-dim:#b8ab9c; --line:#3a332b;
  --ok:#5f9e6f; --warn:#c98b3a; --danger:#c05a4d;
  --radius:14px;
  font-size:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:640px;margin:0 auto;padding:0 0 90px 0;min-height:100vh;}

header.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg2),rgba(23,20,18,.96));
  backdrop-filter:blur(6px); padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;
  border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
header.top .brand{display:flex;align-items:center;gap:10px;}
header.top .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--wood),var(--wood-d));
  display:flex;align-items:center;justify-content:center;font-size:18px;}
header.top h1{font-size:17px;margin:0;letter-spacing:.3px;}
header.top .sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
header.top button.icon{background:var(--card2);border:1px solid var(--line);color:var(--text);
  width:38px;height:38px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;}

main{padding:16px;}
h2.section{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);
  margin:22px 0 10px 0;}
h2.section:first-child{margin-top:4px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--wood);color:#1a1310;border:none;border-radius:12px;
  padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);}
.btn.danger{background:var(--danger);color:#fff;}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--wood-d);}
.btn.block{width:100%;}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}

.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:30;
  width:58px;height:58px;border-radius:50%;background:var(--wood);color:#1a1310;font-size:28px;
  border:none;box-shadow:0 6px 20px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;}
.build-card{display:flex;gap:12px;cursor:pointer;}
.build-card .thumb{width:64px;height:64px;border-radius:10px;background:var(--card2);flex-shrink:0;
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--text-dim);}
.build-card .info{flex:1;min-width:0;}
.build-card .name{font-weight:600;font-size:15.5px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.build-card .meta{font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
.progress-bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;}
.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--wood-d),var(--gold));}
.progress-label{font-size:11px;color:var(--text-dim);margin-top:4px;}

.badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:3px 8px;border-radius:20px;}
.badge.progress{background:rgba(201,139,58,.18);color:var(--warn);}
.badge.done{background:rgba(95,158,111,.18);color:var(--ok);}

.empty{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty .icon{font-size:40px;margin-bottom:10px;}

label{display:block;font-size:12.5px;color:var(--text-dim);margin:12px 0 5px 0;}
label:first-child{margin-top:0;}
input[type=text],input[type=date],input[type=number],input[type=url],textarea,select{
  width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;}
textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.phase{margin-bottom:16px;}
.phase-head{display:flex;align-items:center;justify-content:space-between;
  padding:10px 4px;cursor:pointer;}
.phase-head .title{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.phase-head .count{font-size:12px;color:var(--text-dim);}
.phase-progress{height:4px;background:var(--card2);border-radius:3px;margin:0 4px 8px 4px;overflow:hidden;}
.phase-progress>div{height:100%;background:var(--gold);}
.step{display:flex;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:8px 8px 8px 12px;margin-bottom:7px;}
.step.checked{opacity:.55;}
.step .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--wood-d);flex-shrink:0;
  margin-top:-2px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#1a1310;}
.step.checked .box{background:var(--wood);border-color:var(--wood);}
.step .stext{flex:1;font-size:14.5px;line-height:1.35;padding-top:4px;}
.step.checked .stext{text-decoration:line-through;text-decoration-color:var(--text-dim);}
.step .del{color:var(--text-dim);font-size:16px;padding:10px 8px;margin:-8px -6px -8px 0;}
.step-note{width:100%;background:transparent;border:none;border-top:1px dashed var(--line);
  color:var(--text-dim);font-size:12.5px;margin-top:6px;padding-top:6px;font-family:inherit;}

.addstep{display:flex;gap:8px;margin-top:4px;}
.addstep input{flex:1;}

.tpl-steps{list-style:none;margin:0;padding:0;}
.tpl-step{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-bottom:7px;}
.tpl-step.dragging{opacity:.4;}
.tpl-step .drag-handle{cursor:grab;color:var(--text-dim);font-size:15px;flex-shrink:0;}
.phase.dragging{opacity:.4;}
.phase-head .drag-handle{cursor:grab;color:var(--text-dim);font-size:15px;margin-right:6px;}
.tpl-photo-toggle{display:flex;align-items:center;gap:3px;font-size:14px;flex-shrink:0;cursor:pointer;}
.tpl-photo-toggle input{width:auto;accent-color:var(--wood);}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.photo-grid .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card2);}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-grid .ph .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;
  border-radius:50%;width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center;}
.photo-grid .ph .passport-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;
  border-radius:6px;padding:1px 5px;font-size:11px;line-height:1.6;}
.photo-grid .add{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:24px;cursor:pointer;}

.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:6px;}
.spec-grid .sk{font-size:11.5px;color:var(--text-dim);}
.spec-grid .sv{font-size:14px;font-weight:600;}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:20px;}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;}
.lightbox .close{position:absolute;top:20px;right:20px;color:#fff;font-size:26px;}

.confirm-box{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:101;
  background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;
  max-width:400px;margin:0 auto;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.confirm-msg{font-size:15px;line-height:1.5;margin-bottom:18px;}
.confirm-actions{display:flex;gap:10px;}
.confirm-actions button{flex:1;}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px auto;}
.sheet h3{margin:0 0 14px 0;font-size:18px;}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg2);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;background:none;border:none;color:var(--text-dim);padding:10px 4px 8px 4px;
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tabbar button.active{color:var(--gold);}
.tabbar button .ic{font-size:19px;}

.detail-header{margin-bottom:6px;}
.detail-header .type{font-size:12px;color:var(--wood);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.detail-header h2.name{font-size:22px;margin:4px 0 6px 0;}
.detail-header .meta-row{font-size:13px;color:var(--text-dim);}

.actionbar{display:flex;gap:8px;margin:14px 0 4px 0;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card2);
  border:1px solid var(--line);padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:200;
  box-shadow:0 4px 16px rgba(0,0,0,.4);}

.passport-view{position:fixed;inset:0;z-index:110;background:var(--bg);overflow-y:auto;padding:0 0 40px 0;}
.passport-view .pv-topbar{position:sticky;top:0;z-index:2;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
.pv-hero{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.pv-brand{text-align:center;padding:26px 20px 10px 20px;}
.pv-brand .mark{font-size:30px;}
.pv-brand h1{font-family:Georgia,serif;font-size:20px;letter-spacing:2px;margin:8px 0 2px 0;color:var(--gold);text-transform:uppercase;}
.pv-brand .sub{font-size:12px;color:var(--text-dim);letter-spacing:1px;}
.pv-name{text-align:center;font-size:26px;font-weight:700;margin:18px 0 4px 0;padding:0 20px;}
.pv-meta{text-align:center;font-size:13px;color:var(--text-dim);margin-bottom:24px;padding:0 20px;}
.pv-section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);
  padding:0 20px;margin:26px 0 12px 0;}
.pv-specs{padding:0 20px;}
.pv-timeline{padding:0 20px;}
.pv-moment{display:flex;gap:14px;margin-bottom:18px;}
.pv-moment img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex-shrink:0;}
.pv-moment .cap{font-size:13px;line-height:1.4;padding-top:6px;color:var(--text-dim);}
.pv-sig{text-align:center;padding:30px 20px 10px 20px;font-size:13px;color:var(--text-dim);border-top:1px solid var(--line);margin-top:20px;}
.pv-sig .brand{color:var(--gold);font-weight:700;letter-spacing:1px;}

@media print{
  #app, .tabbar, .fab, .pv-topbar { display:none !important; }
  body.printing-passport #overlayRoot > *:not(.passport-view){ display:none !important; }
  .passport-view{position:static !important; background:#fbf7ee !important; color:#221f1a !important; overflow:visible !important;}
  .pv-brand h1, .pv-section-title{ color:#a1652b !important; }
  .pv-name{ color:#221f1a !important; }
  .pv-meta, .pv-moment .cap, .pv-sig{ color:#6c6454 !important; }
  .pv-sig .brand{ color:#a1652b !important; }
  .pv-sig{ border-top:1px solid #e3d9c4 !important; }
  .spec-grid .sk{ color:#6c6454 !important; }
  .spec-grid .sv{ color:#221f1a !important; }
}

a.link{color:var(--gold);text-decoration:underline;word-break:break-all;}
.hidden{display:none !important;}
.filebtn{display:inline-block;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 12px;font-size:14px;text-align:center;cursor:pointer;}
.small-note{font-size:11.5px;color:var(--text-dim);margin-top:8px;line-height:1.4;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark">🎸</div>
      <div>
        <h1>Sixto Builds</h1>
        <div class="sub" id="headerSub">Bibliotheek</div>
      </div>
    </div>
    <button class="icon" onclick="openMenu()">⋯</button>
  </header>
  <main id="main"></main>
</div>

<div class="tabbar">
  <button id="tab-library" class="active" onclick="goto('library')"><span class="ic">📚</span>Bibliotheek</button>
  <button id="tab-todo" onclick="goto('todo')"><span class="ic">📝</span>Te doen</button>
  <button id="tab-active" onclick="goto('active')"><span class="ic">🔨</span>In build</button>
  <button id="tab-checklist" onclick="goto('template')"><span class="ic">✅</span>Checklist</button>
</div>

<button class="fab" onclick="openNewBuildSheet()">+</button>

<div id="overlayRoot"></div>
<div id="modalRoot"></div>

<script>
/* ---------- Storage layer ---------- */
const LS_KEY = 'sixto_builds_v1';
const LS_TEMPLATE_KEY = 'sixto_checklist_template_v1';
const DB_NAME = 'sixtoBuildsDB';
const DB_STORE = 'photos';
let dbPromise = null;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
async function savePhotoBlob(id, dataUrl){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(dataUrl, id);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function getPhotoBlob(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(DB_STORE,'readonly');
    const r = tx.objectStore(DB_STORE).get(id);
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
async function deletePhotoBlob(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}

function loadBuilds(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; }
}
function saveBuilds(builds){ localStorage.setItem(LS_KEY, JSON.stringify(builds)); }

/* ---------- GitHub sync ---------- */
const GH_OWNER = '666sixto666';
const GH_REPO = 'SixtoTools';
const GH_SYNC_PATH = 'data/builds-sync.json';
const GH_TOKEN_KEY = 'sixto_tools_gh_token';
const GH_DIRTY_KEY = 'sixto_tools_dirty_v1';
let syncState = { lastSyncedAt: null, syncing: false, lastError: null };
let ghPushTimer = null;
let dirty = localStorage.getItem(GH_DIRTY_KEY) === '1'; // survives reload: true = a change from a previous session may never have been pushed

function getGhToken(){ return localStorage.getItem(GH_TOKEN_KEY) || ''; }
function setGhToken(t){ if(t) localStorage.setItem(GH_TOKEN_KEY, t); else localStorage.removeItem(GH_TOKEN_KEY); }

function schedulePush(){
  dirty = true;
  localStorage.setItem(GH_DIRTY_KEY, '1');
  if(!getGhToken()) return;
  clearTimeout(ghPushTimer);
  ghPushTimer = setTimeout(()=>{ pushToGitHub(); }, 4000);
}

async function buildSyncPayload(){
  const builds = JSON.parse(JSON.stringify(state.builds));
  for(const b of builds){
    delete b._thumb; delete b._collapsed;
    for(const p of (b.photos||[])){
      p.dataUrl = await getPhotoBlob(p.id);
    }
  }
  return { updatedAt: new Date().toISOString(), template: loadTemplate(), builds };
}

async function applyRemotePayload(payload){
  if(dirty) return; // re-check: a local change may have landed while this pull's network request was in flight
  const builds = payload.builds || [];
  for(const b of builds){
    for(const p of (b.photos||[])){
      if(p.dataUrl){ await savePhotoBlob(p.id, p.dataUrl); delete p.dataUrl; }
    }
  }
  if(dirty) return; // re-check again: photo writes above are also async
  state.builds = builds;
  if(payload.template) saveTemplate(payload.template);
  saveBuilds(state.builds);
}

async function pullFromGitHub(silent){
  if(dirty) return; // don't let a stale remote copy overwrite unsaved local changes
  try{
    const res = await fetch(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${GH_SYNC_PATH}?t=${Date.now()}`, {cache:'no-store'});
    if(dirty) return; // re-check: the fetch above can take a moment, and a checkbox tap may have happened during it
    if(res.status === 404){ return; }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const payload = await res.json();
    if(dirty) return; // re-check once more after parsing the response
    if(payload.updatedAt && payload.updatedAt === syncState.lastSyncedAt) return;
    await applyRemotePayload(payload);
    if(dirty) return; // applyRemotePayload may have aborted internally; don't report a stale sync as successful
    syncState.lastSyncedAt = payload.updatedAt;
    syncState.lastError = null;
    if(!silent){ render(); if(state.currentBuildId) loadPhotos(state.currentBuildId); }
  }catch(e){
    syncState.lastError = e.message;
  }
}

async function pushToGitHub(){
  const token = getGhToken();
  if(!token) return;
  if(syncState.syncing){ schedulePush(); return; } // another push is mid-flight; retry shortly instead of dropping this change silently
  syncState.syncing = true;
  try{
    const payload = await buildSyncPayload();
    const api = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_SYNC_PATH}`;
    let sha = null;
    const getRes = await fetch(api, { headers:{ Authorization:'Bearer '+token, Accept:'application/vnd.github+json' }});
    if(getRes.ok){ const j = await getRes.json(); sha = j.sha; }
    const body = {
      message: 'Sync vanaf Sixto Builds',
      content: btoa(unescape(encodeURIComponent(JSON.stringify(payload)))),
      branch: 'main'
    };
    if(sha) body.sha = sha;
    const putRes = await fetch(api, { method:'PUT', headers:{ Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if(!putRes.ok){ const j = await putRes.json().catch(()=>({})); throw new Error(j.message || ('HTTP '+putRes.status)); }
    syncState.lastSyncedAt = payload.updatedAt;
    syncState.lastError = null;
    dirty = false;
    localStorage.removeItem(GH_DIRTY_KEY);
  }catch(e){
    syncState.lastError = e.message;
  }finally{
    syncState.syncing = false;
  }
}

function fmtDateTime(iso){ if(!iso) return null; try{ return new Date(iso).toLocaleString('nl-BE'); }catch(e){ return iso; } }

async function saveGhToken(){
  const val = document.getElementById('gh-token').value.trim();
  setGhToken(val);
  closeSheet();
  if(val){
    toast('Bezig met synchroniseren...');
    await pullFromGitHub();
    if(!syncState.lastSyncedAt){ await pushToGitHub(); }
    render(); if(state.currentBuildId) loadPhotos(state.currentBuildId);
    toast('Gesynct ✓');
  } else {
    toast('Token verwijderd, sync uitgeschakeld');
  }
}

async function manualSyncClick(){
  toast('Bezig met synchroniseren...');
  await pullFromGitHub();
  await pushToGitHub();
  render(); if(state.currentBuildId) loadPhotos(state.currentBuildId);
  toast(syncState.lastError ? 'Sync mislukt: '+syncState.lastError : 'Gesynct ✓');
}

/* ---------- Default checklist template ---------- */
const DEFAULT_TEMPLATE = [
  {phase:"Intake & Ontwerp", steps:[
    "Concept / ontwerpidee vastgelegd (schets of tekening)",
    "Houtkeuze bepaald (body, hals, toets) en gecontroleerd op voorraad/kwaliteit",
    "Specs blad ingevuld (scale, radius, nutbreedte, vorm, chambering ja/nee)",
    "Referentiefoto's / moodboard verzameld"
  ]},
  {phase:"Hout & Voorbereiding", steps:[
    "Hout geacclimatiseerd / vochtgehalte gecontroleerd",
    {text:"Halsblank uitgezaagd", photoPrompt:true},
    "Bodyblank(s) uitgezaagd / verlijmd indien meerdelig",
    "Fretboard blank voorbereid",
    "Snijplan gemaakt"
  ]},
  {phase:"Hals", steps:[
    "Truss rod kanaal gefreesd",
    "Truss rod geplaatst",
    "Headstock vorm/hoek gemaakt (bv. scarf joint of peghead zagen)",
    "Fretboard op hals gelijmd",
    "Fretboard radius geschuurd",
    "Fret slots gezaagd",
    "Inlays geplaatst (indien van toepassing)",
    "Frets geplaatst",
    {text:"Halsprofiel gecarved (achterkant vorm)", photoPrompt:true},
    "Peghead veneer geplaatst (indien van toepassing)",

function loadTemplate(){
  try{
    const t = JSON.parse(localStorage.getItem(LS_TEMPLATE_KEY));
    if(t && Array.isArray(t)) return t;
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
}
function saveTemplate(t){ localStorage.setItem(LS_TEMPLATE_KEY, JSON.stringify(t)); }

function templateToChecklist(template){
  return template.map(ph=>({
    phase: ph.phase,
    steps: ph.steps.map(s=>({
      id: uid(),
      text: (typeof s === 'string') ? s : s.text,
      photoPrompt: (typeof s === 'object' && !!s.photoPrompt),
      checked: false,
      note: '',
      date: null
    }))
  }));
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ---------- App state ---------- */
let state = { tab: 'library', builds: loadBuilds(), currentBuildId: null };

function persist(){ saveBuilds(state.builds); schedulePush(); }

function getBuild(id){ return state.builds.find(b=>b.id===id); }

function buildProgress(b){
  let total=0, done=0;
  b.checklist.forEach(ph=>ph.steps.forEach(s=>{ total++; if(s.checked) done++; }));
  return {total, done, pct: total? Math.round(done/total*100):0};
}

/* ---------- Rendering ---------- */
function goto(tab){
  state.tab = tab; state.currentBuildId = null;
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  render();
}

function render(){
  const main = document.getElementById('main');
  const sub = document.getElementById('headerSub');
  if(state.currentBuildId){
    sub.textContent = 'Build detail';
    const b = getBuild(state.currentBuildId);
    main.innerHTML = renderBuildDetail(b);
    if(b && b.status === 'in_progress') attachBuildPhaseDragHandlers(b.id);
    return;
  }
  if(state.tab==='library'){ sub.textContent='Bibliotheek'; main.innerHTML = renderLibrary(); }
  else if(state.tab==='todo'){ sub.textContent='Te doen'; main.innerHTML = renderTodo(); }
  else if(state.tab==='active'){ sub.textContent='Lopende builds'; main.innerHTML = renderActive(); }
  else if(state.tab==='template'){ sub.textContent='Standaard checklist'; main.innerHTML = renderTemplateEditor(); attachTemplateDragHandlers(); }
}

function attachTemplateDragHandlers(){
  document.querySelectorAll('.tpl-steps').forEach(list=>{
    const pi = parseInt(list.dataset.phase,10);
    list.querySelectorAll('.tpl-step').forEach(li=>{
      li.addEventListener('dragstart', ()=>{ li.classList.add('dragging'); });
      li.addEventListener('dragend', ()=>{ li.classList.remove('dragging'); commitTemplateOrder(pi, list); });
    });
    list.addEventListener('dragover', (e)=>{
      e.preventDefault();
      const dragging = list.querySelector('.tpl-step.dragging');
      if(!dragging) return;
      const after = getDragAfterElementGeneric(list, e.clientY, '.tpl-step');
      if(after==null) list.appendChild(dragging); else list.insertBefore(dragging, after);
    });
  });
}

function getDragAfterElementGeneric(container, y, selector){
  const items = [...container.querySelectorAll(selector+':not(.dragging)')];
  return items.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset<0 && offset>closest.offset) return {offset, element: child};
    return closest;
  }, {offset:Number.NEGATIVE_INFINITY, element:null}).element;
}

function commitTemplateOrder(pi, list){
  const t = loadTemplate();
  const domOrder = [...list.querySelectorAll('.tpl-step')].map(li=>parseInt(li.dataset.si,10));
  const oldSteps = t[pi].steps;
  const changed = domOrder.some((oldIdx,newIdx)=>oldIdx!==newIdx);
  if(!changed) return;
  t[pi].steps = domOrder.map(oldIdx=>oldSteps[oldIdx]);
  saveTemplate(t);
  render();
}

function attachBuildPhaseDragHandlers(buildId){
  const list = document.getElementById(`phaseList-${buildId}`);
  if(!list) return;
  list.querySelectorAll('.phase').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); commitBuildPhaseOrder(buildId, list); });
  });
  list.addEventListener('dragover', (e)=>{
    e.preventDefault();
    const dragging = list.querySelector('.phase.dragging');
    if(!dragging) return;
    const after = getDragAfterElementGeneric(list, e.clientY, '.phase');
    if(after==null) list.appendChild(dragging); else list.insertBefore(dragging, after);
  });
}

function commitBuildPhaseOrder(buildId, list){
  const b = getBuild(buildId);
  if(!b) return;
  const domOrder = [...list.querySelectorAll('.phase')].map(el=>parseInt(el.dataset.pi,10));
  const oldChecklist = b.checklist;
  const changed = domOrder.some((oldIdx,newIdx)=>oldIdx!==newIdx);
  if(!changed) return;
  b.checklist = domOrder.map(oldIdx=>oldChecklist[oldIdx]);
  persist();
  render();
}

function nextSteps(b, limit){
  const out = [];
  for(let pi=0; pi<b.checklist.length; pi++){
    const ph = b.checklist[pi];
    for(let si=0; si<ph.steps.length; si++){
      const s = ph.steps[si];
      if(!s.checked){
        out.push({phase: ph.phase, text: s.text, pi, si});
        if(out.length>=limit) return out;
      }
    }
  }
  return out;
}

function renderTodo(){
  const active = state.builds.filter(b=>b.status==='in_progress');
  if(active.length===0){
    return `<div class="empty"><div class="icon">📝</div><div>Geen lopende builds.<br>Start een build om hier je eerstvolgende stappen te zien.</div></div>`;
  }
  const sorted = [...active].sort((a,b)=>{
    const ta = a.specs && a.specs.targetDate;
    const tb = b.specs && b.specs.targetDate;
    if(ta && tb) return ta.localeCompare(tb);
    if(ta && !tb) return -1;
    if(!ta && tb) return 1;
    return (a.startDate||'').localeCompare(b.startDate||'');
  });
  let html = `<h2 class="section">Volgende stappen (${sorted.length} build${sorted.length!==1?'s':''})</h2>`;
  sorted.forEach(b=>{ html += renderTodoCard(b); });
  return html;
}

function renderTodoCard(b){
  const steps = nextSteps(b, 3);
  const p = buildProgress(b);
  const thumbStyle = b._thumb ? `style="background-image:url('${b._thumb}')"` : '';
  let stepsHtml;
  if(steps.length===0){
    stepsHtml = `<div class="small-note" style="color:var(--ok);margin-top:10px;">✓ Alle stappen afgevinkt — klaar om af te ronden.</div>`;
  } else {
    stepsHtml = `<div style="margin-top:10px;">` + steps.map(st=>`<div class="step" onclick="toggleStep('${b.id}',${st.pi},${st.si})" style="cursor:pointer;">
      <div class="box"></div>
      <div class="stext"><span style="color:var(--text-dim);font-size:11.5px;">${esc(st.phase)}</span><br>${esc(st.text)}</div>
    </div>`).join('') + `</div>`;
  }
  return `<div class="card">
    <div class="build-card" style="cursor:pointer;" onclick="openBuild('${b.id}')">
      <div class="thumb" ${thumbStyle}>${b._thumb?'':'🎸'}</div>
      <div class="info">
        <div class="name">${esc(b.name||'Naamloze build')}</div>
        <div class="meta">${esc(b.type||'')}${b.client?' · '+esc(b.client):''}</div>
        <div class="progress-bar"><div style="width:${p.pct}%"></div></div>
        <div class="progress-label">${p.done}/${p.total} stappen · ${p.pct}%</div>
      </div>
    </div>
    ${stepsHtml}
  </div>`;
}

function renderLibrary(){

function renderActive(){

      ? `<button class="btn small" onclick="openCompleteSheet('${b.id}')">✓ Markeer voltooid</button>`
      : `<button class="btn secondary small" onclick="reopenBuild('${b.id}')">↺ Heropen build</button>`}

  html += `<h2 class="section">Specs</h2><div class="card"><div class="spec-grid">${renderSpecGrid(b.specs)}</div></div>`;

  </div>`;

  html += `<h2 class="section">Geluidsdemo</h2><div class="card">

    ['neckWood','Hals hout'],['fretboardWood','Toets hout'],['scaleLength','Mensuur'],

    ['bridge','Brug/zadel'],['electronics','Elektronica'],['finishType','Finish type'],

function openBuild(id){ state.currentBuildId = id; render(); loadPhotos(id); }
function backToList(){ state.currentBuildId = null; render(); }

async function loadPhotos(buildId){
  const b = getBuild(buildId);
  const grid = document.getElementById('photoGrid-'+buildId);
  if(!grid) return;
  if(!b.photos || b.photos.length===0){
    grid.innerHTML = `<div class="ph add" onclick="triggerPhotoUpload('${buildId}')">+</div>`;
    return;
  }
  let html = '';
  for(const p of b.photos){
    const url = await getPhotoBlob(p.id);
    html += `<div class="ph"><img src="${url}" onclick="showLightbox('${url}')">${p.passport?'<div class="passport-badge" title="'+escAttr(p.caption||'')+'">📷</div>':''}<div class="rm" onclick="removePhoto('${buildId}','${p.id}')">✕</div></div>`;
  }
  html += `<div class="ph add" onclick="triggerPhotoUpload('${buildId}')">+</div>`;
  grid.innerHTML = html;
  if(b.photos.length){
    getPhotoBlob(b.photos[0].id).then(url=>{ b._thumb = url; });
  }
}

function triggerPhotoUpload(buildId, momentLabel){
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.multiple=true;
  input.onchange = async (e)=>{
    const files = Array.from(e.target.files);
    for(const f of files){
      const dataUrl = await fileToDataUrl(f, 1600);
      const id = uid();
      await savePhotoBlob(id, dataUrl);
      const b = getBuild(buildId);
      b.photos = b.photos || [];
      b.photos.push({id, caption: momentLabel || '', passport: !!momentLabel});
    }
    persist();
    loadPhotos(buildId);
  };
  input.click();
}

function fileToDataUrl(file, maxDim){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function removePhoto(buildId, photoId){
  const b = getBuild(buildId);
  b.photos = b.photos.filter(p=>p.id!==photoId);
  persist();
  await deletePhotoBlob(photoId);
  loadPhotos(buildId);
}

async function openPassport(buildId){
  const b = getBuild(buildId);
  if(!b) return;
  const passportPhotos = (b.photos||[]).filter(p=>p.passport);
  const heroSource = passportPhotos.length ? passportPhotos[passportPhotos.length-1] : (b.photos||[])[0];
  const heroUrl = heroSource ? await getPhotoBlob(heroSource.id) : null;

  let timelineHtml = '';
  for(const p of passportPhotos){
    const url = await getPhotoBlob(p.id);
    timelineHtml += `<div class="pv-moment"><img src="${url}"><div class="cap">${esc(p.caption||'')}</div></div>`;

// Native confirm()/alert() are unreliable in iOS home-screen ("Zet op beginscherm") standalone
// mode — on some iOS versions they don't appear at all. This is a self-drawn replacement so
// destructive actions behave identically whether opened in Safari or from the home screen.
function appConfirm(message){
  return new Promise((resolve)=>{
    const root = document.getElementById('modalRoot');
    root.innerHTML = `<div class="sheet-overlay"></div>
      <div class="confirm-box">
        <div class="confirm-msg">${esc(message)}</div>
        <div class="confirm-actions">
          <button class="btn secondary" id="confirm-cancel">Annuleer</button>
          <button class="btn danger" id="confirm-ok">Bevestig</button>
        </div>
      </div>`;
    document.getElementById('confirm-ok').onclick = ()=>{ root.innerHTML=''; resolve(true); };
    document.getElementById('confirm-cancel').onclick = ()=>{ root.innerHTML=''; resolve(false); };
  });
}

function appAlert(message){
  return new Promise((resolve)=>{
    const root = document.getElementById('modalRoot');
    root.innerHTML = `<div class="sheet-overlay"></div>
      <div class="confirm-box">
        <div class="confirm-msg">${esc(message)}</div>
        <div class="confirm-actions">
          <button class="btn" id="alert-ok">Ok</button>
        </div>
      </div>`;
    document.getElementById('alert-ok').onclick = ()=>{ root.innerHTML=''; resolve(); };
  });
}

function appPrompt(message, defaultValue){
  return new Promise((resolve)=>{
    const root = document.getElementById('modalRoot');
    root.innerHTML = `<div class="sheet-overlay"></div>
      <div class="confirm-box">
        <div class="confirm-msg">${esc(message)}</div>
        <input type="text" id="prompt-input" value="${escAttr(defaultValue||'')}" style="margin-bottom:14px;">
        <div class="confirm-actions">
          <button class="btn secondary" id="prompt-cancel">Annuleer</button>
          <button class="btn" id="prompt-ok">Ok</button>
        </div>
      </div>`;
    const input = document.getElementById('prompt-input');
    input.focus(); input.select();
    document.getElementById('prompt-ok').onclick = ()=>{ const v = input.value; root.innerHTML=''; resolve(v); };
    document.getElementById('prompt-cancel').onclick = ()=>{ root.innerHTML=''; resolve(null); };
  });
}

/* ---------- Checklist actions ---------- */
function toggleStep(buildId,pi,si){
  const b = getBuild(buildId);
  const ph = b.checklist[pi];
  const s = ph.steps[si];
  const wasChecked = s.checked;
  s.checked = !s.checked;
  s.date = s.checked ? todayStr() : null;
  const shouldPromptPhoto = !wasChecked && s.checked && s.photoPrompt;
  const momentLabel = `${ph.phase} — ${s.text}`;
  persist(); render(); loadPhotos(buildId);
  if(shouldPromptPhoto){
    triggerPhotoUpload(buildId, momentLabel);
    queuePendingPost(buildId, b.name, ph.phase, s.text, momentLabel);
  }
}

/* ---------- Pending post suggestions (shared with Post Draft, sixto_pending_posts_v1) ----------
   Read-only from Builds' perspective beyond appending: Post Draft consumes/removes entries.
   Purely additive suggestion queue -- never required, Post Draft keeps working exactly as before. */
const PENDING_POSTS_KEY = 'sixto_pending_posts_v1';
function queuePendingPost(buildId, buildName, phase, stepText, momentLabel){
  let queue = [];
  try{ queue = JSON.parse(localStorage.getItem(PENDING_POSTS_KEY)) || []; }catch(e){ queue = []; }
  queue.unshift({
    id: uid(),
    buildId, buildName: buildName || '', phase: phase || '', stepText: stepText || '',
    momentLabel: momentLabel || '', date: new Date().toISOString()
  });
  queue = queue.slice(0, 30);
  localStorage.setItem(PENDING_POSTS_KEY, JSON.stringify(queue));
}

async function pushAppUpdate(){
  const token = getGhToken();
  const statusEl = document.getElementById('app-update-status');
  if(!token){ await appAlert('Stel eerst hierboven je GitHub token in en bewaar het.'); return; }
  const code = document.getElementById('app-update-code').value;
  if(!code.trim()){ await appAlert('Plak eerst de nieuwe code in het veld.'); return; }
  if(!code.trim().startsWith('<!DOCTYPE html>') || !code.trim().endsWith('</html>')){
    await appAlert('Dit lijkt geen volledig HTML-bestand (moet starten met <!DOCTYPE html> en eindigen met </html>). Niets gepusht, ter veiligheid.');
    return;
  }
  if(!(await appConfirm('Dit vervangt builds.html live op GitHub Pages meteen voor alle toestellen. Weet je zeker dat dit de volledige, correcte nieuwe versie is?'))) return;
  statusEl.textContent = 'Bezig met pushen...';
  try{
    const api = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/builds.html`;
    const getRes = await fetch(api, { headers:{ Authorization:'Bearer '+token, Accept:'application/vnd.github+json' }});
    if(!getRes.ok) throw new Error('Kon huidige bestand niet ophalen (HTTP '+getRes.status+')');
    const meta = await getRes.json();
    const body = {
      message: 'App-update via ingebouwde updateknop',
      content: btoa(unescape(encodeURIComponent(code))),
      branch: 'main',
      sha: meta.sha
    };
    const putRes = await fetch(api, { method:'PUT', headers:{ Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if(!putRes.ok){ const j = await putRes.json().catch(()=>({})); throw new Error(j.message || ('HTTP '+putRes.status)); }
    statusEl.textContent = 'Gepusht ✓ — GitHub Pages herbouwt binnen ~1 minuut. Herlaad de app dan.';
    toast('App-update gepusht ✓');
  }catch(e){
    statusEl.textContent = 'Mislukt: '+e.message;
  }
}

async function exportData(){
  const builds = JSON.parse(JSON.stringify(state.builds));
  for(const b of builds){
    delete b._thumb; delete b._collapsed;
    for(const p of (b.photos||[])){
      p.dataUrl = await getPhotoBlob(p.id);
    }
  }
  const payload = { exportedAt: new Date().toISOString(), template: loadTemplate(), builds };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `sixto-builds-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Back-up gedownload ✓');
}

async function importData(){
  const input = document.getElementById('importFile');
  const file = input.files[0];
  if(!file){ await appAlert('Kies eerst een back-up bestand.'); return; }
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const payload = JSON.parse(e.target.result);
      if(!(await appConfirm('Importeren voegt builds toe aan je huidige bibliotheek (bestaande builds blijven staan). Doorgaan?'))) return;
      if(payload.template) saveTemplate(payload.template);
      for(const b of (payload.builds||[])){
        for(const p of (b.photos||[])){
          if(p.dataUrl){ await savePhotoBlob(p.id, p.dataUrl); delete p.dataUrl; }
        }
        b.id = b.id || uid();
        if(state.builds.find(x=>x.id===b.id)) b.id = uid();
        state.builds.push(b);
      }
      persist();
      closeSheet(); render();
      toast('Import voltooid ✓');
    }catch(err){
      await appAlert('Kon bestand niet lezen: '+err.message);
    }
  };
  reader.readAsText(file);
}

/* ---------- Utils ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s).replace(/`/g,'&#96;'); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '-'; const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s; return d.toLocaleDateString('nl-BE',{day:'numeric',month:'short',year:'numeric'}); }
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ---------- Init ---------- */
(async function initApp(){
  if(getGhToken()){
    if(dirty){
      // A change from a previous visit may never have made it to GitHub — try to
      // send it now before touching anything from the server, so we never pull
      // a stale copy on top of an unsynced local edit.
      await pushToGitHub();
    }
    await pullFromGitHub(true);
  }
  render();
  setInterval(()=>{ if(document.visibilityState==='visible') pullFromGitHub(); }, 30000);
  // Best-effort: try to flush a pending push the moment the app is backgrounded/closed,
  // so the 4s debounce window rarely gets the chance to be interrupted in the first place.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden' && dirty && getGhToken()){
      clearTimeout(ghPushTimer);
      pushToGitHub();
    }
  });
})();
</script>
