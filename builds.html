<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixto Builds</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#171412; --bg2:#1f1b18; --card:#242019; --card2:#2c2620;
  --wood:#b9793f; --wood-d:#8a5a2c; --gold:#d9a15b;
  --text:#f1e9df; --text-dim:#b8ab9c; --line:#3a332b;
  --ok:#5f9e6f; --warn:#c98b3a; --danger:#c05a4d;
  --radius:14px;
  font-size:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:640px;margin:0 auto;padding:0 0 90px 0;min-height:100vh;}

header.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg2),rgba(23,20,18,.96));
  backdrop-filter:blur(6px); padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;
  border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
header.top .brand{display:flex;align-items:center;gap:10px;}
header.top .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--wood),var(--wood-d));
  display:flex;align-items:center;justify-content:center;font-size:18px;}
header.top h1{font-size:17px;margin:0;letter-spacing:.3px;}
header.top .sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
header.top button.icon{background:var(--card2);border:1px solid var(--line);color:var(--text);
  width:38px;height:38px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;}

main{padding:16px;}
h2.section{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);
  margin:22px 0 10px 0;}
h2.section:first-child{margin-top:4px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--wood);color:#1a1310;border:none;border-radius:12px;
  padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);}
.btn.danger{background:var(--danger);color:#fff;}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--wood-d);}
.btn.block{width:100%;}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}

.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:30;
  width:58px;height:58px;border-radius:50%;background:var(--wood);color:#1a1310;font-size:28px;
  border:none;box-shadow:0 6px 20px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;}
.build-card{display:flex;gap:12px;cursor:pointer;}
.build-card .thumb{width:64px;height:64px;border-radius:10px;background:var(--card2);flex-shrink:0;
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--text-dim);}
.build-card .info{flex:1;min-width:0;}
.build-card .name{font-weight:600;font-size:15.5px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.build-card .meta{font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
.progress-bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;}
.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--wood-d),var(--gold));}
.progress-label{font-size:11px;color:var(--text-dim);margin-top:4px;}

.badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:3px 8px;border-radius:20px;}
.badge.progress{background:rgba(201,139,58,.18);color:var(--warn);}
.badge.done{background:rgba(95,158,111,.18);color:var(--ok);}

.empty{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty .icon{font-size:40px;margin-bottom:10px;}

label{display:block;font-size:12.5px;color:var(--text-dim);margin:12px 0 5px 0;}
label:first-child{margin-top:0;}
input[type=text],input[type=date],input[type=number],input[type=url],textarea,select{
  width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;}
textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.phase{margin-bottom:16px;}
.phase-head{display:flex;align-items:center;justify-content:space-between;
  padding:10px 4px;cursor:pointer;}
.phase-head .title{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.phase-head .count{font-size:12px;color:var(--text-dim);}
.phase-progress{height:4px;background:var(--card2);border-radius:3px;margin:0 4px 8px 4px;overflow:hidden;}
.phase-progress>div{height:100%;background:var(--gold);}
.step{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:7px;}
.step.checked{opacity:.55;}
.step .box{width:23px;height:23px;border-radius:7px;border:2px solid var(--wood-d);flex-shrink:0;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#1a1310;}
.step.checked .box{background:var(--wood);border-color:var(--wood);}
.step .stext{flex:1;font-size:14.5px;line-height:1.35;}
.step.checked .stext{text-decoration:line-through;text-decoration-color:var(--text-dim);}
.step .del{color:var(--text-dim);font-size:16px;padding:2px 4px;}
.step-note{width:100%;background:transparent;border:none;border-top:1px dashed var(--line);
  color:var(--text-dim);font-size:12.5px;margin-top:6px;padding-top:6px;font-family:inherit;}

.addstep{display:flex;gap:8px;margin-top:4px;}
.addstep input{flex:1;}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.photo-grid .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card2);}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-grid .ph .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;
  border-radius:50%;width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center;}
.photo-grid .add{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:24px;cursor:pointer;}

.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:6px;}
.spec-grid .sk{font-size:11.5px;color:var(--text-dim);}
.spec-grid .sv{font-size:14px;font-weight:600;}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:20px;}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;}
.lightbox .close{position:absolute;top:20px;right:20px;color:#fff;font-size:26px;}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px auto;}
.sheet h3{margin:0 0 14px 0;font-size:18px;}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg2);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;background:none;border:none;color:var(--text-dim);padding:10px 4px 8px 4px;
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tabbar button.active{color:var(--gold);}
.tabbar button .ic{font-size:19px;}

.detail-header{margin-bottom:6px;}
.detail-header .type{font-size:12px;color:var(--wood);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.detail-header h2.name{font-size:22px;margin:4px 0 6px 0;}
.detail-header .meta-row{font-size:13px;color:var(--text-dim);}

.actionbar{display:flex;gap:8px;margin:14px 0 4px 0;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card2);
  border:1px solid var(--line);padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:200;
  box-shadow:0 4px 16px rgba(0,0,0,.4);}

a.link{color:var(--gold);text-decoration:underline;word-break:break-all;}
.hidden{display:none !important;}
.filebtn{display:inline-block;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 12px;font-size:14px;text-align:center;cursor:pointer;}
.small-note{font-size:11.5px;color:var(--text-dim);margin-top:8px;line-height:1.4;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark">🎸</div>
      <div>
        <h1>Sixto Builds</h1>
        <div class="sub" id="headerSub">Bibliotheek</div>
      </div>
    </div>
    <button class="icon" onclick="openMenu()">⋯</button>
  </header>
  <main id="main"></main>
</div>

<div class="tabbar">
  <button id="tab-library" class="active" onclick="goto('library')"><span class="ic">📚</span>Bibliotheek</button>
  <button id="tab-active" onclick="goto('active')"><span class="ic">🔨</span>In build</button>
  <button id="tab-checklist" onclick="goto('template')"><span class="ic">✅</span>Checklist</button>
</div>

<button class="fab" onclick="openNewBuildSheet()">+</button>

<div id="overlayRoot"></div>

<script>
/* ---------- Storage layer ---------- */
const LS_KEY = 'sixto_builds_v1';
const LS_TEMPLATE_KEY = 'sixto_checklist_template_v1';
const DB_NAME = 'sixtoBuildsDB';
const DB_STORE = 'photos';
let dbPromise = null;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
async function savePhotoBlob(id, dataUrl){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(dataUrl, id);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function getPhotoBlob(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(DB_STORE,'readonly');
    const r = tx.objectStore(DB_STORE).get(id);
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
async function deletePhotoBlob(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}

function loadBuilds(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; }
}
function saveBuilds(builds){ localStorage.setItem(LS_KEY, JSON.stringify(builds)); }

/* ---------- GitHub sync ---------- */
const GH_OWNER = '666sixto666';
const GH_REPO = 'SixtoTools';
const GH_SYNC_PATH = 'data/builds-sync.json';
const GH_TOKEN_KEY = 'sixto_tools_gh_token';
let syncState = { lastSyncedAt: null, syncing: false, lastError: null };
let ghPushTimer = null;

function getGhToken(){ return localStorage.getItem(GH_TOKEN_KEY) || ''; }
function setGhToken(t){ if(t) localStorage.setItem(GH_TOKEN_KEY, t); else localStorage.removeItem(GH_TOKEN_KEY); }

function schedulePush(){
  if(!getGhToken()) return;
  clearTimeout(ghPushTimer);
  ghPushTimer = setTimeout(()=>{ pushToGitHub(); }, 4000);
}

async function buildSyncPayload(){
  const builds = JSON.parse(JSON.stringify(state.builds));
  for(const b of builds){
    delete b._thumb; delete b._collapsed;
    for(const p of (b.photos||[])){
      p.dataUrl = await getPhotoBlob(p.id);
    }
  }
  return { updatedAt: new Date().toISOString(), template: loadTemplate(), builds };
}

async function applyRemotePayload(payload){
  const builds = payload.builds || [];
  for(const b of builds){
    for(const p of (b.photos||[])){
      if(p.dataUrl){ await savePhotoBlob(p.id, p.dataUrl); delete p.dataUrl; }
    }
  }
  state.builds = builds;
  if(payload.template) saveTemplate(payload.template);
  saveBuilds(state.builds);
}

async function pullFromGitHub(silent){
  try{
    const res = await fetch(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${GH_SYNC_PATH}?t=${Date.now()}`, {cache:'no-store'});
    if(res.status === 404){ return; }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const payload = await res.json();
    if(payload.updatedAt && payload.updatedAt === syncState.lastSyncedAt) return;
    await applyRemotePayload(payload);
    syncState.lastSyncedAt = payload.updatedAt;
    syncState.lastError = null;
    if(!silent){ render(); if(state.currentBuildId) loadPhotos(state.currentBuildId); }
  }catch(e){
    syncState.lastError = e.message;
  }
}

async function pushToGitHub(){
  const token = getGhToken();
  if(!token) return;
  syncState.syncing = true;
  try{
    const payload = await buildSyncPayload();
    const api = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_SYNC_PATH}`;
    let sha = null;
    const getRes = await fetch(api, { headers:{ Authorization:'Bearer '+token, Accept:'application/vnd.github+json' }});
    if(getRes.ok){ const j = await getRes.json(); sha = j.sha; }
    const body = {
      message: 'Sync vanaf Sixto Builds',
      content: btoa(unescape(encodeURIComponent(JSON.stringify(payload)))),
      branch: 'main'
    };
    if(sha) body.sha = sha;
    const putRes = await fetch(api, { method:'PUT', headers:{ Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if(!putRes.ok){ const j = await putRes.json().catch(()=>({})); throw new Error(j.message || ('HTTP '+putRes.status)); }
    syncState.lastSyncedAt = payload.updatedAt;
    syncState.lastError = null;
  }catch(e){
    syncState.lastError = e.message;
  }finally{
    syncState.syncing = false;
  }
}

function fmtDateTime(iso){ if(!iso) return null; try{ return new Date(iso).toLocaleString('nl-BE'); }catch(e){ return iso; } }

async function saveGhToken(){
  const val = document.getElementById('gh-token').value.trim();
  setGhToken(val);
  closeSheet();
  if(val){
    toast('Bezig met synchroniseren...');
    await pullFromGitHub();
    if(!syncState.lastSyncedAt){ await pushToGitHub(); }
    render(); if(state.currentBuildId) loadPhotos(state.currentBuildId);
    toast('Gesynct ✓');
  } else {
    toast('Token verwijderd, sync uitgeschakeld');
  }
}

async function manualSyncClick(){
  toast('Bezig met synchroniseren...');
  await pullFromGitHub();
  await pushToGitHub();
  render(); if(state.currentBuildId) loadPhotos(state.currentBuildId);
  toast(syncState.lastError ? 'Sync mislukt: '+syncState.lastError : 'Gesynct ✓');
}

/* ---------- Default checklist template ---------- */
const DEFAULT_TEMPLATE = [
  {phase:"Intake & Ontwerp", steps:[
    "Concept / ontwerpidee vastgelegd (schets of tekening)",
    "Houtkeuze bepaald (body, hals, toets) en gecontroleerd op voorraad/kwaliteit",
    "Specs blad ingevuld (scale, radius, nutbreedte, vorm, chambering ja/nee)",
    "Referentiefoto's / moodboard verzameld"
  ]},
  {phase:"Hout & Voorbereiding", steps:[
    "Hout geacclimatiseerd / vochtgehalte gecontroleerd",
    "Halsblank uitgezaagd",
    "Bodyblank(s) uitgezaagd / verlijmd indien meerdelig",
    "Fretboard blank voorbereid",
    "Snijplan gemaakt"
  ]},
  {phase:"Hals", steps:[
    "Truss rod kanaal gefreesd",
    "Truss rod geplaatst",
    "Headstock vorm/hoek gemaakt (bv. scarf joint of peghead zagen)",
    "Peghead veneer geplaatst (indien van toepassing)",
    "Fretboard radius geschuurd",
    "Fret slots gezaagd",
    "Inlays geplaatst (indien van toepassing)",
    "Fretboard op hals gelijmd",
    "Halsprofiel gecarved (achterkant vorm)",
    "Frets geplaatst",
    "Hals fijn afgewerkt/geschuurd rond de frets, klaar voor lak/was"
  ]},
  {phase:"Body", steps:[
    "Body vorm uitgezaagd/gefreesd (template routing)",
    "Chambering/uitholling gefreesd (indien semi-hollow/chambered)",
    "Pickup cavities gefreesd",
    "Control cavity + kabelkanalen gefreesd",
    "Neck pocket gefreesd (bolt-on) of neck joint voorbereid (set-neck)",
    "Top carving/contouring (indien van toepassing)",
    "Belly cut / arm bevel geschaafd",
    "Body klaar voor afwerking (laatste schuurronde)"
  ]},
  {phase:"Assemblage", steps:[
    "Neck-to-body fit gecontroleerd",
    "Neck vastgezet (lijm/bouten)"
  ]},
  {phase:"Afwerking – Body", steps:[
    "Kleur aangebracht (mica + aceton beits op het hout)",
    "Blanke lak lagen aangebracht",
    "Uitharding afgewacht",
    "Polijsten/buffen"
  ]},
  {phase:"Afwerking – Hals", steps:[
    "Hals geschuurd tot eindkorrel",
    "Bijenwas aangebracht",
    "Gepolijst/gebufferd"
  ]},
  {phase:"Hardware & Elektronica", steps:[
    "Bridge/tailpiece gemonteerd",
    "Tuners gemonteerd",
    "Pickups gemonteerd",
    "Elektronica bedraad (potmeters, schakelaar, jack)",
    "Elektronica getest"
  ]},
  {phase:"Setup & String-up", steps:[
    "Zaagsnede (nut) gemaakt en afgesteld",
    "Eerste besnaring",
    "Action ingesteld",
    "Intonatie ingesteld"
  ]},
  {phase:"QC & Speeltest", steps:[
    "Visuele eindinspectie (finish, frets, hardware)",
    "Speelbaarheid getest over volledige hals",
    "Geluid getest / beoordeeld",
    "Geluidsdemo opgenomen",
    "Eindfoto's gemaakt (studio/daglicht)"
  ]},
  {phase:"Oplevering & Archief", steps:[
    "Gewicht en finale specs genoteerd",
    "Eindnotities geschreven",
    "Klant overdracht / verzending (indien van toepassing)",
    "Build gearchiveerd in bibliotheek"
  ]}
];

function loadTemplate(){
  try{
    const t = JSON.parse(localStorage.getItem(LS_TEMPLATE_KEY));
    if(t && Array.isArray(t)) return t;
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
}
function saveTemplate(t){ localStorage.setItem(LS_TEMPLATE_KEY, JSON.stringify(t)); }

function templateToChecklist(template){
  return template.map(ph=>({
    phase: ph.phase,
    steps: ph.steps.map(s=>({
      id: uid(),
      text: (typeof s === 'string') ? s : s.text,
      checked: false,
      note: '',
      date: null
    }))
  }));
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ---------- App state ---------- */
let state = { tab: 'library', builds: loadBuilds(), currentBuildId: null };

function persist(){ saveBuilds(state.builds); schedulePush(); }

function getBuild(id){ return state.builds.find(b=>b.id===id); }

function buildProgress(b){
  let total=0, done=0;
  b.checklist.forEach(ph=>ph.steps.forEach(s=>{ total++; if(s.checked) done++; }));
  return {total, done, pct: total? Math.round(done/total*100):0};
}

/* ---------- Rendering ---------- */
function goto(tab){
  state.tab = tab; state.currentBuildId = null;
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  render();
}

function render(){
  const main = document.getElementById('main');
  const sub = document.getElementById('headerSub');
  if(state.currentBuildId){
    sub.textContent = 'Build detail';
    main.innerHTML = renderBuildDetail(getBuild(state.currentBuildId));
    return;
  }
  if(state.tab==='library'){ sub.textContent='Bibliotheek'; main.innerHTML = renderLibrary(); }
  else if(state.tab==='active'){ sub.textContent='Lopende builds'; main.innerHTML = renderActive(); }
  else if(state.tab==='template'){ sub.textContent='Standaard checklist'; main.innerHTML = renderTemplateEditor(); }
}

function renderLibrary(){
  const done = state.builds.filter(b=>b.status==='completed').sort((a,b)=>(b.completedDate||'').localeCompare(a.completedDate||''));
  if(done.length===0){
    return `<div class="empty"><div class="icon">📚</div><div>Nog geen afgewerkte builds.<br>Voltooide builds verschijnen hier met foto's, specs en geluidsdemo.</div></div>`;
  }
  return `<h2 class="section">Afgewerkte builds (${done.length})</h2>` + done.map(renderBuildCard).join('');
}

function renderActive(){
  const active = state.builds.filter(b=>b.status==='in_progress').sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
  if(active.length===0){
    return `<div class="empty"><div class="icon">🔨</div><div>Geen lopende builds.<br>Tik op + om een nieuwe build te starten.</div></div>`;
  }
  return `<h2 class="section">In build (${active.length})</h2>` + active.map(renderBuildCard).join('');
}

function renderBuildCard(b){
  const p = buildProgress(b);
  const thumbStyle = b._thumb ? `style="background-image:url('${b._thumb}')"` : '';

  });

  html += `<button class="btn ghost block" style="margin-top:10px;" onclick="saveAsTemplate('${b.id}')">💾 Bewaar deze checklist als standaard</button>`;

  return html;

function renderStep(b,pi,si,s){
  return `<div class="step ${s.checked?'checked':''}">
    <div class="box" onclick="toggleStep('${b.id}',${pi},${si})">${s.checked?'✓':''}</div>
    <div class="stext">
      ${esc(s.text)}
      <textarea class="step-note" placeholder="Notitie (optioneel)" onchange="updateStepNote('${b.id}',${pi},${si},this.value)">${esc(s.note||'')}</textarea>
    </div>
    <div class="del" onclick="deleteBuildStep('${b.id}',${pi},${si})">✕</div>
  </div>`;
}

function renderSpecGrid(sp){
  sp = sp || {};
  const fields = [
    ['bodyModel','Model / body vorm'],['topWood','Top hout'],['backSidesWood','Back/sides hout'],
    ['neckWood','Hals hout'],['fretboardWood','Toets hout'],['scaleLength','Mensuur'],
    ['nutWidth','Nutbreedte'],['fretboardRadius','Fretboard radius'],['frets','Aantal frets'],['tuners','Mechanieken'],
    ['bridge','Brug/zadel'],['electronics','Elektronica'],['finishType','Finish type'],
    ['weight','Gewicht'],['targetDate','Streefdatum']
  ];
  return fields.map(([k,label])=>{
    const v = sp[k];
    if(!v) return '';
    return `<div><div class="sk">${label}</div><div class="sv">${esc(v)}</div></div>`;
  }).join('') || `<div class="small-note">Nog geen specs ingevuld. Tik op "Bewerk info".</div>`;

/* ---------- Actions: navigation ---------- */
function openBuild(id){ state.currentBuildId = id; render(); loadPhotos(id); }
function backToList(){ state.currentBuildId = null; render(); }

async function loadPhotos(buildId){
  const b = getBuild(buildId);
  const grid = document.getElementById('photoGrid-'+buildId);
  if(!grid) return;
  if(!b.photos || b.photos.length===0){
    grid.innerHTML = `<div class="ph add" onclick="triggerPhotoUpload('${buildId}')">+</div>`;
    return;
  }
  let html = '';
  for(const p of b.photos){
    const url = await getPhotoBlob(p.id);
    html += `<div class="ph"><img src="${url}" onclick="showLightbox('${url}')"><div class="rm" onclick="removePhoto('${buildId}','${p.id}')">✕</div></div>`;
  }
  html += `<div class="ph add" onclick="triggerPhotoUpload('${buildId}')">+</div>`;
  grid.innerHTML = html;
  if(b.photos.length){
    getPhotoBlob(b.photos[0].id).then(url=>{ b._thumb = url; });
  }
}

function triggerPhotoUpload(buildId){
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.multiple=true;
  input.onchange = async (e)=>{
    const files = Array.from(e.target.files);
    for(const f of files){
      const dataUrl = await fileToDataUrl(f, 1600);
      const id = uid();
      await savePhotoBlob(id, dataUrl);
      const b = getBuild(buildId);
      b.photos = b.photos || [];
      b.photos.push({id, caption:''});
    }
    persist();
    loadPhotos(buildId);
  };
  input.click();
}

function fileToDataUrl(file, maxDim){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else { width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function removePhoto(buildId, photoId){
  const b = getBuild(buildId);
  b.photos = b.photos.filter(p=>p.id!==photoId);
  persist();
  await deletePhotoBlob(photoId);
  loadPhotos(buildId);
}

function showLightbox(url){
  const root = document.getElementById('overlayRoot');
  root.innerHTML = `<div class="lightbox" onclick="closeLightbox()"><div class="close">✕</div><img src="${url}"></div>`;
}
function closeLightbox(){ document.getElementById('overlayRoot').innerHTML=''; }

/* ---------- Checklist actions ---------- */
function toggleStep(buildId,pi,si){
  const b = getBuild(buildId);
  const s = b.checklist[pi].steps[si];
  s.checked = !s.checked;
  s.date = s.checked ? todayStr() : null;
  persist(); render(); loadPhotos(buildId);
}
function updateStepNote(buildId,pi,si,val){
  const b = getBuild(buildId);
  b.checklist[pi].steps[si].note = val;
  persist();
}
function addBuildStep(buildId,pi){
  const input = document.getElementById(`addstep-${buildId}-${pi}`);
  const text = input.value.trim();
  if(!text) return;
  const b = getBuild(buildId);
  b.checklist[pi].steps.push({id:uid(), text, checked:false, note:'', date:null});
  persist(); render(); loadPhotos(buildId);
}
function deleteBuildStep(buildId,pi,si){
  const b = getBuild(buildId);
  b.checklist[pi].steps.splice(si,1);
  persist(); render(); loadPhotos(buildId);
}
function togglePhase(buildId,pi){
  const b = getBuild(buildId);
  b._collapsed = b._collapsed || {};
  b._collapsed[pi] = !b._collapsed[pi];
  const el = document.getElementById(`phase-body-${buildId}-${pi}`);
  el.classList.toggle('hidden');
}
function saveAsTemplate(buildId){
  const b = getBuild(buildId);
  const t = b.checklist.map(ph=>({phase: ph.phase, steps: ph.steps.map(s=>s.text)}));
  saveTemplate(t);
  toast('Checklist bewaard als nieuwe standaard ✓');
}

/* ---------- Template editor actions ---------- */
function templateRenamePhase(pi, val){ const t=loadTemplate(); t[pi].phase=val; saveTemplate(t); }
function templateEditStep(pi,si,val){
  const t=loadTemplate();
  t[pi].steps[si] = val;
  saveTemplate(t);
}
function templateDeleteStep(pi,si){ const t=loadTemplate(); t[pi].steps.splice(si,1); saveTemplate(t); render(); }
function templateAddStep(pi){
  const input = document.getElementById('newstep-'+pi);
  const val = input.value.trim(); if(!val) return;
  const t=loadTemplate(); t[pi].steps.push(val); saveTemplate(t); render();
}
function templateDeletePhase(pi){ const t=loadTemplate(); t.splice(pi,1); saveTemplate(t); render(); }
function templateAddPhase(){
  const t=loadTemplate(); t.push({phase:'Nieuwe fase', steps:[]}); saveTemplate(t); render();
}
function resetTemplate(){
  if(confirm('Standaard checklist herstellen naar origineel? Eigen aanpassingen gaan verloren.')){
    saveTemplate(JSON.parse(JSON.stringify(DEFAULT_TEMPLATE))); render();
  }
}

    <input type="file" id="importFile" accept="application/json">
    <button class="btn secondary block" style="margin-top:10px;" onclick="importData()">⬆ Importeer</button>
    <div class="small-note" style="margin-top:14px;">Sixto Builds · lokale opslag in deze browser.</div>
  `;
  openSheet('Instellingen', html);
}

async function exportData(){
  const builds = JSON.parse(JSON.stringify(state.builds));
  for(const b of builds){
    delete b._thumb; delete b._collapsed;
    for(const p of (b.photos||[])){
      p.dataUrl = await getPhotoBlob(p.id);
    }
  }
  const payload = { exportedAt: new Date().toISOString(), template: loadTemplate(), builds };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `sixto-builds-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Back-up gedownload ✓');
}

function importData(){
  const input = document.getElementById('importFile');
  const file = input.files[0];
  if(!file){ alert('Kies eerst een back-up bestand.'); return; }
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const payload = JSON.parse(e.target.result);
      if(!confirm('Importeren voegt builds toe aan je huidige bibliotheek (bestaande builds blijven staan). Doorgaan?')) return;
      if(payload.template) saveTemplate(payload.template);
      for(const b of (payload.builds||[])){
        for(const p of (b.photos||[])){
          if(p.dataUrl){ await savePhotoBlob(p.id, p.dataUrl); delete p.dataUrl; }
        }
        b.id = b.id || uid();
        if(state.builds.find(x=>x.id===b.id)) b.id = uid();
        state.builds.push(b);
      }
      persist();
      closeSheet(); render();
      toast('Import voltooid ✓');
    }catch(err){
      alert('Kon bestand niet lezen: '+err.message);
    }
  };
  reader.readAsText(file);
}

/* ---------- Utils ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s).replace(/`/g,'&#96;'); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '-'; const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s; return d.toLocaleDateString('nl-BE',{day:'numeric',month:'short',year:'numeric'}); }
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ---------- Init ---------- */
(async function initApp(){
  if(getGhToken()){ await pullFromGitHub(true); }
  render();
  setInterval(()=>{ if(document.visibilityState==='visible') pullFromGitHub(); }, 30000);
})();
</script>
