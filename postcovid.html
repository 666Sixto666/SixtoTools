  try{u = extractJSON(txt);}catch(e){toast("Ongeldige update: "+e.message);return;}
  if(!u.meta||!u.meta.datum){toast("Update mist meta.datum");return;}
  if(String(u.meta.datum)<=String(BASE.meta.datum)){toast("Deze update is ouder dan de ingebouwde kennis en wordt niet toegepast");return;}
  const ok = ["behandelingen","financieel","communities","watchlist"].every(k=>u[k]==null||Array.isArray(u[k]));
  if(!ok){toast("Update heeft een fout formaat");return;}
  const cnt = ["behandelingen","financieel","communities","watchlist"].reduce((a,k)=>a+((u[k]||[]).length),0);
  S.updates = (S.updates||[]).filter(x=>x.meta.datum!==u.meta.datum).concat([u]);
  DC=null; save(); render(); toast("Update van "+fmt(u.meta.datum)+" toegepast ("+cnt+" items)");
}
function download(name,txt){
  try{
    const blob=new Blob([txt],{type:"application/json"});const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
  }catch(e){copyText(txt,"Download lukte niet: tekst gekopieerd");}
}
function restore(txt){
  let o; try{o=extractJSON(txt);}catch(e){toast("Ongeldige back-up");return;}
  if(!o || o.v!==1 || typeof o.dagboek!=="object"){toast("Dit is geen PostCovid Kompas-back-up");return;}
  if(!confirm("Huidige gegevens op dit toestel overschrijven met deze back-up?")) return;
  const d=defState(); S=Object.assign(d,o); S.ui=Object.assign(defState().ui,o.ui||{}); DC=null; save(); render(); toast("Back-up teruggezet");
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v, id=b.dataset.id;
  const step = id?S.plan.find(x=>x.id===id):null;
  switch(a){
    case "tab": S.ui.tab=v; if(v!=="plan") S.ui.wizard=false; if(v==="meer" && S.ui.simpel && !b.closest("[data-keepsub]")) S.ui.msub="menu"; save(); render(); window.scrollTo(0,0); break;
    case "ksub": S.ui.ksub=v; save(); render(); break;
    case "msub": S.ui.msub=v; save(); render(); break;
    case "goknow": S.ui.tab="kennis"; S.ui.ksub=v; save(); render(); window.scrollTo(0,0); break;
    case "gofin": S.ui.tab="geld"; UI.open[v]=true; save(); render(); setTimeout(()=>{const e=document.getElementById("f_"+v);if(e)e.scrollIntoView({block:"start"});},30); break;
    case "goT": S.ui.tab="kennis"; S.ui.ksub="beh"; S.ui.zoek=""; S.ui.fsym=[]; S.ui.foord=""; UI.open[v]=true; save(); render(); setTimeout(()=>{const e=document.getElementById("t_"+v);if(e)e.scrollIntoView({block:"start"});},30); break;
    case "topen": {const cur = UI.open[v]!=null ? UI.open[v] : b.dataset.def==="1"; UI.open[v]=!cur; render(); break;}
    case "fsym": {const i=S.ui.fsym.indexOf(v); if(i>=0)S.ui.fsym.splice(i,1); else S.ui.fsym.push(v); save(); render(); break;}
    case "psym": {
      const f=b.closest("form"); const btns=f.querySelectorAll('[data-act="psym"][data-s="'+b.dataset.s+'"]');
      btns.forEach(x=>x.classList.toggle("on",x===b)); break;}
    case "wizard": S.ui.tab="plan"; S.ui.wizard=true; render(); window.scrollTo(0,0); break;
    case "genplan": genPlan(false); render(); toast("Stappenplan gemaakt"); break;
    case "genplan2": if(confirm("Nieuw voorstel maken? Gestarte, afgeronde en eigen stappen blijven behouden.")){genPlan(true); render(); toast("Voorstel vernieuwd");} break;
    case "pstat": if(step){step.status=v; if(v!=="gepland" && !step.start) step.start=today(); save(); render();} break;
    case "peff": if(step){step.effect=Number(v); save(); render();} break;
    case "pdel": if(step && confirm("Stap verwijderen?")){S.plan=S.plan.filter(x=>x!==step); save(); render();} break;
    case "pup": case "pdown": if(step){
      const same=S.plan.filter(x=>(x.fase||0)===(step.fase||0)); const k=same.indexOf(step); const j=a==="pup"?k-1:k+1;
      if(j>=0&&j<same.length){const i1=S.plan.indexOf(step),i2=S.plan.indexOf(same[j]);S.plan[i1]=same[j];S.plan[i2]=step;save();render();}
    } break;
    case "toplan": {const t=T(v); if(t && !S.plan.some(x=>x.tid===v)){S.plan.push({id:uid(),tid:t.id,naam:t.naam,fase:t.fase,status:"gepland",start:"",effect:null,notitie:"",waarom:S.profiel?waaromVoorJou(t,S.profiel):"Zelf toegevoegd",auto:false}); save(); render(); toast("Toegevoegd aan je plan ("+FASES[t.fase].split(" — ")[0]+")");} break;}
    case "fstat": S.fin[id]=Object.assign(S.fin[id]||{},{status:v}); save(); render(); break;
    case "dagnav": {const cur=S.ui.dag||today(); let nd = v==="0"?today():addDays(cur,Number(v)); if(nd>today()) nd=today(); S.ui.dag=nd; save(); render(); break;}
    case "prompt": copyText(updatePrompt(),"Update-opdracht gekopieerd. Plak ze in Claude."); break;
    case "clrupd": if(confirm("Alle geïmporteerde kennis-updates verwijderen? De ingebouwde kennis blijft.")){S.updates=[]; DC=null; save(); render();} break;
    case "ficheprint": window.print(); break;
    case "fichecopy": copyText(ficheText(),"Gespreksfiche gekopieerd"); break;
    case "export": download("postcovid-kompas-backup-"+today()+".json",JSON.stringify(S,null,1)); break;
    case "exportcopy": copyText(JSON.stringify(S),"Back-up gekopieerd. Bewaar die bv. in Notities."); break;
    case "wipe": if(confirm("Echt ALLES wissen? Maak eerst een back-up.") && confirm("Laatste bevestiging: alles wissen?")){S=defState(); DC=null; save(); render(); toast("Alles gewist");} break;
    case "thema": S.ui.thema=v; save(); render(); break;
    case "simpel": S.ui.simpel=v==="1"; UI.planVol=false; UI.geldVol=false; if(S.ui.simpel) S.ui.msub="inst"; save(); render(); toast(S.ui.simpel?"Eenvoudige weergave":"Uitgebreide weergave: alles zichtbaar"); break;
    case "snel": {const d=today(); const e=Object.assign({},S.dagboek[d]||{}); e.energie=Number(v); e.crash = b.dataset.crash==="1"; S.dagboek[d]=e; save(); render(); break;}
    case "sstart": if(step){step.status="bezig"; step.start=today(); save(); render(); toast("Goed. Hou het een paar weken vol en kijk dan of het helpt.");} break;
    case "seval": if(step){step.status=Number(v)<0?"gestopt":"klaar"; step.effect=Number(v); if(!step.start) step.start=today(); save(); render(); toast("Genoteerd. Op naar de volgende stap.");} break;
    case "sskip": if(step){step.status="gestopt"; step.notitie=(step.notitie?step.notitie+" · ":"")+"overgeslagen"; save(); render();} break;
    case "planvol": UI.planVol=!UI.planVol; render(); window.scrollTo(0,0); break;
    case "geldvol": UI.geldVol=!UI.geldVol; render(); window.scrollTo(0,0); break;
    case "psymc": {const l=Number(b.dataset.lvl); const n=l===0?2:l===2?3:0; b.dataset.lvl=n; b.classList.toggle("on",n>0); b.textContent=symKort(b.dataset.s)+(n===3?" !!":""); break;}
    case "go": {const pr=v.split(":"); S.ui.tab=pr[0]; if(pr[0]==="kennis") S.ui.ksub="beh"; if(pr[1]) S.ui.msub=pr[1]; save(); render(); window.scrollTo(0,0); break;}
    case "groot": S.ui.groot=v==="1"; save(); render(); break;
    case "leanstart": UI.lean={fase:"lig",t0:Date.now()}; startLeanTimer(); render(); break;
    case "leanstand": saveLeanForm(); UI.lean.fase="staan"; UI.lean.t0=Date.now(); render(); break;
    case "leanstop": UI.lean=null; clearInterval(UI.leanTimer); render(); break;
  }
});
function startLeanTimer(){
  clearInterval(UI.leanTimer);
  UI.leanTimer=setInterval(()=>{
    const el=document.getElementById("leant");
    if(!UI.lean){clearInterval(UI.leanTimer);return;}
    if(el){const s=Math.floor((Date.now()-UI.lean.t0)/1000);el.textContent=Math.floor(s/60)+":"+pad(s%60);}
  },1000);
}
function saveLeanForm(){
  const f=document.querySelector('form[data-form="lean"]'); if(!f||!UI.lean) return;
  ["lig","m1","m3","m5","m7","m10"].forEach(k=>{const v=Number(f.elements[k].value);UI.lean[k]=v>0?v:"";});
  UI.lean.sym=f.elements.sym.value;
}
document.addEventListener("submit",ev=>{
  const f=ev.target; const kind=f.dataset.form; if(!kind) return;
  ev.preventDefault();
  if(kind==="dag"){
    const d=f.dataset.d; const e=Object.assign({},S.dagboek[d]||{});
    f.querySelectorAll("input[data-sl]").forEach(inp=>{if(!inp.hasAttribute("data-unset")) e[inp.dataset.sl]=Number(inp.value);});
    e.crash=!!(f.elements.crash&&f.elements.crash.checked);
    if(f.elements.pijnstiller) e.pijnstiller=f.elements.pijnstiller.checked;
    if(f.elements.rhr){const r=Number(f.elements.rhr.value); if(r>0) e.rhr=r; else delete e.rhr;}
    if(f.elements.act) e.act=f.elements.act.value.trim();
    if(f.elements.notitie) e.notitie=f.elements.notitie.value.trim();
    if(typeof e.energie!=="number"){toast("Zet minstens de energie-schuif");return;}
    S.dagboek[d]=e; save(); render(); toast("Bewaard"); return;
  }
  if(kind==="profiel"){
    const sym={}; f.querySelectorAll('[data-act="psym"].on').forEach(b=>{sym[b.dataset.s]=Number(b.dataset.v);});
    f.querySelectorAll('[data-act="psymc"]').forEach(b=>{sym[b.dataset.s]=Number(b.dataset.lvl);});
    const er=f.querySelector('input[name="ernst"]:checked');
    const first=!S.profiel;
    S.profiel={ernst:er?er.value:"matig",budget:Number(f.elements.budget.value),symptomen:sym,situatie:f.elements.situatie.value,sinds:f.elements.sinds.value};
    S.ui.wizard=false;
    if(first||!S.plan.length) genPlan(false); else save();
    const leeg = !Object.values(sym).some(v=>v>0);
    render(); window.scrollTo(0,0); toast(leeg?"Je duidde geen klachten aan: het plan bevat nu alleen de basis. Pas je profiel aan voor een plan op maat.":(first?"Profiel bewaard, stappenplan gemaakt":"Profiel bewaard. Tik 'Nieuw voorstel' om het plan bij te werken.")); return;
  }
  if(kind==="eigenstap"){
    const n=f.elements.naam.value.trim(); if(!n){toast("Geef een naam");return;}
    S.plan.push({id:uid(),tid:null,naam:n,fase:Number(f.elements.fase.value),status:"gepland",start:"",effect:null,notitie:"",waarom:"Eigen stap",auto:false});
    save(); render(); toast("Stap toegevoegd"); return;
  }
  if(kind==="update"){importUpdate(f.elements.json.value); return;}
  if(kind==="backuptxt"){restore(f.elements.json.value); return;}
  if(kind==="lean"){
    saveLeanForm(); const L=UI.lean;
    const st=[L.m1,L.m3,L.m5,L.m7,L.m10].filter(x=>x>0);
    if(!(L.lig>0)||!st.length){toast("Vul de liggende hartslag en minstens één staande meting in");return;}
    const mx=Math.max.apply(null,st); const diff=mx-L.lig;
    const txt = diff>=30 ? "Stijging +"+diff+" slagen/min. Dit past bij POTS (≥30). Bespreek het met je arts; de diagnose vraagt ook een bloeddrukmeting. De POTS-basismaatregelen kunnen al zinvol zijn." :
                diff>=20 ? "Stijging +"+diff+" slagen/min: een grensgeval (20–29). Herhaal op een andere dag en bespreek het met je arts als je klachten hebt bij rechtstaan." :
                "Stijging +"+diff+" slagen/min. Geen aanwijzing voor POTS bij deze meting.";
    L.res={diff:diff,txt:txt};
    S.staantest.push({d:today(),lig:L.lig,max:mx,sym:L.sym||""}); save();
    clearInterval(UI.leanTimer); render(); return;
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.ui){S.ui[t.dataset.ui]=t.value; if(t.dataset.ui==="dag" && (!t.value || t.value>today())) S.ui.dag=today(); save(); render(); return;}
  if(t.dataset.pf){const s=S.plan.find(x=>x.id===t.dataset.id); if(s){s[t.dataset.pf]=t.value; save(); if(t.dataset.pf==="start") render();} return;}
  if(t.dataset.ff){S.fin[t.dataset.ff]=Object.assign(S.fin[t.dataset.ff]||{},{notitie:t.value}); save(); return;}
  if(t.dataset.file){
    const file=t.files&&t.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=()=>{ if(t.dataset.file==="update") importUpdate(r.result); else restore(r.result); }; r.readAsText(file); return;
  }
});
let zoekT=null;
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.ui==="zoek"){
    clearTimeout(zoekT);
    zoekT=setTimeout(()=>{S.ui.zoek=t.value; save(); const pos=t.selectionStart; render(); const n=document.querySelector('[data-ui="zoek"]'); if(n){n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){}}},350);
  }
});
render();
</script>
