<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kompas">
<meta name="theme-color" content="#2f6f73">
<title>PostCovid Kompas</title>
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--ink:#1c2226;--muted:#5b676e;--line:#e1ded6;--chip:#ebe8e1;
  --accent:#2f6f73;--accent-ink:#ffffff;--accent-soft:#dcebea;
  --ok:#2d7a4c;--ok-soft:#dcefe3;--warn:#a8670f;--warn-soft:#f6e8cf;--bad:#b03a3a;--bad-soft:#f5dcdc;
  --info:#2f5c98;--info-soft:#dde6f3;--gray:#6b7177;--gray-soft:#e7e7e5;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121619;--card:#1b2024;--ink:#e6eaec;--muted:#9aa6ac;--line:#2b3237;--chip:#262d32;
    --accent:#6bb3b5;--accent-ink:#0d1314;--accent-soft:#1f3537;
    --ok:#6cc08d;--ok-soft:#1c3326;--warn:#e0a54a;--warn-soft:#3a2d17;--bad:#e27b7b;--bad-soft:#3a1f1f;
    --info:#86a9dc;--info-soft:#1f2a3b;--gray:#a3a9ae;--gray-soft:#2a2f33;--shadow:none;
  }
}
:root[data-theme="dark"]{
    --bg:#121619;--card:#1b2024;--ink:#e6eaec;--muted:#9aa6ac;--line:#2b3237;--chip:#262d32;
    --accent:#6bb3b5;--accent-ink:#0d1314;--accent-soft:#1f3537;
    --ok:#6cc08d;--ok-soft:#1c3326;--warn:#e0a54a;--warn-soft:#3a2d17;--bad:#e27b7b;--bad-soft:#3a1f1f;
    --info:#86a9dc;--info-soft:#1f2a3b;--gray:#a3a9ae;--gray-soft:#2a2f33;--shadow:none;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.groot{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header h1{font-size:1.05rem;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{font-size:.78rem;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:14px 16px 24px}
h2{font-size:1.25rem;margin:.4rem 0 .6rem}
h3{font-size:1.02rem;margin:1.1rem 0 .5rem}
p{margin:.35rem 0 .6rem}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.tight{padding:10px 12px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
button,.btn{font:inherit;font-size:.95rem;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent}
button.small{min-height:36px;padding:6px 10px;font-size:.85rem}
button.danger{color:var(--bad)}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:100%}
textarea{width:100%;min-height:90px}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:none;background:transparent}
input[type=range][data-unset]{opacity:.4}
label{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 11px;font-size:.85rem;min-height:34px;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;font-size:.74rem;font-weight:650;border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-basis{background:var(--ok-soft);color:var(--ok)}
.b-proberen{background:var(--accent-soft);color:var(--accent)}
.b-arts{background:var(--info-soft);color:var(--info)}
.b-onderzoek{background:var(--warn-soft);color:var(--warn)}
.b-onbewezen{background:var(--gray-soft);color:var(--gray)}
.b-afgeraden{background:var(--bad-soft);color:var(--bad)}
.ev{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font-weight:700;font-size:.8rem;border:1.5px solid var(--line)}
.meter{font-size:.8rem;color:var(--muted);white-space:nowrap}
.meter b{color:var(--ink);font-weight:600}
.dots{letter-spacing:1px}
.banner{border-radius:14px;padding:12px 14px;margin:0 0 12px;border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.banner.info{background:var(--info-soft);border-color:var(--info)}
.light{display:flex;gap:12px;align-items:flex-start}
.lamp{width:22px;height:22px;border-radius:50%;flex:none;margin-top:3px}
.lamp.rood{background:var(--bad)}.lamp.oranje{background:var(--warn)}.lamp.groen{background:var(--ok)}
.tcard .head{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tcard .title{font-weight:620}
.tcard .kern{margin:.3rem 0 .2rem}
.det{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:.92rem}
.det dt{font-weight:620;font-size:.86rem;color:var(--muted);margin-top:8px}
.det dd{margin:2px 0 0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.nav button{border:none;background:transparent;flex:1;min-width:0;padding:6px 0;min-height:54px;font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
.nav button .ic{font-size:1.25rem;line-height:1}
.nav button.on{color:var(--accent);font-weight:650}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:none;background:transparent;min-height:38px;font-size:.86rem;padding:6px 8px;white-space:nowrap}
.seg button.on{background:var(--card);font-weight:650;box-shadow:var(--shadow)}
.step{border-left:4px solid var(--line)}
.step.st-bezig{border-left-color:var(--accent)}
.step.st-klaar{border-left-color:var(--ok)}
.step.st-gestopt{border-left-color:var(--gray);opacity:.75}
.phase{font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 6px;font-weight:650}
.sl{margin:10px 0}
.sl .row{justify-content:space-between}
.sl output{font-weight:650;min-width:2ch;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:90vw;text-align:center}
.prog{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--ok)}
svg text{fill:var(--muted);font-size:9px}
.list{margin:.2rem 0 .4rem;padding-left:1.2rem}
.list li{margin:.25rem 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.stars{color:var(--warn);letter-spacing:1px}
details summary{cursor:pointer;font-weight:620;min-height:32px}
.fiche{background:#fff;color:#111}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.big3 button{min-height:84px;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px}
.big3 button .em{font-size:1.7rem;line-height:1}
.menu button{width:100%;text-align:left;display:flex;align-items:center;gap:12px;margin:0 0 8px;min-height:56px;font-size:1rem}
.menu button .ic{font-size:1.3rem;width:1.6rem;text-align:center}
.menu button .sub{display:block;font-size:.8rem;color:var(--muted)}
.hero{font-size:1.15rem;font-weight:650;margin:.2rem 0 .3rem}
.linkbtn{background:none;border:none;color:var(--accent);padding:6px 0;min-height:36px;font-size:.92rem;text-decoration:underline}
@media print{
  header,.nav,.noprint,.toast,.seg{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card{border:none;box-shadow:none;padding:0}
  main{max-width:none}
}
</style>
</head>

<script>
"use strict";
const BASE = {"meta":{"versie":"2026.10.18","datum":"2026-10-18","opmerking":"Eerste versie. Bewijsniveaus op basis van publicaties t.e.m. oktober 2026."},"symptomen":{"pem":"PEM (crash na inspanning)","hoofdpijn":"Hoofdpijn","spanning":"Spanning / 'paraatheid' / overprikkeling","ontsteking":"Pijn & ontstekingsgevoel","vatbaar":"Vatbaar voor infecties","pots":"Duizelig/hartkloppingen bij rechtstaan","brainfog":"Brain fog / concentratie","slaap":"Slaapproblemen","darm":"Darm/maag & allergie-achtige klachten"},"symptomenKort":{"pem":"PEM","hoofdpijn":"Hoofdpijn","spanning":"Paraatheid","ontsteking":"Pijn/ontsteking","vatbaar":"Infecties","pots":"POTS/duizelig","brainfog":"Brain fog","slaap":"Slaap","darm":"Darm/allergie"},"oordelen":{"basis":"Basis — doe dit sowieso","proberen":"Redelijk om te proberen (laag risico)","arts":"Bespreek met arts — mogelijk zinvol","onderzoek":"Experimenteel — wacht op studies","onbewezen":"Niet aangetoond — beter niet","afgeraden":"Afgeraden"},"bewijs":{"A":"Sterk: richtlijnen/consensus + meerdere goede studies","B":"Minstens één goede gerandomiseerde studie (RCT) — positief óf negatief","C":"Kleine of open studies, of overgenomen uit verwante aandoening","D":"Casusreeksen, expertmening","E":"Anekdotes of enkel theorie"},"behandelingen":[{"id":"pacing","naam":"Pacing (energiemanagement)","fase":1,"oordeel":"basis","bewijs":"A","symptomen":["pem","hoofdpijn","spanning","brainfog","slaap","ontsteking"],"kern":"Blijf binnen je energie-envelop zodat crashes stoppen. Dit is de basis waarop al het andere bouwt.","uitleg":"Je verdeelt fysieke, mentale én emotionele inspanning over de dag en week. Plan vaste rustmomenten (liggend, ogen dicht, prikkelarm) vóór je moe bent. Doe op goede dagen niet 'alles in te halen' (push-crash-cyclus). Mentale inspanning (schermen, gesprekken, administratie) telt even zwaar als fysieke.","kost":0,"kostTekst":"Gratis","energie":1,"risico":1,"effectTijd":"2–8 weken minder crashes","belgie":"Ergotherapeut via het RIZIV-zorgtraject long covid kan je hierin gratis begeleiden (vóór 31/12/2026 starten).","kritisch":"Pacing geneest niet, maar voorkomt verslechtering. Het KCE (2026) en NICE noemen energiemanagement de meest zinvolle aanpak bij PEM.","bronnen":[{"t":"KCE-rapport 420 ME/CVS (2026)","u":"https://kce.fgov.be/en/management-of-myalgic-encephalomyelitischronic-fatigue-syndrome-in-belgium-an-analysis-based-on"},{"t":"Bateman Horne Center – pacing","u":"https://batemanhornecenter.org/"},{"t":"ME/cvs Vereniging NL – energiemanagement","u":"https://me-cvsvereniging.nl/"}]},{"id":"hartslag","naam":"Pacing met hartslagbewaking","fase":1,"oordeel":"proberen","bewijs":"C","symptomen":["pem","pots","spanning"],"kern":"Een hartslagmeter waarschuwt je vóór je over je grens gaat. Brain fog maakt dat gevoel onbetrouwbaar.","uitleg":"Vuistregel om te starten: blijf onder ongeveer je rusthartslag + 15 slagen, of onder ±55–60% van (220 − leeftijd). Stel een trilalarm in. Volg ook je ochtendrusthartslag en HRV: een stijging van 5–10 slagen of een dalende HRV is vaak een vroeg signaal om rustiger te doen.","kost":2,"kostTekst":"€40–100 eenmalig (borstband of horloge); apps zoals Visible: ±€10–15/maand","energie":1,"risico":1,"effectTijd":"Direct inzicht, minder crashes na weken","belgie":"Elk sporthorloge met hartslagalarm volstaat (Polar, Garmin, ...). Een borstband is nauwkeuriger.","kritisch":"De grenswaarden zijn vuistregels uit de ME/CVS-praktijk (Workwell), niet getest in grote studies. Een pacing-app met wearable werd in 2026 getest bij long covid (veelbelovend, klein).","bronnen":[{"t":"Workwell Foundation – HR-monitoring","u":"https://workwellfoundation.org/"},{"t":"Long Covid Physio – pacing","u":"https://longcovid.physio/"}]},{"id":"crashplan","naam":"Crash-protocol","fase":1,"oordeel":"basis","bewijs":"D","symptomen":["pem","hoofdpijn","spanning"],"kern":"Spreek op voorhand af wat je doet tijdens een crash. Dan hoef je dan niets meer te beslissen.","uitleg":"Een lijstje op papier: wie verwittig je, wat schrap je (afspraken, schermen), wat helpt (donker, liggen, oordopjes, vocht + zout, eenvoudig eten klaar in de diepvries). Rust volledig tot je terug op je basisniveau zit, en bouw dan langzaam weer op.","kost":0,"kostTekst":"Gratis","energie":1,"risico":1,"effectTijd":"Kortere crashes","belgie":"—","kritisch":"Expertconsensus, weinig formeel onderzoek, wel logisch en zonder risico.","bronnen":[{"t":"Long Covid Physio – PEM/crash","u":"https://longcovid.physio/"}]},{"id":"zorgtraject","naam":"RIZIV-zorgtraject long covid activeren","fase":0,"oordeel":"basis","bewijs":"A","symptomen":["pem","hoofdpijn","spanning","brainfog","ontsteking","pots","darm","slaap"],"kern":"Gratis kine (60x), ergotherapie, diëtist en neuropsycholoog. Nieuwe overeenkomsten kunnen alleen nog tot 31/12/2026.","uitleg":"De huisarts of specialist bevestigt de diagnose en activeert het recht tijdens een consultatie. Daarna krijg je per behandeljaar: kine 60 sessies, ergo 1 + 14 sessies, diëtist 1 + 7, neuropsycholoog 1 evaluatie + 10 sessies. €0 remgeld, maar wel met een voorschrift. Na een jaar kan de arts een tweede jaar toestaan.","kost":0,"kostTekst":"€0 remgeld","energie":2,"risico":1,"effectTijd":"Ondersteuning, geen genezing","belgie":"Vraag nu een consultatie bij de huisarts met de vraag: 'Wil je het zorgtraject long covid activeren of verlengen?' Kies een kine die PEM kent (geen opbouwschema's).","kritisch":"Het traject is zo goed als de zorgverlener. Kinesitherapie met een 'push-through'-aanpak kan schaden bij PEM. Toon je kine de info van Long Covid Physio.","bronnen":[{"t":"RIZIV – long covid tegemoetkoming","u":"https://www.riziv.fgov.be/nl/thema-s/verzorging-kosten-en-terugbetaling/ziekten/long-covid-19-tegemoetkoming-in-de-kosten-van-zorg-bij-aanhoudende-covid-19-symptomen"},{"t":"VRT 19/01/2026 – verlengd tot eind 2026","u":"https://www.vrt.be/vrtnws/nl/2026/01/19/tegemoetkoming-voor-zorg-van-patienten-met-long-covid-verlengd-t/"}]},{"id":"bloed","naam":"Behandelbare oorzaken uitsluiten (bloed + basisonderzoek)","fase":0,"oordeel":"basis","bewijs":"A","symptomen":["pem","hoofdpijn","vatbaar","ontsteking","brainfog","slaap","pots"],"kern":"IJzertekort, B12, vitamine D, schildklier, slaapapneu: dat is soms behandelbaar en kan klachten verergeren.","uitleg":"Vraag de huisarts (indien niet recent gebeurd): volledig bloedbeeld, CRP, ferritine en ijzer, B12 en foliumzuur, vitamine D, TSH, glucose/HbA1c, nier- en leverfunctie, ionen, CK. Bij veel infecties: immunoglobulines (IgG/IgA/IgM). Bij snurken of onverfrissende slaap: slaaponderzoek. Bij duizeligheid bij rechtstaan: staantest (zie 'Staantest' in de app).","kost":1,"kostTekst":"Meestal enkele euro's remgeld","energie":2,"risico":1,"effectTijd":"Eenmalig (jaarlijks herhalen)","belgie":"Via de huisarts. Met een GMD (globaal medisch dossier) betaal je minder remgeld.","kritisch":"Normale bloedwaarden betekenen niet dat er 'niets' is. Long covid toont zich vaak niet in standaard bloedonderzoek.","bronnen":[{"t":"WHO/NICE long covid richtlijn","u":"https://www.nice.org.uk/guidance/ng188"}]},{"id":"slaap","naam":"Slaap verbeteren","fase":1,"oordeel":"basis","bewijs":"C","symptomen":["slaap","hoofdpijn","brainfog","spanning","pem"],"kern":"Vaste uren, donker en koel, geen schermen vlak voor het slapen. Slaap is het herstelmoment.","uitleg":"Een korte dutje (20–30 min) is prima als onderdeel van pacing. Bij aanhoudende slaapproblemen: bespreek met de arts (slaapapneu? lage dosis amitriptyline helpt soms tegelijk tegen hoofdpijn en slaap).","kost":0,"kostTekst":"Gratis","energie":1,"risico":1,"effectTijd":"2–4 weken","belgie":"—","kritisch":"Er is weinig long-covid-specifiek bewijs, maar wel goed algemeen bewijs. RECOVER-SLEEP-resultaten verwacht 2026–2027.","bronnen":[{"t":"RECOVER – trials","u":"https://recovercovid.org/"}]},{"id":"prikkels","naam":"Prikkelreductie","fase":1,"oordeel":"proberen","bewijs":"D","symptomen":["spanning","hoofdpijn","brainfog","pem"],"kern":"Oordopjes met demping, zonnebril, schermfilter en minder meldingen kosten minder energie.","uitleg":"Overprikkeling verbruikt energie en houdt het 'paraatheidssysteem' aan. Gebruik oordopjes die geluid dempen maar gesprekken doorlaten (bv. Loop-type), donkere modus, zet meldingen uit, en maak een rustige kamer.","kost":1,"kostTekst":"€20–40 eenmalig","energie":1,"risico":1,"effectTijd":"Direct","belgie":"—","kritisch":"Logisch en zonder risico, maar niet formeel onderzocht.","bronnen":[]},{"id":"potsbasis","naam":"POTS-basis: vocht, zout, steunkousen","fase":1,"oordeel":"basis","bewijs":"C","symptomen":["pots","pem","brainfog","hoofdpijn","spanning"],"kern":"Bij duizeligheid of hartkloppingen bij rechtstaan helpen 2–3 l vocht, extra zout (met arts) en steunkousen vaak al.","uitleg":"Drink 2–3 liter per dag, met extra zout of elektrolyten (alleen na overleg bij hoge bloeddruk of nierproblemen). Steunkousen klasse II tot de liesstreek, of een buikband. Sta langzaam recht. Doe oefeningen liggend of zittend (fietsen, roeien, zwemmen) en enkel als PEM het toelaat.","kost":2,"kostTekst":"Steunkousen €40–80; elektrolyten €10–20/maand","energie":1,"risico":2,"effectTijd":"Dagen tot weken","belgie":"Steunkousen zijn op voorschrift deels terugbetaald via sommige ziekenfondsen (aanvullende verzekering). Vraag het na.","kritisch":"Standaard POTS-aanpak (expertconsensus). Ivabradine gaf in RECOVER-AUTONOMIC (2026) wel een lagere hartslag, maar geen betere klachten.","bronnen":[{"t":"RECOVER-AUTONOMIC resultaten (2026)","u":"https://recovercovid.org/news/recover-autonomic-clinical-trial-results-shared-2026-acc-conference"}]},{"id":"infectiepreventie","naam":"Herinfectie vermijden","fase":1,"oordeel":"basis","bewijs":"B","symptomen":["vatbaar","pem","ontsteking"],"kern":"Elke nieuwe infectie kan een terugval geven. Draag een FFP2-masker in drukte, zorg voor ventilatie en bespreek vaccins.","uitleg":"Draag een FFP2-masker in drukke binnenruimtes (wachtzaal, apotheek, OV), en verlucht of filter de lucht (HEPA/CO₂-meter). Was je handen. Bespreek vaccins (griep, COVID, pneumokokken) met de huisarts volgens het advies van de Hoge Gezondheidsraad. Bij een nieuwe COVID-infectie: vraag de arts snel (binnen 3 dagen) naar metformine of antivirale behandeling.","kost":1,"kostTekst":"FFP2 ±€0,50/stuk; CO₂-meter €40–80","energie":1,"risico":1,"effectTijd":"Preventief","belgie":"Griep- en COVID-vaccin zijn voor risicogroepen meestal gratis of goedkoop. Vraag het aan de huisarts.","kritisch":"Herinfecties verhogen het risico op (verergering van) long covid. Sommige patiënten melden tijdelijke klachten na vaccinatie; bespreek de timing met de arts.","bronnen":[{"t":"COVID-OUT (metformine preventie)","u":"https://pubmed.ncbi.nlm.nih.gov/?term=COVID-OUT+metformin+post-covid+condition"}]},{"id":"ergo","naam":"Ergotherapie: energie en hulpmiddelen","fase":1,"oordeel":"basis","bewijs":"C","symptomen":["pem","brainfog","spanning"],"kern":"Een ergotherapeut helpt je taken slimmer te doen: douchestoel, boodschappen laten leveren, dagplanning.","uitleg":"Een ergotherapeut analyseert je dag en zoekt waar je energie kunt besparen: zittend koken, hulpmiddelen, een rolstoel voor lange afstanden (geen 'opgeven', maar energiebeheer), en werk- of huisaanpassingen.","kost":0,"kostTekst":"€0 via zorgtraject (1 + 14 sessies)","energie":2,"risico":1,"effectTijd":"Weken","belgie":"Via het RIZIV-zorgtraject. Hulpmiddelen soms via VAPH of de uitleendienst van het ziekenfonds.","kritisch":"Weinig RCT's, wel aanbevolen in richtlijnen.","bronnen":[]},{"id":"kinePEM","naam":"Kinesitherapie — enkel PEM-veilig","fase":1,"oordeel":"proberen","bewijs":"C","symptomen":["spanning","hoofdpijn","ontsteking","pots"],"kern":"Zachte kine voor nek en spanning, ademhaling en liggende oefeningen. Nooit volgens een opbouwschema.","uitleg":"Zinvol: losmaken van nek en schouders, ademhalingstherapie bij hyperventilatie of disfunctioneel ademen, en liggende of zittende oefeningen op basis van symptomen (niet op tijd of afstand). Stop als klachten 24–72 uur later toenemen.","kost":0,"kostTekst":"€0 via zorgtraject (60 sessies van 30 min)","energie":3,"risico":2,"effectTijd":"Weken","belgie":"Vraag je kine expliciet naar ervaring met PEM. Geef de link longcovid.physio mee.","kritisch":"Verplaatsing en sessies kosten zelf energie. Huisbezoek kan soms; vraag ernaar.","bronnen":[{"t":"Long Covid Physio","u":"https://longcovid.physio/"},{"t":"Not Recovered Belgium – kritiek op 'push-through'-kine (De Specialist, 2024)","u":"https://www.despecialist.eu/nl/nieuws/patientenvereniging-long-covid-wordt-in-belgie-behandeld-als-psychiatrische-aandoening.html"}]},{"id":"ademhaling","naam":"Trage ademhaling (zenuwstelsel kalmeren)","fase":2,"oordeel":"proberen","bewijs":"C","symptomen":["spanning","slaap","hoofdpijn","pots"],"kern":"5–10 minuten per dag rustig ademen (±6 keer per minuut) kan het 'paraatheidssysteem' dempen.","uitleg":"Adem 4 tellen in door de neus en 6 tellen uit, liggend. Dit verhoogt de vagale activiteit (HRV). Combineer het met een rustmoment. Stop bij duizeligheid.","kost":0,"kostTekst":"Gratis","energie":1,"risico":1,"effectTijd":"Direct ontspannend; effect op lange termijn onzeker","belgie":"Een kine kan ademhalingstherapie geven binnen het zorgtraject.","kritisch":"Kleine studies, effect bescheiden. Het is geen behandeling van de oorzaak.","bronnen":[]},{"id":"mentaal","naam":"Psychologische ondersteuning (omgaan met ziekte)","fase":1,"oordeel":"proberen","bewijs":"B","symptomen":["spanning","slaap"],"kern":"Hulp bij rouw, onzekerheid en somberheid. Niet omdat long covid 'psychisch' is, maar omdat chronisch ziek zijn zwaar is.","uitleg":"Kies een psycholoog die long covid of ME/CVS als lichamelijke ziekte erkent. Vermijd therapie die belooft dat je jezelf 'beter kunt denken' of dat je moet doorduwen.","kost":1,"kostTekst":"Eerstelijnspsycholoog: 1e sessie gratis, daarna €11 (€4 met verhoogde tegemoetkoming), max. 8/jaar","energie":2,"risico":1,"effectTijd":"Weken","belgie":"Via de huisarts naar een geconventioneerde eerstelijnspsycholoog (netwerk geestelijke gezondheid). Ook online mogelijk, wat energie spaart.","kritisch":"CGT als 'genezing' van long covid of ME/CVS is omstreden (de Nederlandse ReCOVer-studie toonde minder vermoeidheid op vragenlijsten, maar niet objectief). Als hulp bij het omgaan met de ziekte is het wel zinvol.","bronnen":[{"t":"RIZIV – eerstelijnspsychologische zorg","u":"https://www.inami.fgov.be/nl/professionals/individuele-zorgverleners/klinisch-psychologen/eerstelijns-psychologische-zorg-verlenen-via-netwerken-voor-geestelijke-gezondheid"}]},{"id":"voeding","naam":"Regelmatig en voedzaam eten","fase":1,"oordeel":"proberen","bewijs":"D","symptomen":["ontsteking","darm","pem","brainfog"],"kern":"Kleine maaltijden, voldoende eiwit en een mediterraan eetpatroon. Geen dure dieetkuren.","uitleg":"Grote maaltijden kunnen bij POTS meer klachten geven, dus kies kleinere porties. Zorg voor voldoende eiwit (spiermassa), groenten, vette vis en olijfolie. Hou het eenvoudig (ook voor energie). Een diëtist kan helpen binnen het zorgtraject.","kost":1,"kostTekst":"Neutraal; diëtist €0 via zorgtraject","energie":2,"risico":1,"effectTijd":"Weken","belgie":"Diëtist via het RIZIV-zorgtraject (1 + 7 sessies).","kritisch":"Geen specifiek long-covid-bewijs voor een bepaald dieet. Wantrouw 'anti-ontstekingskuren' die supplementen verkopen.","bronnen":[]},{"id":"vitD","naam":"Vitamine D (alleen bij tekort)","fase":2,"oordeel":"proberen","bewijs":"C","symptomen":["vatbaar","ontsteking","pem"],"kern":"Een tekort aanvullen is goedkoop en veilig. Bij normale waarden helpt extra vitamine D niet.","uitleg":"Laat het meten (25-OH-vitamine D). Bij tekort: suppleren volgens de arts. In België hebben veel mensen in de winter een tekort.","kost":1,"kostTekst":"±€3–5/maand","energie":1,"risico":1,"effectTijd":"2–3 maanden","belgie":"Apotheek, zonder voorschrift.","kritisch":"Geen bewijs dat vitamine D long covid behandelt. Het corrigeert enkel een tekort.","bronnen":[]},{"id":"moh","naam":"Hoofdpijndagboek + pijnstillers beperken","fase":2,"oordeel":"basis","bewijs":"A","symptomen":["hoofdpijn"],"kern":"Pijnstillers op meer dan 10–15 dagen per maand kunnen zelf hoofdpijn veroorzaken (medicatie-overgebruikshoofdpijn).","uitleg":"Noteer hoofdpijndagen, ernst en pijnstillers in het dagboek. Paracetamol/NSAID's op ≥15 dagen per maand of triptanen op ≥10 dagen per maand is een risico. Bespreek met de arts een afbouw en een preventieve behandeling.","kost":0,"kostTekst":"Gratis","energie":1,"risico":1,"effectTijd":"1–3 maanden na afbouw","belgie":"De huisarts of neuroloog kan begeleiden.","kritisch":"Goed onderbouwd bij hoofdpijn in het algemeen. Long-covid-hoofdpijn lijkt deels op migraine en deels op spanningshoofdpijn.","bronnen":[{"t":"American Headache Society – persistent post-COVID headache","u":"https://americanheadachesociety.org/news/research-summary-toward-a-better-understanding-of-persistent-headache-after-mild-covid-19-three-migraine-like-yet-distinct-scenarios"}]},{"id":"amitriptyline","naam":"Amitriptyline (lage dosis)","fase":3,"oordeel":"arts","bewijs":"C","symptomen":["hoofdpijn","slaap","ontsteking","spanning"],"kern":"Een oud, goedkoop middel: verminderde in een Spaanse reeks de hoofdpijndagen met ±10 per maand. Helpt soms ook bij slaap.","uitleg":"Meestal 10–25 mg 's avonds, langzaam opbouwen. Bijwerkingen: droge mond, sufheid 's morgens, gewichtstoename, soms snellere hartslag (opletten bij POTS).","kost":1,"kostTekst":"±€3–8/maand (terugbetaald)","energie":1,"risico":2,"effectTijd":"8–12 weken","belgie":"Op voorschrift van de huisarts.","kritisch":"Observationele studie (48 patiënten), geen placebogroep. Werkt beter bij een voorgeschiedenis van spanningshoofdpijn en zonder misselijkheid.","bronnen":[{"t":"Gómez-Mayordomo et al. – amitriptyline post-COVID hoofdpijn","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9553757/"}]},{"id":"migrainepreventie","naam":"Migraine-preventie (candesartan, propranolol, ...)","fase":3,"oordeel":"arts","bewijs":"C","symptomen":["hoofdpijn","pots","spanning"],"kern":"Als de hoofdpijn op migraine lijkt, kunnen klassieke preventiemiddelen helpen. Propranolol dempt ook hartkloppingen.","uitleg":"Opties volgens de arts: propranolol (ook bij POTS-achtige hartkloppingen; lage dosis), candesartan (niet bij lage bloeddruk), topiramaat (kan brain fog verergeren), anti-CGRP-middelen bij chronische migraine (strenge terugbetalingsvoorwaarden).","kost":1,"kostTekst":"€3–15/maand; anti-CGRP alleen betaalbaar met terugbetaling","energie":1,"risico":2,"effectTijd":"6–12 weken","belgie":"Huisarts of neuroloog. Anti-CGRP alleen via een neuroloog met een terugbetalingsaanvraag.","kritisch":"Het bewijs komt uit migraine-onderzoek, niet specifiek uit long covid.","bronnen":[]},{"id":"magnesium","naam":"Magnesium + vitamine B2","fase":2,"oordeel":"proberen","bewijs":"C","symptomen":["hoofdpijn","spanning","slaap"],"kern":"Goedkope migrainepreventie met weinig risico. Probeer het 3 maanden en houd bij of het helpt.","uitleg":"Magnesium (citraat of bisglycinaat) ±300–400 mg/dag en riboflavine (B2) 400 mg/dag zijn klassieke dosissen bij migraine. Bijwerking: diarree. Niet bij nierproblemen zonder arts.","kost":1,"kostTekst":"±€8–15/maand","energie":1,"risico":1,"effectTijd":"8–12 weken","belgie":"Apotheek, zonder voorschrift.","kritisch":"Bewijs uit migraine-onderzoek (bescheiden). Niet onderzocht bij long covid.","bronnen":[]},{"id":"antihistamine","naam":"Antihistaminica (H1 ± H2)","fase":2,"oordeel":"arts","bewijs":"C","symptomen":["darm","ontsteking","brainfog","pots","spanning","hoofdpijn"],"kern":"Een goedkope proef van 4–8 weken. In een kleine studie verdwenen de klachten bij 29% en verbeterden ze bij velen, vooral bij allergie-achtige signalen.","uitleg":"H1: fexofenadine 180 mg of (levo)cetirizine. H2 (famotidine) wordt soms toegevoegd. Vraag de apotheker naar de beschikbaarheid in België. Signalen dat het zinvol kan zijn: blozen, jeuk, netelroos, reactie op eten of geuren, darmklachten. Spreek het af met de huisarts.","kost":1,"kostTekst":"±€5–15/maand","energie":1,"risico":1,"effectTijd":"2–6 weken","belgie":"Grotendeels zonder voorschrift bij de apotheek. Bespreek de combinatie en dosis met de arts.","kritisch":"Kleine, niet-geblindeerde studie (14 versus 13 patiënten). Nederlandse long-covid-poli's gebruiken het al. Grote RCT's ontbreken.","bronnen":[{"t":"Salvucci et al. 2023 – antihistaminica bij long covid","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10388239/"}]},{"id":"histaminedieet","naam":"Laag-histaminedieet (korte proef)","fase":2,"oordeel":"proberen","bewijs":"D","symptomen":["darm","hoofdpijn","ontsteking"],"kern":"Hooguit 2–4 weken proberen, alleen bij allergie-achtige klachten. Daarna opnieuw uitbreiden.","uitleg":"Vermijd tijdelijk gerijpte kaas, gefermenteerd voedsel, alcohol en restjes. Voeg daarna producten één voor één terug toe. Liefst met een diëtist om tekorten te vermijden.","kost":1,"kostTekst":"Neutraal","energie":3,"risico":2,"effectTijd":"2–4 weken","belgie":"Diëtist via het zorgtraject.","kritisch":"Weinig bewijs. Kost energie (koken, plannen). Risico op onnodig beperkt eten.","bronnen":[]},{"id":"ldn","naam":"Low-dose naltrexone (LDN)","fase":3,"oordeel":"arts","bewijs":"C","symptomen":["pem","ontsteking","brainfog","hoofdpijn","slaap"],"kern":"Populair middel met weinig risico. Vier observationele studies tonen voordeel, maar placebogecontroleerde resultaten zijn er nog niet.","uitleg":"Dosis 0,5–4,5 mg, langzaam opbouwen. Bijwerkingen: levendige dromen, slapeloosheid de eerste weken. Niet samen met opioïden (bv. tramadol, codeïne).","kost":2,"kostTekst":"Magistrale bereiding: richtprijs €20–40/maand (te verifiëren bij apotheker); niet terugbetaald","energie":1,"risico":1,"effectTijd":"2–3 maanden","belgie":"Off-label voorschrift nodig (huisarts of specialist), en een apotheker die het bereidt. Niet elke arts wil het voorschrijven; neem bronnen mee.","kritisch":"RCT's lopen: UBC Canada (post-COVID-vermoeidheid) en Brave-LC (RECOVER, 6–25 jaar). Tot die resultaten er zijn, blijft het effect onzeker.","bronnen":[{"t":"UBC LDN-trial (ME Association)","u":"https://meassociation.org.uk/wp-content/uploads/2025/08/Biomedical-1-A-Double-Blind-Randomized-Trial-of-Low-Dose-Naltrexone.pdf"},{"t":"RECOVER-TLC Brave-LC","u":"https://recovercovid.org/news/recover-mid-year-2026-progress-and-whats-ahead"}]},{"id":"fluvoxamine","naam":"Fluvoxamine","fase":3,"oordeel":"arts","bewijs":"B","symptomen":["pem","brainfog","spanning"],"kern":"Eén goede RCT (399 deelnemers, 2026) toonde een bescheiden vermindering van vermoeidheid en betere levenskwaliteit na 60 dagen.","uitleg":"Dosis in de studie: 100 mg tweemaal daags. Fluvoxamine is een antidepressivum met een sigma-1-effect. Het geeft veel interacties (sterke remmer van CYP1A2 en CYP2C19): koffie, sommige spierontspanners en bloedverdunners. Bijwerkingen: misselijkheid, slaap.","kost":1,"kostTekst":"±€10–20/maand","energie":1,"risico":3,"effectTijd":"4–8 weken","belgie":"Op voorschrift. Vraag de apotheker om een interactiecheck.","kritisch":"Effect bescheiden (−0,43 op de vermoeidheidsschaal), korte follow-up (90 dagen), enkel vermoeidheid gemeten. Nog niet herhaald. Past bij de serotoninetheorie (Wong, Cell 2023): bij muizen herstelde een SSRI de geheugenproblemen.","bronnen":[{"t":"Annals of Internal Medicine 2026 (ME Association samenvatting)","u":"https://meassociation.org.uk/2026/04/annals-of-internal-medicine-randomised-trial-assesses-treatments-for-fatigue-in-long-covid-showing-mixed-results/"}]},{"id":"betablokker","naam":"Lage dosis bètablokker (bij hoge hartslag)","fase":3,"oordeel":"arts","bewijs":"C","symptomen":["pots","spanning","hoofdpijn"],"kern":"Kan hartkloppingen en het 'opgejaagde' gevoel dempen bij POTS-achtige klachten.","uitleg":"Bijvoorbeeld propranolol 10 mg (ook migraine-preventie) of bisoprolol. Kan vermoeidheid of lage bloeddruk geven. Niet bij astma (propranolol).","kost":1,"kostTekst":"±€3–8/maand","energie":1,"risico":2,"effectTijd":"Dagen","belgie":"Huisarts of cardioloog.","kritisch":"Standaard POTS-praktijk (kleine studies). Ivabradine (een andere hartslagverlager) verbeterde in een RCT de klachten niet. Een lagere hartslag betekent dus niet automatisch dat je je beter voelt.","bronnen":[]},{"id":"guanfacine","naam":"Guanfacine + NAC (brain fog)","fase":3,"oordeel":"onderzoek","bewijs":"D","symptomen":["brainfog","spanning"],"kern":"Kleine casusreeks (Yale) met betere concentratie. Interessant, maar niet bewezen.","uitleg":"Guanfacine werkt op de prefrontale cortex; NAC is een antioxidant. Kan de bloeddruk verlagen (opletten bij POTS).","kost":2,"kostTekst":"Te verifiëren (guanfacine is in België geregistreerd voor ADHD)","energie":1,"risico":2,"effectTijd":"Weken","belgie":"Alleen via een specialist die het off-label wil voorschrijven.","kritisch":"Zeer klein en zonder controlegroep.","bronnen":[]},{"id":"sgb","naam":"Stellate ganglion block (SGB)","fase":4,"oordeel":"onderzoek","bewijs":"D","symptomen":["spanning","brainfog","pots","pem","hoofdpijn"],"kern":"Een prik in de hals die het 'vecht-of-vlucht'-systeem tijdelijk dempt. Hoopvolle verhalen, maar nog geen gecontroleerde studie.","uitleg":"Een verdovingsmiddel naast een zenuwknoop in de hals, onder echogeleide. De RCT Block-LC (RECOVER) start eind 2026. Tot dan steunt het bewijs alleen op terugblikkende reeksen.","kost":4,"kostTekst":"Privé: enkele honderden euro's per behandeling (te verifiëren); niet terugbetaald voor long covid","energie":3,"risico":3,"effectTijd":"Uren tot weken","belgie":"Sommige pijnklinieken of anesthesisten doen SGB voor andere indicaties. Vraag naar hun ervaring.","kritisch":"Retrospectieve reeksen (41–52 patiënten) zonder placebogroep. Het placebo-effect van een ingreep is groot. Wacht liefst op Block-LC.","bronnen":[{"t":"Retrospectieve cohort SGB 2025","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12374758/"},{"t":"RECOVER-TLC Block-LC","u":"https://recovercovid.org/news/recover-mid-year-2026-progress-and-whats-ahead"}]},{"id":"tavns","naam":"Vagusstimulatie via het oor (taVNS)","fase":4,"oordeel":"onbewezen","bewijs":"B","symptomen":["spanning","pem","brainfog"],"kern":"In de beste studie deed een nepstimulatie het even goed of beter. Niet aangeraden om te kopen.","uitleg":"Een apparaatje met een oorclip. Het verhoogt wel de HRV, maar de klachten verbeterden niet meer dan met placebo.","kost":3,"kostTekst":"€200–500 apparaat","energie":1,"risico":1,"effectTijd":"—","belgie":"Online te koop. Wordt vaak agressief gemarket.","kritisch":"Systematische review 2026: bewijs van zeer lage zekerheid; sham ≥ actief.","bronnen":[{"t":"Systematische review taVNS 2026","u":"https://s4me.info/threads/transcutaneous-auricular-vagus-nerve-stimulation-for-post-covid-19-condition-a-systematic-review-and-critical-appraisa%E2%80%A6-2026-balan.50674/"}]},{"id":"sim01","naam":"Synbioticum SIM01 (darmflora)","fase":4,"oordeel":"onderzoek","bewijs":"B","symptomen":["darm","pem","brainfog"],"kern":"Eén grote RCT (463 patiënten, Hongkong) toonde minder vermoeidheid en geheugenklachten. Het product is in België niet verkrijgbaar.","uitleg":"Een specifieke mix van bifidobacteriën en vezels. Gewone probiotica uit de winkel zijn niet hetzelfde en niet onderzocht.","kost":3,"kostTekst":"Niet verkrijgbaar in de EU (stand oktober 2026)","energie":1,"risico":1,"effectTijd":"6 maanden","belgie":"Niet beschikbaar. Kijk uit voor 'look-alike'-producten.","kritisch":"Eén ziekenhuis, door de ontwikkelaars zelf uitgevoerd (belangenconflict). Moet herhaald worden.","bronnen":[{"t":"Lancet Infect Dis 2024 (CUHK)","u":"https://www.med.cuhk.edu.hk/press-releases/cu-medicine-study-published-in-the-lancet-infectious-diseases-concludes-that-a-novel-oral-microencapsulated-live-bacteria-consortia-sim01-alleviates-long-covid-symptoms"}]},{"id":"hbot","naam":"Hyperbare zuurstoftherapie (HBOT / zuurstofcabine)","fase":4,"oordeel":"onderzoek","bewijs":"B","symptomen":["brainfog","pem"],"kern":"Korte reeksen (10 sessies) deden het niet beter dan placebo. Lange reeksen (40+ sessies, 2 ATA) hebben één positieve placebogecontroleerde studie, met effect tot 1 jaar. Heel duur, en het effect lijkt weg te ebben.","uitleg":"Israëlische RCT (Zilberman-Itskovich 2022): 73 patiënten, 40 dagelijkse sessies bij 2,0 ATA tegen een sham. Verbetering in cognitie, energie, slaap, psychische klachten en pijn; bij opvolging na 1 jaar bleef het effect grotendeels behouden. Daartegenover staan HOT-LoCO (Zweden) en D'hoore (Brussel, Militair Hospitaal) met elk 10 sessies: geen verschil met placebo. Het aantal sessies zou dus het verschil kunnen maken. Dat is nog niet bewezen, want de positieve studie moet nog herhaald worden. Let op het type: een 'zachte' wellnesscabine (1,3–1,5 ATA) is niet hetzelfde als medische HBOT in een harde drukkamer (2,0–2,5 ATA) en heeft geen bewijs.","kost":5,"kostTekst":"Niet terugbetaald voor long covid. Een reeks van 40–50 sessies kost duizenden euro's. Er loopt een verzoekschrift in de Kamer om de terugbetaling uit te breiden.","energie":4,"risico":2,"effectTijd":"Na 20–40 sessies; effect mogelijk 6–12 maanden, daarna kan het afnemen","belgie":"Medische drukkamers zijn er in o.a. het Militair Hospitaal Koningin Astrid (Neder-over-Heembeek) en enkele ziekenhuizen. Ook privécentra bieden harde drukkamers (±2 bar) aan. Vraag altijd naar de druk, het zuurstofpercentage, de duur en het aantal sessies, en vergelijk met het studieprotocol: 2,0 ATA, 100% zuurstof via masker, 90 minuten met luchtpauzes, 40 sessies. Vraag ook naar studies, want deelname is gratis. De dagelijkse verplaatsing is zelf een grote energiekost bij PEM.","kritisch":"Het bewijs is tegenstrijdig: 1 positieve studie met een lange reeks, 2 negatieve met een korte reeks. Een eerder persoonlijk positief effect is een belangrijk signaal om met de arts te bespreken, maar het kan ook samenvallen met natuurlijke schommelingen. Investeer niet opnieuw duizenden euro's zonder eerst te overleggen met de arts. Vraag bij een nieuwe reeks naar een onderhoudsschema en noteer het effect in het dagboek.","bronnen":[{"t":"Zilberman-Itskovich 2022 – RCT 40 sessies (Sci Rep)","u":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9276805/"},{"t":"Opvolging na 1 jaar (2024)","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10869702"},{"t":"D'hoore et al. 2025 (Brussel, 10 sessies)","u":"https://s4me.info/threads/effect-of-normobaric-and-hyperbaric-hyperoxia-treatment-on-symptoms-and-cognitive-capacities-in-long-covid-patients-placebo-rct-2025-d%E2%80%99hoore.44775"},{"t":"HOT-LoCO 2025 (10 sessies)","u":"https://meassociation.org.uk/2025/04/bmj-hyperbaric-oxygen-therapy-compared-to-sham-treatment-for-long-covid/"},{"t":"Kamer – verzoekschrift terugbetaling HBOT","u":"https://dekamer.mijnopinie.belgium.be/initiatives/i-1154?locale=nl"}]},{"id":"aferese","naam":"Aferese / immunoadsorptie / 'bloedwassen'","fase":4,"oordeel":"afgeraden","bewijs":"D","symptomen":["ontsteking","pem","brainfog"],"kern":"Duizenden euro's in buitenlandse privéklinieken, zonder bewezen effect. Alleen zinvol binnen een studie.","uitleg":"Bloedplasma wordt gefilterd om antistoffen of 'microstolsels' te verwijderen. Een sham-gecontroleerde studie van de Charité (Berlijn) loopt nog; de resultaten zijn niet gepubliceerd.","kost":5,"kostTekst":"€1.000+ per sessie, vaak meerdere sessies, plus reis","energie":5,"risico":3,"effectTijd":"—","belgie":"Niet terugbetaald. Pas op voor klinieken die via patiëntengroepen werven.","kritisch":"Grote financiële en lichamelijke belasting (reis, infuus, infectierisico). Wacht op de resultaten van gecontroleerde studies.","bronnen":[{"t":"Charité sham-RCT NCT05710770","u":"https://clinicaltrials.gov/study/NCT05710770"}]},{"id":"anticoag","naam":"Nattokinase / 'triple therapie' tegen microstolsels","fase":4,"oordeel":"afgeraden","bewijs":"E","symptomen":["ontsteking","brainfog","pem"],"kern":"Er zijn geen RCT's, en wel een bloedingsrisico (zeker samen met aspirine of bloedverdunners).","uitleg":"De theorie over microstolsels is interessant, maar onbewezen als oorzaak. De combinatie van antistolling en plaatjesremmers zonder duidelijke indicatie is gevaarlijk.","kost":2,"kostTekst":"€20–40/maand (supplement)","energie":1,"risico":4,"effectTijd":"—","belgie":"Nooit zelf combineren met bloedverdunners. Meld supplementen altijd aan arts en tandarts.","kritisch":"Er bestaan geen geregistreerde grote RCT's voor nattokinase bij long covid.","bronnen":[{"t":"Science Feedback – nattokinase","u":"https://science.feedback.org/review/no-scientific-evidence-for-claim-nattokinase-treat-long-covid-detox-covid19-vaccines/"}]},{"id":"paxlovid","naam":"Paxlovid (verlengde kuur) als behandeling","fase":4,"oordeel":"onbewezen","bewijs":"A","symptomen":["pem","brainfog","pots"],"kern":"Drie RCT's (o.a. RECOVER-VITAL 2026, 15–25 dagen) toonden geen verbetering bij long covid die er al is.","uitleg":"Mogelijk wel nuttig in de acute fase van een nieuwe infectie. Bespreek dat dan met de arts.","kost":4,"kostTekst":"Duur; niet terugbetaald voor deze indicatie","energie":1,"risico":2,"effectTijd":"—","belgie":"—","kritisch":"Sterk negatief bewijs voor de behandeling van bestaande long covid.","bronnen":[{"t":"Health Rising – overzicht 2026","u":"https://www.healthrising.org/blog/2026/04/21/long-covid-clinical-trials-immunomudulatory-chronic-fatigue/"}]},{"id":"metformine","naam":"Metformine","fase":4,"oordeel":"onbewezen","bewijs":"B","symptomen":["pem"],"kern":"Als behandeling van bestaande long covid werkt het niet (RCT 2026). Bij een nieuwe infectie verkleint het mogelijk het risico op verergering.","uitleg":"In COVID-OUT gaf metformine binnen 3 dagen na de infectie 41% minder nieuwe long covid (63% bij een vroege start). Bespreek dit met de huisarts als plan voor een volgende infectie.","kost":1,"kostTekst":"Goedkoop","energie":1,"risico":2,"effectTijd":"—","belgie":"Op voorschrift.","kritisch":"Preventie en behandeling zijn twee verschillende vragen. Voor jouw situatie (bestaande long covid) is er geen effect.","bronnen":[{"t":"ME Association – fluvoxamine/metformine RCT","u":"https://meassociation.org.uk/2026/04/annals-of-internal-medicine-randomised-trial-assesses-treatments-for-fatigue-in-long-covid-showing-mixed-results/"}]},{"id":"coq10","naam":"Co-enzym Q10 en 'mitochondriële' supplementen","fase":4,"oordeel":"onbewezen","bewijs":"B","symptomen":["pem","brainfog"],"kern":"CoQ10 deed het in een RCT (121 patiënten) niet beter dan placebo. Supplementstapels kosten veel geld.","uitleg":"Ook NAD+, D-ribose en dergelijke zijn bij long covid niet aangetoond.","kost":2,"kostTekst":"€20–60/maand","energie":1,"risico":1,"effectTijd":"—","belgie":"—","kritisch":"Wantrouw 'protocollen' met 10+ supplementen.","bronnen":[{"t":"Health Rising – overzicht 2026","u":"https://www.healthrising.org/blog/2026/04/21/long-covid-clinical-trials-immunomudulatory-chronic-fatigue/"}]},{"id":"cognitievetraining","naam":"Online hersentraining (BrainHQ e.d.)","fase":4,"oordeel":"onbewezen","bewijs":"B","symptomen":["brainfog"],"kern":"Een grote RCT (328 deelnemers) vond geen voordeel en de training kost mentale energie. Een kleine studie met CICT (14 deelnemers) was wel positief.","uitleg":"Brain fog is bij PEM vaak een gevolg van overbelasting. Meer 'trainen' kan dan averechts werken.","kost":2,"kostTekst":"Abonnement €10–15/maand","energie":4,"risico":2,"effectTijd":"—","belgie":"Een neuropsycholoog in het zorgtraject kan compenserende strategieën aanleren (agenda, lijstjes), wat wel zinvol is.","kritisch":"Trainen is iets anders dan compenseren. Compenserende strategieën zijn wel zinvol.","bronnen":[{"t":"Health Rising – overzicht 2026","u":"https://www.healthrising.org/blog/2026/04/21/long-covid-clinical-trials-immunomudulatory-chronic-fatigue/"}]},{"id":"get","naam":"Graded exercise therapy (stapsgewijs opbouwen)","fase":4,"oordeel":"afgeraden","bewijs":"A","symptomen":["pem"],"kern":"Bij PEM afgeraden. 54–74% van de ME/CVS-patiënten meldt achteruitgang. Het KCE (2026) en NICE waarschuwen ervoor.","uitleg":"Een vast opbouwschema ('elke week 10% meer') negeert PEM. Symptoomgestuurde, zeer voorzichtige activiteit binnen de envelop is iets anders.","kost":0,"kostTekst":"—","energie":5,"risico":5,"effectTijd":"—","belgie":"Weiger dit beleefd als een revalidatiecentrum of kine het voorstelt. Verwijs naar het KCE-rapport 2026.","kritisch":"Belangrijk punt: het kan blijvende achteruitgang geven.","bronnen":[{"t":"KCE 2026","u":"https://www.domusmedica.be/actueel/mecvs-belgie-nood-aan-structurele-en-patientgerichte-zorg"},{"t":"Emerge Australia – exercise","u":"https://emerge.org.au/?p=86022"}]},{"id":"hersenprogramma","naam":"Commerciële 'brain retraining'-programma's","fase":4,"oordeel":"onbewezen","bewijs":"E","symptomen":["spanning","pem"],"kern":"Dure programma's (Gupta, DNRS, ...) beloven herstel door 'het brein te herprogrammeren'. Er is geen degelijk bewijs.","uitleg":"Ze steunen vaak op getuigenissen. Sommige moedigen aan om symptomen te negeren, wat bij PEM riskant is. Ontspanningselementen zijn gratis elders te vinden.","kost":3,"kostTekst":"€150–300+","energie":3,"risico":3,"effectTijd":"—","belgie":"—","kritisch":"Let op schuldgevoel ('je wilt niet genoeg beter worden').","bronnen":[]},{"id":"bc007","naam":"BC007 (rovunaptabin)","fase":4,"oordeel":"onbewezen","bewijs":"B","symptomen":["pem"],"kern":"De placebogecontroleerde studie (2024) was negatief. Alleen een kleine, geselecteerde studie zonder controlegroep was positief. Niet beschikbaar.","uitleg":"Het middel neutraliseert auto-antistoffen tegen receptoren. Mogelijk werkt het alleen bij een subgroep.","kost":5,"kostTekst":"Niet beschikbaar","energie":1,"risico":2,"effectTijd":"—","belgie":"—","kritisch":"Een voorbeeld van hoop die niet standhield in een grotere studie.","bronnen":[{"t":"UNMC – gefaalde BC007-trial","u":"https://www.unmc.edu/healthsecurity/transmission/2025/07/23/a-rare-drug-trial-for-long-covid-failed-yielding-lessons-on-study-design/"}]},{"id":"baricitinib","naam":"Baricitinib (JAK-remmer)","fase":4,"oordeel":"onderzoek","bewijs":"E","symptomen":["ontsteking","brainfog","pem"],"kern":"Wordt nu getest in REVERSE-LC (VS, 17 centra). Er zijn nog geen resultaten. Niet off-label gebruiken (afweer onderdrukt).","uitleg":"Remt ontstekingssignalen. Verhoogt het infectierisico, wat extra belangrijk is als je al vatbaar bent.","kost":5,"kostTekst":"Niet beschikbaar voor deze indicatie","energie":1,"risico":4,"effectTijd":"—","belgie":"—","kritisch":"Op de watchlist.","bronnen":[{"t":"RECOVER-TLC","u":"https://recovercovid.org/news/recover-mid-year-2026-progress-and-whats-ahead"}]},{"id":"pyridostigmine","naam":"Pyridostigmine (Mestinon)","fase":3,"oordeel":"onderzoek","bewijs":"D","symptomen":["pots","pem"],"kern":"Wordt soms gebruikt bij POTS en ME/CVS (kleine studies). Alleen via een specialist.","uitleg":"Verhoogt de acetylcholine. Bijwerkingen: darmkrampen, diarree, speekselvloed.","kost":2,"kostTekst":"±€15–30/maand","energie":1,"risico":2,"effectTijd":"Dagen–weken","belgie":"Via een cardioloog of neuroloog met POTS-ervaring.","kritisch":"Klein bewijs; vooral bij POTS met een lage vullingsdruk in kleine studies.","bronnen":[]},{"id":"aripiprazol","naam":"Aripiprazol in zeer lage dosis","fase":4,"oordeel":"onderzoek","bewijs":"D","symptomen":["pem","brainfog"],"kern":"Casusreeksen bij ME/CVS met minder brain fog en vermoeidheid. Geen RCT bij long covid.","uitleg":"Dosis 0,1–2 mg (veel lager dan bij psychiatrische indicaties). Vereist een bereiding of vloeibare vorm.","kost":2,"kostTekst":"±€15–30/maand","energie":1,"risico":2,"effectTijd":"Weken","belgie":"Alleen via een arts die off-label wil voorschrijven.","kritisch":"Zeer beperkt bewijs.","bronnen":[]},{"id":"studie","naam":"Deelnemen aan een klinische studie","fase":4,"oordeel":"proberen","bewijs":"D","symptomen":["pem","brainfog","ontsteking","spanning","pots","hoofdpijn"],"kern":"Je krijgt gratis toegang tot nieuwe middelen onder controle en je helpt het onderzoek vooruit.","uitleg":"Zoek op clinicaltrials.gov of in het EU Clinical Trials-register (CTIS) met 'Belgium' en 'long COVID' of 'post-COVID'. Het Rega Instituut (KU Leuven) doet long-covid-onderzoek. Let op: deelname kost energie (bezoeken) en je kunt placebo krijgen.","kost":0,"kostTekst":"Meestal gratis, soms reisvergoeding","energie":3,"risico":2,"effectTijd":"—","belgie":"Vraag de huisarts of een universitair ziekenhuis naar lopende studies.","kritisch":"Vraag altijd: wie betaalt de studie, is er een placebogroep, en mag je stoppen?","bronnen":[{"t":"EU Clinical Trials (CTIS)","u":"https://euclinicaltrials.eu/"},{"t":"ClinicalTrials.gov","u":"https://clinicaltrials.gov/"}]},{"id":"methylfenidaat","naam":"Methylfenidaat (Rilatine)","fase":3,"oordeel":"arts","bewijs":"C","symptomen":["brainfog","pem"],"kern":"Een stimulans (ADHD-middel) die bij een deel van de patiënten de concentratie en de vermoeidheid verbetert. Het kan je grens wel maskeren, waardoor je makkelijker over je grens gaat en crasht.","uitleg":"In een Belgische RCT (UZ Leuven, 60 ME/CVS-patiënten, 4 weken, 2 × 10 mg) daalden vermoeidheid en concentratieklachten bescheiden ten opzichte van placebo. Op lange termijn bleek het effect bij ongeveer 1 op 3. Bij long covid zijn er alleen casusreeksen (bv. Johns Hopkins: 3 van 6 patiënten verbeterden). Bijwerkingen: snellere hartslag, onrust, slapeloosheid, minder eetlust, en hoofdpijn (!). Begin laag, alleen op ochtenden, en blijf strikt pacen.","kost":2,"kostTekst":"Niet terugbetaald voor volwassenen. Gewone Rilatine (kort werkend) is goedkoper; varianten met verlengde werking kosten ±€100+/maand.","energie":1,"risico":3,"effectTijd":"Binnen uren (per dosis); evaluatie na 2–4 weken","belgie":"Op voorschrift (verdovend middel, beperkt voorschrift), off-label. Vraag de huisarts, een neuroloog of een internist. De Belgische studie van Blockmans (UZ Leuven) is bij artsen bekend.","kritisch":"Past slecht bij dit klachtenprofiel als 'paraatheid', hoofdpijn of POTS op de voorgrond staan: een stimulans kan net die klachten versterken. Grootste risico bij PEM: je voelt je energieker, doet meer en crasht later. Gebruik daarom het dagboek en de hartslagbewaking. Het is geen behandeling van de oorzaak; het effect stopt als je stopt.","bronnen":[{"t":"Blockmans et al. 2006 – RCT bij CVS (bespreking s4me)","u":"https://s4me.info/threads/does-methylphenidate-reduce-the-symptoms-of-chronic-fatigue-syndrome-2006-blockmans-et-al.26116"},{"t":"Methylfenidaat bij post-COVID brain fog – casusreeks","u":"https://www.journalmc.org/index.php/JMC/article/view/4254/3623"},{"t":"Kamer – terugbetaling ADHD-medicatie volwassenen (verzoekschrift)","u":"https://dekamer.mijnopinie.belgium.be/initiatives/i-1305?locale=nl"}],"bron_aangeleverd":"Tip van de partner (18/10/2026)"},{"id":"serotonine","naam":"Serotonineroute: tryptofaan / 5-HTP-supplementen","fase":4,"oordeel":"onderzoek","bewijs":"D","symptomen":["brainfog","darm","slaap"],"kern":"Interessante theorie (Cell 2023): virusresten in de darm → ontsteking → minder tryptofaan → minder serotonine → brain fog. Tryptofaan herstelde het geheugen bij muizen, maar dat werd nog niet bij mensen getest.","uitleg":"Penn-onderzoekers (Wong et al., Cell 2023) vonden bij een deel van de long-covid-patiënten lagere serotonine in het bloed, en soms virusresten in de stoelgang. Bij muizen herstelden tryptofaan of een SSRI (fluoxetine) het geheugen. Dit is een mechanisme en nog geen behandeling. De SSRI fluvoxamine had in 2026 wel een positieve RCT bij mensen (zie die kaart), wat in dezelfde richting wijst.","kost":1,"kostTekst":"Tryptofaan/5-HTP ±€10–25/maand","energie":1,"risico":3,"effectTijd":"Onbekend","belgie":"Tryptofaan en 5-HTP zijn vrij verkrijgbaar als supplement. Neem het nooit zelf in combinatie met antidepressiva (SSRI's zoals fluvoxamine), tramadol, triptanen (migraine) of amitriptyline zonder overleg met de arts of apotheker.","kritisch":"Gevonden in een subgroep, oorzaak en gevolg alleen aangetoond bij muizen. Er is kritiek op de methode (hoe serotonine in het bloed gemeten werd). Risico: serotoninesyndroom bij combinatie met andere serotonerge middelen. Een serotoninemeting is geen standaardtest; vraag de arts of dat zinvol is.","bronnen":[{"t":"Wong et al. 2023 – Cell","u":"https://www.cell.com/cell/fulltext/S0092-8674(23)01034-6"},{"t":"Samenvatting (News-Medical)","u":"https://www.news-medical.net/news/20231020/Low-serotonin-levels-observed-in-long-COVID-and-other-viral-infections.aspx"},{"t":"Kritische commentaar (J Inflamm Res)","u":"https://www.tandfonline.com/doi/full/10.2147/JIR.S456000"}]}],"financieel":[{"id":"fin_invaliditeit","groep":"Inkomen","prioriteit":1,"naam":"Invaliditeitsuitkering: klopt je gezinscategorie?","voorWie":"Iedereen die langer dan 1 jaar arbeidsongeschikt is (werknemer of werkloze).","wat":"Na 1 jaar: 65% (met gezinslast), 55% (alleenstaande) of 40% (samenwonende) van het begrensde brutoloon. Minimum voor een regelmatige werknemer met gezinslast vanaf 1/9/2026: ±€82,7 per dag (6-dagenweek; bronnen verschillen met enkele cent). Boven bepaalde grenzen wordt 3,5% ingehouden.","actie":"Controleer of de gezinssituatie die het ziekenfonds kent (alleen, samenwonend, gezinslast) nog klopt. Een verandering (bv. de partner verliest inkomen) kan de categorie 'gezinslast' geven: dat is 65% in plaats van 40%. Meld wijzigingen altijd zelf.","tip":"De dienst maatschappelijk werk van het ziekenfonds rekent dit gratis voor je na.","bron":"https://www.riziv.fgov.be/nl/thema-s/arbeidsongeschiktheid/bedragen-en-loonplafonds-uitkeringen/werknemers-werklozen/minimumbedrag-van-uw-arbeidsongeschiktheidsuitkering","gecontroleerd":"2026-10"},{"id":"fin_gewaarborgd","groep":"Inkomen","prioriteit":1,"naam":"Gewaarborgd inkomen-verzekering van de (ex-)werkgever","voorWie":"Wie bij een werkgever met een groepsverzekering werkte toen de ziekte begon (bij jou: november 2021).","wat":"Veel groepsverzekeringen (vaak bij het pensioenplan) hebben een waarborg 'gewaarborgd inkomen' of 'arbeidsongeschiktheidsrente' en 'premievrijstelling'. Een ziekte die begon tijdens de tewerkstelling blijft vaak gedekt na het einde van het contract, zolang de ongeschiktheid duurt.","actie":"Vraag bij de ex-werkgever (HR) of op mypension.be (luik aanvullend pensioen; via DB2P) welke groepsverzekering er was. Vraag de verzekeraar schriftelijk of er een arbeidsongeschiktheidsdekking was en of die al uitbetaalt. Vraag ook of de pensioenopbouw doorloopt (premievrijstelling).","tip":"Dit wordt vaak vergeten en kan honderden euro's per maand betekenen, met terugwerkende kracht volgens de polis. Let op verjaringstermijnen: ga er snel achteraan.","bron":"https://www.mypension.be/","gecontroleerd":"2026-10"},{"id":"fin_ontslag","groep":"Inkomen","prioriteit":2,"naam":"Einde contract: medische overmacht, outplacement, documenten","voorWie":"Wie uit dienst ging tijdens de ziekte.","wat":"Als het contract eindigde via 'medische overmacht' (sinds 2023 alleen na een re-integratieprocedure en minstens 9 maanden ongeschiktheid), is er onder voorwaarden recht op outplacement. Bij een gewoon ontslag gelden opzegvergoeding en eventueel ontslagcompensatie.","actie":"Zoek het ontslagdocument (C4) en de beslissing op. Twijfel je of alles correct liep? Vraag je vakbond of de juridische dienst van het ziekenfonds om het na te kijken.","tip":"De vakbond helpt leden gratis. De termijnen voor betwisting zijn kort; vraag dat ook na.","bron":"https://werk.belgie.be/","gecontroleerd":"2026-10 (te verifiëren per situatie)"},{"id":"fin_beroepsziekte","groep":"Inkomen","prioriteit":3,"naam":"COVID als beroepsziekte (Fedris)","voorWie":"Wie besmet raakte op het werk in de zorg of een essentiële sector, of bij een uitbraak op de werkvloer.","wat":"Fedris erkende COVID-19 onder voorwaarden als beroepsziekte (zorgpersoneel met verhoogd risico, of bij een uitbraak met ≥5 positieve tests binnen 2 weken op dezelfde werkvloer). Bij erkenning: extra vergoeding en terugbetaling van medische kosten.","actie":"Werkte de persoon in november 2021 in de zorg of was er een uitbraak op het werk? Vraag dan via de arbeidsgeneesheer of Fedris na of een aanvraag nog kan.","tip":"Kansen zijn klein buiten de zorgsector, maar de vraag kost weinig.","bron":"https://www.socialsecurity.be/citizen/nl/arbeidsongeschiktheid-ongeval-en-beroepsziekte/beroepsziekte","gecontroleerd":"2026-10 (te verifiëren)"},{"id":"fin_toegelaten","groep":"Inkomen","prioriteit":2,"naam":"Toegelaten arbeid & Terug Naar Werk (alleen als het kan)","voorWie":"Wie wil proberen een beetje te werken of vrijwilligerswerk te doen.","wat":"Deeltijds werken met behoud van een deel van de uitkering kan, maar alleen met voorafgaande toestemming van de adviserend arts. Sinds 2025–2026 zijn er een vragenlijst rond week 10 en strengere opvolging. De Terug Naar Werk-coördinator van het ziekenfonds begeleidt gratis.","actie":"Begin nooit te werken (ook geen vrijwilligerswerk) zonder toestemming vooraf, anders volgt een terugvordering. Vermeld PEM en de energie-envelop expliciet in gesprekken met de adviserend arts.","tip":"Neem het dagboek-overzicht uit de app mee naar de adviserend arts: crashes na inspanning zijn zo zichtbaar.","bron":"https://www.mijntoeslagen.be/gezondheid/arbeidsongeschiktheid/","gecontroleerd":"2026-10"},{"id":"fin_vt","groep":"Zorgkosten","prioriteit":1,"naam":"Verhoogde tegemoetkoming (VT)","voorWie":"Gezinnen met een laag inkomen. Grens vanaf 1/3/2026: €28.662,69 bruto belastbaar per jaar + €5.306,25 per extra gezinslid.","wat":"Lager remgeld (dokter, apotheek, ziekenhuis), lagere maximumfactuur, derdebetalersregeling bij de huisarts, psycholoog €4 in plaats van €11, verlaagde Vlaamse zorgpremie (€35), en vaak het sociaal tarief voor energie en kortingen bij het openbaar vervoer.","actie":"Vraag bij het ziekenfonds een inkomensonderzoek aan. Met een invaliditeitsuitkering als enig gezinsinkomen kom je vaak onder de grens.","tip":"Dit is één van de grootste besparingen. Doe de check, ook als je denkt dat je er net boven zit.","bron":"https://www.inami.fgov.be/nl/thema-s/verzorging-kosten-en-terugbetaling/financiele-toegankelijkheid/verhoogde-tegemoetkoming-grensbedragen-van-de-inkomsten","gecontroleerd":"2026-10"},{"id":"fin_maf","groep":"Zorgkosten","prioriteit":2,"naam":"Maximumfactuur + statuut chronische aandoening","voorWie":"Iedereen (automatisch). Het statuut chronische aandoening geldt vanaf ±€411 zorgkosten per kwartaal gedurende 8 opeenvolgende kwartalen (2026).","wat":"Boven een plafond (afhankelijk van het gezinsinkomen) krijg je remgeld terug. Het statuut chronische aandoening verlaagt dat plafond met €100.","actie":"Gebeurt automatisch, maar controleer bij het ziekenfonds of je het statuut hebt. Vraag ook naar het 'forfait chronisch zieken'.","tip":"Bewaar je apotheekbonnetjes: niet-terugbetaalde middelen tellen niet mee, terugbetaalde wel.","bron":"https://www.inami.fgov.be/nl/thema-s/verzorging-kosten-en-terugbetaling/financiele-toegankelijkheid/statuut-chronische-aandoening","gecontroleerd":"2026-10"},{"id":"fin_zorgtraject","groep":"Zorgkosten","prioriteit":1,"naam":"RIZIV-zorgtraject long covid (deadline 31/12/2026)","voorWie":"Iedereen met long covid (diagnose door huisarts of specialist).","wat":"Gratis kine (60x), ergo, diëtist en neuropsycholoog per behandeljaar. Na 1/1/2027 kunnen geen nieuwe overeenkomsten meer gesloten worden.","actie":"Plan nu een afspraak bij de huisarts om het traject te activeren of te verlengen, vóór 31/12/2026.","tip":"Volg in januari 2027 op of het RIZIV een opvolgtraject aankondigt.","bron":"https://www.riziv.fgov.be/nl/thema-s/verzorging-kosten-en-terugbetaling/ziekten/long-covid-19-tegemoetkoming-in-de-kosten-van-zorg-bij-aanhoudende-covid-19-symptomen","gecontroleerd":"2026-10"},{"id":"fin_gmd","groep":"Zorgkosten","prioriteit":3,"naam":"GMD, generieken en slim voorschrijven","voorWie":"Iedereen.","wat":"Met een globaal medisch dossier (GMD) bij één huisarts betaal je ±30% minder remgeld. Generieke medicatie en 'goedkoopst voorschrijven' besparen ook.","actie":"Vraag de huisarts of je GMD actief is. Vraag de apotheker naar het goedkoopste alternatief.","tip":"Vraag bij duurdere supplementen eerst: is er bewijs voor? (zie Behandelingen).","bron":"https://www.riziv.fgov.be/","gecontroleerd":"2026-10"},{"id":"fin_aanvullend","groep":"Zorgkosten","prioriteit":2,"naam":"Aanvullende verzekering van het ziekenfonds & hospitalisatieverzekering","voorWie":"Iedereen die lid is van een ziekenfonds (verschilt per fonds).","wat":"Vaak terugbetaling voor psycholoog, diëtist, steunkousen, thuiszorg, oppas of gezinszorg, vervoer naar het ziekenhuis, herstelverblijf en de uitleendienst voor hulpmiddelen. De hospitalisatieverzekering dekt soms ambulante kosten rond een opname of bij 'ernstige ziekten'.","actie":"Vraag je ziekenfonds om een overzicht van de voordelen voor chronisch zieken. Lees de polis van de hospitalisatieverzekering na.","tip":"Ziekenvervoer en een rolstoel uit de uitleendienst besparen ook energie.","bron":"https://www.cm.be/","gecontroleerd":"2026-10"},{"id":"fin_zorgbudget","groep":"Tegemoetkomingen","prioriteit":2,"naam":"Zorgbudget voor zwaar zorgbehoevenden (Vlaanderen/Brussel)","voorWie":"Mensen die thuis veel hulp nodig hebben (geen leeftijdsgrens), aangetoond met een schaal (o.a. BEL-profiel) of attest.","wat":"€140 per maand, onbelast en niet afhankelijk van het inkomen.","actie":"Vraag het aan via het ziekenfonds (zorgkas). Een thuiszorgdienst of de maatschappelijk werker van het ziekenfonds kan de inschaling doen.","tip":"Betaal de jaarlijkse Vlaamse zorgpremie (2026: €100, €35 met VT). Anders verlies je het recht.","bron":"https://www.vlaanderen.be/publicaties/vlaamse-sociale-bescherming-zorgbudget-voor-zwaar-zorgbehoevenden-zorgen-voor-elkaar-das-toch-normaal","gecontroleerd":"2026-10"},{"id":"fin_it","groep":"Tegemoetkomingen","prioriteit":2,"naam":"Integratietegemoetkoming (FOD, My Handicap)","voorWie":"Vanaf 18 jaar, met verminderde zelfredzaamheid (min. 7 punten op de schaal), erkend door een arts van de DG Personen met een handicap.","wat":"Een maandelijks bedrag afhankelijk van de zelfredzaamheidscategorie en het gezinsinkomen. Een invaliditeitsuitkering wordt grotendeels vrijgesteld (de eerste ±€28.600 vervangingsinkomen). Een erkenning opent ook de deur naar de parkeerkaart, het sociaal tarief, belastingvoordelen en meer.","actie":"Doe de aanvraag via myhandicap.belgium.be (met itsme) of laat de maatschappelijk werker van het ziekenfonds of het OCMW helpen. Beschrijf een slechte dag en PEM concreet, niet je beste dag.","tip":"De erkenning zelf is vaak waardevoller dan het bedrag (parkeerkaart, kortingen).","bron":"https://www.socialsecurity.be/citizen/nl/handicap/tegemoetkomingen-en-uitkeringen","gecontroleerd":"2026-10"},{"id":"fin_vaph","groep":"Tegemoetkomingen","prioriteit":3,"naam":"VAPH: rechtstreeks toegankelijke hulp & hulpmiddelen","voorWie":"Mensen met een (vermoeden van) handicap in Vlaanderen.","wat":"Rechtstreeks toegankelijke hulp (RTH: begeleiding, dagopvang) zonder lange procedure. Tegemoetkoming voor hulpmiddelen en aanpassingen. Het persoonsvolgend budget heeft lange wachttijden.","actie":"Vraag info aan de dienst maatschappelijk werk van het ziekenfonds of op vaph.be.","tip":"Een rolstoel of scooter voor buitenshuis kan veel energie sparen.","bron":"https://www.vaph.be/","gecontroleerd":"2026-10"},{"id":"fin_dmw","groep":"Hulp bij administratie","prioriteit":1,"naam":"Dienst maatschappelijk werk ziekenfonds (gratis)","voorWie":"Elk lid van een ziekenfonds.","wat":"Een maatschappelijk werker kijkt al je rechten na, helpt formulieren invullen en komt soms aan huis.","actie":"Bel je ziekenfonds en vraag een afspraak (telefonisch of aan huis) met de dienst maatschappelijk werk. Zeg dat je energie beperkt is.","tip":"Dit is de beste eerste stap: één gesprek dekt bijna heel deze lijst.","bron":"https://www.cm.be/","gecontroleerd":"2026-10"},{"id":"fin_ocmw","groep":"Hulp bij administratie","prioriteit":3,"naam":"OCMW & schuldhulp","voorWie":"Bij financiële nood of schulden.","wat":"Aanvullende steun, voorschotten, energiehulp en budgetbegeleiding.","actie":"Neem contact op met het OCMW of Sociaal Huis van je gemeente.","tip":"Vraag ook naar de lokale sociale voordelen (gemeentelijke toelagen, kortingen).","bron":"https://www.vlaanderen.be/","gecontroleerd":"2026-10"},{"id":"fin_belasting","groep":"Belastingen","prioriteit":3,"naam":"Belastingen op uitkeringen","voorWie":"Wie een ziekte- of invaliditeitsuitkering krijgt.","wat":"Uitkeringen zijn belastbaar, maar er is een belastingvermindering voor vervangingsinkomen. Op de uitkering wordt bedrijfsvoorheffing ingehouden. Met een erkende handicap (≥66%) krijg je een extra belastingvrije som.","actie":"Laat je belastingaangifte gratis invullen door de FOD Financiën (afspraak in mei–juni) en vermeld de erkenning van de handicap.","tip":"Controleer of je partner je ten laste kan nemen; dat levert soms een extra voordeel op.","bron":"https://financien.belgium.be/","gecontroleerd":"2026-10"},{"id":"fin_pensioen","groep":"Belastingen","prioriteit":3,"naam":"Pensioenopbouw tijdens invaliditeit","voorWie":"Werknemers in invaliditeit.","wat":"Periodes van ziekte en invaliditeit worden gelijkgesteld voor het wettelijk pensioen. Voor het aanvullend pensioen hangt het af van de premievrijstelling (zie gewaarborgd inkomen).","actie":"Controleer op mypension.be of de gelijkgestelde periodes erin staan.","tip":"—","bron":"https://www.mypension.be/","gecontroleerd":"2026-10"},{"id":"fin_dure","groep":"Geld besparen","prioriteit":1,"naam":"Vermijd dure, onbewezen kuren","voorWie":"Iedereen.","wat":"Aferese in het buitenland, supplementstapels, 'brain retraining' en wearables met dure abonnementen kosten samen al snel duizenden euro's. HBOT: alleen na overleg met de arts, als het vroeger aantoonbaar hielp (zie Kennis).","actie":"Gebruik de 'claim-check' in de app voor je betaalt. Vraag een schriftelijke offerte en een bewijsbron.","tip":"Een crowdfunding voor een onbewezen behandeling kan sociale druk geven. Overleg met iemand die je vertrouwt.","bron":"","gecontroleerd":"2026-10"}],"communities":[{"id":"nrb","naam":"Not Recovered Belgium","land":"BE","type":"Belangenvereniging","score":4,"waarom":"Dé actieve Belgische vereniging voor long covid en ME/CVS (sinds 2024). Komt op voor expertisecentra en off-label behandelingen onder toezicht, petities, de ligbetoging van maart 2025 en VRT-aandacht in 2026.","nietVoor":"Medisch advies op maat. Het is een belangenorganisatie.","contact":"notrecoveredbelgium.be (contactformulier) · Bluesky @notrecoveredbel · Instagram/Facebook/YouTube @NotRecoveredBelgium","url":"https://www.notrecoveredbelgium.be/","kritisch":"Activistisch, met een duidelijke standpunt (biomedisch). Dat is nuttig voor belangenbehartiging, maar check medische tips nog steeds zelf."},{"id":"mevereniging","naam":"Belgische ME-Vereniging / ME-helpline","land":"BE","type":"Patiëntenvereniging ME/CVS","score":3,"waarom":"Een langer bestaande ME/CVS-vereniging met een telefonische helpline. Veel long-covid-patiënten met PEM voldoen aan de ME/CVS-criteria.","nietVoor":"Long-covid-specifieke actualiteit.","contact":"me.vereniging@belgacom.net (te verifiëren — vermeld bij EMEA)","url":"https://www.euro-me.org/emeabelgium.shtml","kritisch":"Contactgegevens mogelijk verouderd. Controleer ze eerst."},{"id":"wakeup","naam":"Wake-Up Call Beweging","land":"BE","type":"Belangenvereniging ME/CVS","score":2,"waarom":"Vertegenwoordigt ME/CVS-patiënten in parlementaire hoorzittingen.","nietVoor":"Lotgenotencontact (onduidelijk).","contact":"Te verifiëren (geen actuele website bevestigd)","url":"","kritisch":"Huidige activiteit niet bevestigd in oktober 2026."},{"id":"trefpunt","naam":"Trefpunt Zelfhulp","land":"BE","type":"Gids zelfhulpgroepen","score":4,"waarom":"Een databank van Vlaamse zelfhulpgroepen. Hier vind je lokale of online lotgenotengroepen (long covid, ME/CVS, chronische pijn).","nietVoor":"Medische info.","contact":"trefpuntzelfhulp.be","url":"https://www.trefpuntzelfhulp.be/","kritisch":"De kwaliteit verschilt per groep."},{"id":"vpp","naam":"Vlaams Patiëntenplatform","land":"BE","type":"Koepel patiëntenrechten","score":3,"waarom":"Info over patiëntenrechten, terugbetaling en klachten. Handig als je je niet serieus genomen voelt.","nietVoor":"Long-covid-specifieke info.","contact":"vlaamspatientenplatform.be","url":"https://www.vlaamspatientenplatform.be/","kritisch":"—"},{"id":"rega","naam":"Rega Instituut KU Leuven (Johan Van Weyenbergh)","land":"BE","type":"Onderzoek","score":3,"waarom":"Immunologisch long-covid-onderzoek in België. Een mogelijk aanspreekpunt voor deelname aan studies.","nietVoor":"Behandeling of consultaties.","contact":"Via de website van het Rega Instituut","url":"https://rega.kuleuven.be/","kritisch":"Onderzoekers kunnen geen individueel medisch advies geven."},{"id":"uzleuven","naam":"UZ Leuven – referentiecentrum CVS","land":"BE","type":"Zorg","score":3,"waarom":"Volgens het KCE (2026) het enige erkende multidisciplinaire ME/CVS-referentiecentrum. Er worden ook long-covid-patiënten gezien.","nietVoor":"Snelle hulp (wachttijden).","contact":"Via verwijzing door de huisarts — wachttijd navragen","url":"https://www.uzleuven.be/","kritisch":"Patiëntenorganisaties hebben in het verleden kritiek geuit op een te psychologische aanpak in de Belgische CVS-centra. Vraag vooraf naar hun aanpak van PEM."},{"id":"postcovidnl","naam":"PostCovid NL","land":"NL","type":"Patiëntenvereniging","score":4,"waarom":"Een grote Nederlandstalige vereniging met heldere info. Nederland loopt voor met expertisecentra en het gebruik van antihistaminica.","nietVoor":"Belgische regels (terugbetaling verschilt).","contact":"postcovidnl.nl","url":"https://www.postcovidnl.nl/","kritisch":"Nederlandse zorgcontext."},{"id function $(s){return document.querySelector(s);}

function addDays(s,n){const p=s.split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return dstr(d);}
function daysBetween(a,b){const pa=a.split("-").map(Number),pb=b.split("-").map(Number);return Math.round((new Date(pb[0],pb[1]-1,pb[2]||1)-new Date(pa[0],pa[1]-1,pa[2]||1))/86400000);}

function dots(n,max){max=max||5;let s="";for(let i=1;i<=max;i++)s+=i<=n?"●":"○";return s;}

/* ---------- data (basis + geïmporteerde updates) ---------- */
let DC = null;
function mergeArr(base,upd,del){
  const out = base.map(x=>Object.assign({},x));
  (upd||[]).forEach(u=>{if(!u||!u.id)return;const i=out.findIndex(x=>x.id===u.id);if(i>=0)out[i]=Object.assign(out[i],u);else out.push(Object.assign({},u));});
  return out.filter(x=>!(del||[]).includes(x.id));
}
function D(){
  if(DC) return DC;
  const d = JSON.parse(JSON.stringify(BASE));
  d.meta.bijgewerkt = d.meta.datum;
  (S.updates||[]).slice().sort((a,b)=>String(a.meta.datum).localeCompare(String(b.meta.datum))).forEach(u=>{
    if(String(u.meta.datum) <= String(BASE.meta.datum)) return;
    ["behandelingen","financieel","communities","watchlist"].forEach(k=>{d[k]=mergeArr(d[k],u[k],u.verwijder);});
    if(Array.isArray(u.rodeVlaggen)) d.rodeVlaggen = u.rodeVlaggen;
    d.meta.bijgewerkt = u.meta.datum; d.meta.versie = u.meta.versie||u.meta.datum;
    if(u.meta.opmerking) d.meta.opmerking = u.meta.opmerking;
  });
  DC = d; return d;
}
function T(id){return D().behandelingen.find(t=>t.id===id);}

/* ---------- scoring & plan ---------- */
function score(t,p){
  p = p || {symptomen:{},ernst:"matig",budget:3};
  const vw = VW[t.oordeel]; if(!vw) return 0;
  const sev = p.symptomen||{}; const sy = t.symptomen||[];
  let fit=0,mx=0; sy.forEach(s=>{const v=sev[s]||0;fit+=v;if(v>mx)mx=v;});
  const kost = t.kost||0, en = t.energie||1, ri = t.risico||1;
  const costPen = kost>p.budget ? 3+(kost-p.budget) : kost*0.15;
  const enPen = (en-1)*(ERNSTF[p.ernst]||0.6)*0.6;
  const riskPen = (ri-1)*0.4;
  return ((1+fit*0.5+mx)*(EV[t.bewijs]||1)*vw)/(1+costPen+enPen+riskPen);
}
function fitDots(t,p){const L=D().behandelingen.map(x=>score(x,p)).filter(v=>v>0).sort((x,y)=>y-x);const v=score(t,p);if(v<=0||!L.length)return 0;const r=L.indexOf(v);return Math.max(1,5-Math.floor(5*r/L.length));}
function relevant(t,p){return (t.symptomen||[]).some(s=>(p.symptomen[s]||0)>0);}
function waaromVoorJou(t,p){
  const m = (t.symptomen||[]).filter(s=>(p.symptomen[s]||0)>=2).sort((a,b)=>(p.symptomen[b]||0)-(p.symptomen[a]||0)).slice(0,3).map(symKort);
  return m.length ? "Past bij: "+m.join(", ") : (relevant(t,p)?"Past bij je klachten":"Basis voor iedereen");
}
const ALWAYS = ["zorgtraject","bloed","pacing","crashplan","infectiepreventie"];
function genPlan(keep){
  const p = S.profiel; if(!p) return;
  const all = D().behandelingen;
  const sel = [];
  const add = (t)=>{if(sel.some(x=>x.tid===t.id))return;sel.push({id:uid(),tid:t.id,naam:t.naam,fase:t.fase,status:"gepland",start:"",effect:null,notitie:"",waarom:waaromVoorJou(t,p),auto:true});};
  sel.push({id:uid(),tid:null,naam:"Financiële check via je ziekenfonds (zie Geld)",fase:0,status:"gepland",start:"",effect:null,notitie:"",waarom:"Inkomen en rechten veiligstellen kost één gesprek en spaart later veel energie.",auto:true});
  all.filter(t=>t.oordeel==="basis").filter(t=>ALWAYS.includes(t.id)||relevant(t,p)).sort((a,b)=>a.fase-b.fase||score(b,p)-score(a,p)).forEach(add);
  const lim = {1:2,2:4,3:3,4:1};
  [1,2,3,4].forEach(f=>{
    let c = all.filter(t=>t.fase===f && t.oordeel!=="basis" && VW[t.oordeel]>0 && relevant(t,p) && (t.kost||0)<=p.budget);
    if(p.ernst==="zeerernstig") c = c.filter(t=>(t.energie||1)<=2);
    if(f===4) c = c.filter(t=>score(t,p)>=6);
    c.sort((a,b)=>score(b,p)-score(a,p)).slice(0,lim[f]).forEach(add);
  });
  const kept = keep ? S.plan.filter(x=>!x.auto || x.status!=="gepland") : [];
  S.plan = kept.concat(sel.filter(x=>!kept.some(k=>k.tid && k.tid===x.tid)));
  save();
}

function entry(d){return S.dagboek[d]||null;}
function lastDays(n,end){end=end||today();const out=[];for(let i=n-1;i>=0;i--){const d=addDays(end,-i);out.push([d,entry(d)]);}return out;}
function median(a){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function rhrBase(){const v=lastDays(15).slice(0,14).map(x=>x[1]&&x[1].rhr).filter(x=>x>0);return v.length>=4?median(v):null;}
function envelop(e){
  if(!e) return null;
  const b = rhrBase(); const rhrUp = e.rhr>0 && b && (e.rhr-b)>=8;
  if(e.crash || e.energie<=3 || e.hoofdpijn>=7) return {k:"rood",t:"Rustdag",x:"Alleen het hoognodige. Lig regelmatig plat met prikkels laag en schermen minimaal. Zeg af wat kan. Een crash herstelt alleen met echte rust."};
  if(e.energie<=5 || e.spanning>=6 || e.hoofdpijn>=5 || (e.slaap!=null && e.slaap<=3) || rhrUp) return {k:"oranje",t:"Zuinige dag",x:"Hooguit één kleine taak. Plan pauzes vóór je moe bent. Splits mentale taken (schermen, telefoons) op."+(rhrUp?" Je rusthartslag ligt ≥8 slagen boven je gemiddelde: een vroeg waarschuwingssignaal.":"")};
  return {k:"groen",t:"Betere dag",x:"Doe ongeveer 70% van wat je denkt te kunnen. Haal niets in. Een goede dag is geen startsein om alles in te halen, en morgen telt ook."};
}
function avgField(arr,f){const v=arr.map(x=>x[1]&&x[1][f]).filter(x=>typeof x==="number");return v.length?{m:v.reduce((a,b)=>a+b,0)/v.length,n:v.length}:null;}
function voorNa(start){
  if(!start) return null;
  const before=[],after=[];
  for(let i=1;i<=14;i++){const d=addDays(start,-i);before.push([d,entry(d)]);}
  const t=today(); const span=Math.min(Math.max(daysBetween(start,t),0),56);
  for(let i=0;i<=span;i++){const d=addDays(start,i);after.push([d,entry(d)]);}
  return {vb:avgField(before,"energie"),va:avgField(after,"energie"),hb:avgField(before,"hoofdpijn"),ha:avgField(after,"hoofdpijn"),
          cb:before.filter(x=>x[1]&&x[1].crash).length,ca:after.filter(x=>x[1]&&x[1].crash).length,dagen:span+1};
}
function pijnstillerDagen(n){return lastDays(n).filter(x=>x[1]&&x[1].pijnstiller).length;}

function chart(){
  const days = lastDays(30);
  const W=300,H=120,pl=16,pr=4,pt=8,pb=18;
  const x = i=>pl+(W-pl-pr)*i/29, y = v=>pt+(H-pt-pb)*(1-v/10);
  const line = f=>{let dpath="",pen=false;days.forEach((dd,i)=>{const e=dd[1];if(e&&typeof e[f]==="number"){dpath+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(e[f]).toFixed(1)+" ";pen=true;}else pen=false;});return dpath;};
  let s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Energie en hoofdpijn laatste 30 dagen">';
  [0,5,10].forEach(v=>{s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="0.6"/><text x="2" y="'+(y(v)+3)+'">'+v+'</text>';});
  s += '<path d="'+line("energie")+'" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<path d="'+line("hoofdpijn")+'" fill="none" stroke="var(--bad)" stroke-width="1.6" stroke-dasharray="3 2" stroke-linejoin="round"/>';
  days.forEach((dd,i)=>{const e=dd[1];if(e&&e.crash)s+='<path d="M'+x(i).toFixed(1)+' '+(H-pb+2)+' l-3.5 6 h7 z" fill="var(--warn)"/>';if(e&&typeof e.energie==="number")s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(e.energie).toFixed(1)+'" r="1.8" fill="var(--ok)"/>';});
  s += '<text x="'+pl+'" y="'+(H-1)+'">'+fmt(days[0][0]).slice(0,5)+'</text><text x="'+(W-pr-24)+'" y="'+(H-1)+'">vandaag</text></svg>';
  s += '<div class="row small muted"><span style="color:var(--ok)">━ energie</span><span style="color:var(--bad)">┅ hoofdpijn</span><span style="color:var(--warn)">▲ crash</span></div>';
  return s;
}

function fallbackCopy(txt,msg){
  const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);

function extractJSON(txt){
  txt = String(txt||"").trim();

  const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
  if(a<0||b<a) throw new Error("Geen JSON gevonden");
  return JSON.parse(txt.slice(a,b+1));
}
