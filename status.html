<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixto Custom Guitars · Status</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#150f0d">
<style>
  :root{--bg:#150f0d;--card:#211814;--card-2:#2a1f1a;--line:#3a2c24;--text:#f3ead9;--dim:#b4a28a;--brass:#c7a165;--gold:#dcbb82;
    --serif:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;color:var(--text);font-family:var(--sans);
    background:radial-gradient(120% 55% at 50% -12%, rgba(199,161,101,.11), transparent 62%), var(--bg);background-attachment:fixed;}
  body{padding:20px 16px calc(60px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;}
  header{display:flex;gap:14px;align-items:center;margin-bottom:18px;}
  header .mark{width:46px;height:46px;flex-shrink:0;border:1.5px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:600;font-size:23px;color:var(--brass);text-decoration:none;}
  header .eyebrow{font-weight:600;letter-spacing:.22em;font-size:10px;text-transform:uppercase;color:var(--brass);margin-bottom:3px;}
  header h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.05;margin:0;}
  .meta{font-size:12px;color:var(--dim);margin:-6px 2px 14px;}
  #doc h1{display:none;}
  #doc h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--brass);margin:24px 2px 10px;}
  #doc h3{font-family:var(--serif);font-size:17px;margin:16px 0 6px;}
  #doc .sec{background:linear-gradient(180deg,var(--card),#1d1511);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:0 10px 26px rgba(0,0,0,.28);}
  #doc .sec.first{border-color:rgba(199,161,101,.55);box-shadow:0 0 0 4px rgba(199,161,101,.07),0 10px 26px rgba(0,0,0,.28);}
  #doc p{margin:6px 0;font-size:14.5px;line-height:1.5;}
  #doc p em:only-child{color:var(--dim);font-size:12.5px;}
  #doc ul{margin:4px 0;padding-left:18px;}
  #doc li{font-size:14.5px;line-height:1.5;margin:5px 0;}
  #doc strong{color:var(--gold);font-weight:600;}
  #doc code{font-size:12px;background:var(--card-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-all;}
  #doc a{color:var(--gold);}
  .tbl{overflow-x:auto;margin:4px -4px;}
  table{border-collapse:collapse;width:100%;font-size:13.5px;}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--line);}
  td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;line-height:1.5;color:var(--dim);}
  .reqbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 2px 14px;}
  .reqbar .note{font-size:12px;color:var(--dim);}
  .live{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin-left:6px;}
  .proto{font-size:10px;border:1px solid var(--brass);color:var(--brass);border-radius:6px;padding:0 5px;margin-left:5px;}
  td .sub{display:block;font-size:12px;color:var(--dim);margin-top:2px;}
  .btn{display:inline-block;margin-top:10px;font:600 13px var(--sans);border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;}
  a.home{color:var(--brass);text-decoration:none;display:block;}
</style>
</head>
<body>
<header>
  <a class="mark" href="./" title="Werkplaats">S</a>
  <div><a class="eyebrow home" href="./">‹ Werkplaats</a><h1>Status</h1></div>
</header>
<div class="meta" id="meta"></div>
<div class="reqbar"><button class="btn" id="reqbtn" onclick="requestUpdate()" style="margin-top:0;">🔄 Vraag CS om een nieuwe update</button><span class="note" id="reqnote"></span></div>
<div id="doc"><div class="msg">Laden…</div></div>

<script>
/* Sixto Custom Guitars · Status (27/10/2026)
   Toont 00_SHOP_STATUS.md, door Claude bijgehouden. De inhoud staat in een PRIVÉ-repo (sixto-private/status.md):
   klantnamen, prijzen en privézaken horen niet in de publieke SixtoTools-repo. Deze pagina bevat zelf geen gegevens
   en haalt de status op met het token uit Builds (zelfde site, zelfde opslag). */
const OWNER = '666sixto666', REPO = 'sixto-private', PATH = 'status.md', TOKEN_KEY = 'sixto_tools_gh_token';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/(^|[\s(])_([^_]+)_(?=[\s).,:;]|$)/g, '$1<em>$2</em>')
  .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

/* Kleine markdown-weergave: koppen, lijsten, tabellen, vet, code, links. Elke ## opent een kaart. */
function render(md){
  const out = []; let list = false, table = null, inSec = false, first = true;
  const closeList = () => { if(list){ out.push('</ul>'); list = false; } };
  const closeTable = () => { if(table){ out.push('<div class="tbl"><table>' + table.join('') + '</table></div>'); table = null; } };
  const closeSec = () => { closeList(); closeTable(); if(inSec){ out.push('</div>'); inSec = false; } };
  for(const raw of md.split('\n')){
    const line = raw.trimEnd();
    if(/^## /.test(line)){ closeSec(); out.push(`<h2>${inline(line.slice(3))}</h2><div class="sec${first ? ' first' : ''}">`); inSec = true; first = false; continue; }
    if(/^# /.test(line)){ closeSec(); out.push(`<h1>${inline(line.slice(2))}</h1>`); continue; }
    if(/^### /.test(line)){ closeList(); closeTable(); out.push(`<h3>${inline(line.slice(4))}</h3>`); continue; }
    if(/^\|/.test(line)){
      closeList();
      if(/^\|[\s|:-]+\|$/.test(line)) continue;
      const cells = line.replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      if(!table){ table = ['<tr>' + cells.map(c => `<th>${c}</th>`).join('') + '</tr>']; }
      else table.push('<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>');
      continue;
    }
    closeTable();
    const li = line.match(/^\s*[-*] (.*)/);
    if(li){ if(!list){ out.push('<ul>'); list = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
    closeList();
    if(line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  closeSec();
  return out.join('');
}

const api = (path, token, opts = {}) => fetch(`https://api.github.com/repos/${OWNER}/${path}`,
  Object.assign({cache:'no-store'}, opts, {headers:Object.assign({Authorization:'Bearer ' + token, Accept:'application/vnd.github+json'}, opts.headers || {})}));
const getToken = () => { try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } };
const hhmm = iso => new Date(iso).toLocaleString('nl-BE', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

/* Builds live uit de syncfile van Builds: vinkjes en de volgende open stap zijn altijd actueel,
   ook als CS de status nog niet herschreven heeft. De kolom "Stand" uit het rapport komt eronder. */
async function liveBuilds(token, stand){
  const res = await api('SixtoTools/contents/data/builds-sync.json?ref=main', token, {headers:{Accept:'application/vnd.github.raw'}});
  if(!res.ok) return null;
  const d = await res.json();
  const rows = (d.builds || []).filter(b => b.status !== 'completed' && b.status !== 'archived').map(b => {
    const steps = (b.checklist || []).flatMap(ph => (ph.steps || []).map(st => Object.assign({phase: ph.phase}, st)));
    const done = steps.filter(st => st.checked).length;
    const next = steps.find(st => !st.checked);
    const last = steps.filter(st => st.checked && st.date).map(st => st.date).sort().pop();
    return {b, done, total: steps.length, next, last};
  }).sort((x, y) => (y.last || '').localeCompare(x.last || ''));
  const cell = t => inline(t || '');
  return '<div class="tbl"><table><tr><th>Build</th><th>Vinkjes</th><th>Volgende stap</th></tr>' + rows.map(r =>
    `<tr><td><strong>${esc(r.b.name)}</strong>${r.b.prototype ? '<span class="proto">prototype</span>' : ''}${stand[r.b.name] ? `<span class="sub">${cell(stand[r.b.name])}</span>` : ''}</td>` +
    `<td>${r.done}/${r.total}${r.last ? `<span class="sub">laatst ${esc(r.last.slice(8,10) + '/' + r.last.slice(5,7))}</span>` : ''}</td>` +
    `<td>${r.next ? cell(r.next.text.replace(/\s*\((klantbuild|verkoop|prototype)\)/g, '')) + `<span class="sub">${esc(r.next.phase)}</span>` : 'alles afgevinkt'}</td></tr>`).join('') + '</table></div>';
}

/* "Vraag CS om een nieuwe update": zet een verzoek in de privé-repo. Op de pc kijkt CS elk halfuur
   (07–22 u, als de pc en de Claude-app aanstaan) of er een verzoek ligt, herschrijft dan de status en wist het verzoek. */
const REQ = 'sixto-private/contents/requests/update.json';
async function showRequest(token){
  const res = await api(REQ + '?ref=main', token);
  const note = document.getElementById('reqnote'), btn = document.getElementById('reqbtn');
  if(res.ok){
    const j = await res.json(); let at = '';
    try{ at = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ''))))).requestedAt; }catch(e){}
    note.textContent = 'Gevraagd' + (at ? ' op ' + hhmm(at) : '') + '. CS werkt de status bij binnen het halfuur (als de pc aanstaat).';
    btn.disabled = true; btn.style.opacity = .5; return j.sha;
  }
  note.textContent = ''; btn.disabled = false; btn.style.opacity = 1; return null;
}
async function requestUpdate(){
  const token = getToken(); if(!token) return;
  const btn = document.getElementById('reqbtn'); btn.disabled = true;
  const body = JSON.stringify({requestedAt: new Date().toISOString(), from: 'status'});
  const sha = await showRequest(token);
  const res = await api(REQ, token, {method:'PUT', body: JSON.stringify(Object.assign({message:'Tom vraagt een nieuwe statusupdate', content: btoa(body)}, sha ? {sha} : {}))});
  if(!res.ok){ document.getElementById('reqnote').textContent = 'Verzoek mislukt (' + res.status + '). Heeft het token schrijfrechten op sixto-private?'; btn.disabled = false; return; }
  await showRequest(token);
}

async function load(){
  const doc = document.getElementById('doc');
  const token = getToken();
  if(!token){ doc.innerHTML = '<div class="msg">Geen token op dit toestel. Zet het eerst in <a href="builds.html">Builds</a> › Instellingen › GitHub sync.</div>'; document.getElementById('reqbtn').style.display = 'none'; return; }
  document.getElementById('reqbtn').style.display = '';
  try{
    const res = await api(`${REPO}/contents/${PATH}?ref=main`, token);
    if(res.status === 404 || res.status === 403){ doc.innerHTML = '<div class="msg">De status is nog niet beschikbaar: de privé-repo <code>sixto-private</code> bestaat nog niet, of het token heeft er geen toegang toe.</div>'; return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const md = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ''))));
    doc.innerHTML = render(md);
    // Builds-kaart vervangen door de live versie
    const stand = {};
    md.split('\n').filter(l => /^\|/.test(l)).forEach(l => { const c = l.replace(/^\||\|$/g, '').split('|').map(x => x.trim()); if(c.length >= 3 && /^Sixto /.test(c[0])) stand[c[0]] = c[c.length - 1]; });
    const h = [...doc.querySelectorAll('h2')].find(x => x.textContent.trim() === 'Builds');
    if(h){ const live = await liveBuilds(token, stand).catch(() => null);
      if(live){ h.innerHTML = 'Builds<span class="live">● live uit Builds</span>'; h.nextElementSibling.innerHTML = live; } }
    const commits = await api(`${REPO}/commits?path=${PATH}&per_page=1`, token).then(r => r.ok ? r.json() : []);
    if(commits[0]) document.getElementById('meta').textContent = 'Rapport van CS: ' + hhmm(commits[0].commit.author.date);
    showRequest(token).catch(() => {});
  }catch(e){
    doc.innerHTML = `<div class="msg">Kon de status niet laden (${esc(e.message)}). Offline? <button class="btn" onclick="load()">Opnieuw</button></div>`;
  }
}
load();
</script>
</body>
</html>
