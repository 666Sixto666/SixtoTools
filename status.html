<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixto Custom Guitars · Status</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#150f0d">
<style>
  :root{--bg:#150f0d;--card:#211814;--card-2:#2a1f1a;--line:#3a2c24;--text:#f3ead9;--dim:#b4a28a;--brass:#c7a165;--gold:#dcbb82;
    --serif:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;color:var(--text);font-family:var(--sans);
    background:radial-gradient(120% 55% at 50% -12%, rgba(199,161,101,.11), transparent 62%), var(--bg);background-attachment:fixed;}
  body{padding:20px 16px calc(60px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;}
  header{display:flex;gap:14px;align-items:center;margin-bottom:18px;}
  header .mark{width:46px;height:46px;flex-shrink:0;border:1.5px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:600;font-size:23px;color:var(--brass);text-decoration:none;}
  header .eyebrow{font-weight:600;letter-spacing:.22em;font-size:10px;text-transform:uppercase;color:var(--brass);margin-bottom:3px;}
  header h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.05;margin:0;}
  .meta{font-size:12px;color:var(--dim);margin:-6px 2px 14px;}
  #doc h1{display:none;}
  #doc h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--brass);margin:24px 2px 10px;}
  #doc h3{font-family:var(--serif);font-size:17px;margin:16px 0 6px;}
  #doc .sec{background:linear-gradient(180deg,var(--card),#1d1511);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:0 10px 26px rgba(0,0,0,.28);}
  #doc .sec.first{border-color:rgba(199,161,101,.55);box-shadow:0 0 0 4px rgba(199,161,101,.07),0 10px 26px rgba(0,0,0,.28);}
  #doc p{margin:6px 0;font-size:14.5px;line-height:1.5;}
  #doc p em:only-child{color:var(--dim);font-size:12.5px;}
  #doc ul{margin:4px 0;padding-left:18px;}
  #doc li{font-size:14.5px;line-height:1.5;margin:5px 0;}
  #doc strong{color:var(--gold);font-weight:600;}
  #doc code{font-size:12px;background:var(--card-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-all;}
  #doc a{color:var(--gold);}
  .tbl{overflow-x:auto;margin:4px -4px;}
  table{border-collapse:collapse;width:100%;font-size:13.5px;}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--line);}
  td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;line-height:1.5;color:var(--dim);}
  .btn{display:inline-block;margin-top:10px;font:600 13px var(--sans);border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:transparent;color:var(--gold);cursor:pointer;}
</style>
</head>
<body>
<header>
  <a class="mark" href="./" title="Werkplaats">S</a>
  <div><div class="eyebrow">Sixto Custom Guitars</div><h1>Status</h1></div>
</header>
<div class="meta" id="meta"></div>
<div id="doc"><div class="msg">Laden…</div></div>

<script>
/* Sixto Custom Guitars · Status (27/10/2026)
   Toont 00_SHOP_STATUS.md, door Claude bijgehouden. De inhoud staat in een PRIVÉ-repo (sixto-private/status.md):
   klantnamen, prijzen en privézaken horen niet in de publieke SixtoTools-repo. Deze pagina bevat zelf geen gegevens
   en haalt de status op met het token uit Builds (zelfde site, zelfde opslag). */
const OWNER = '666sixto666', REPO = 'sixto-private', PATH = 'status.md', TOKEN_KEY = 'sixto_tools_gh_token';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/(^|[\s(])_([^_]+)_(?=[\s).,:;]|$)/g, '$1<em>$2</em>')
  .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

/* Kleine markdown-weergave: koppen, lijsten, tabellen, vet, code, links. Elke ## opent een kaart. */
function render(md){
  const out = []; let list = false, table = null, inSec = false, first = true;
  const closeList = () => { if(list){ out.push('</ul>'); list = false; } };
  const closeTable = () => { if(table){ out.push('<div class="tbl"><table>' + table.join('') + '</table></div>'); table = null; } };
  const closeSec = () => { closeList(); closeTable(); if(inSec){ out.push('</div>'); inSec = false; } };
  for(const raw of md.split('\n')){
    const line = raw.trimEnd();
    if(/^## /.test(line)){ closeSec(); out.push(`<h2>${inline(line.slice(3))}</h2><div class="sec${first ? ' first' : ''}">`); inSec = true; first = false; continue; }
    if(/^# /.test(line)){ closeSec(); out.push(`<h1>${inline(line.slice(2))}</h1>`); continue; }
    if(/^### /.test(line)){ closeList(); closeTable(); out.push(`<h3>${inline(line.slice(4))}</h3>`); continue; }
    if(/^\|/.test(line)){
      closeList();
      if(/^\|[\s|:-]+\|$/.test(line)) continue;
      const cells = line.replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      if(!table){ table = ['<tr>' + cells.map(c => `<th>${c}</th>`).join('') + '</tr>']; }
      else table.push('<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>');
      continue;
    }
    closeTable();
    const li = line.match(/^\s*[-*] (.*)/);
    if(li){ if(!list){ out.push('<ul>'); list = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
    closeList();
    if(line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  closeSec();
  return out.join('');
}

async function load(){
  const doc = document.getElementById('doc');
  let token = ''; try{ token = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){}
  if(!token){ doc.innerHTML = '<div class="msg">Geen token op dit toestel. Zet het eerst in <a href="builds.html">Builds</a> › Instellingen › GitHub sync.</div>'; return; }
  try{
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=main`,
      {headers:{Authorization:'Bearer ' + token, Accept:'application/vnd.github+json'}, cache:'no-store'});
    if(res.status === 404 || res.status === 403){ doc.innerHTML = '<div class="msg">De status is nog niet beschikbaar: de privé-repo <code>sixto-private</code> bestaat nog niet, of het token heeft er geen toegang toe.</div>'; return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const md = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ''))));
    doc.innerHTML = render(md);
    const commits = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${PATH}&per_page=1`,
      {headers:{Authorization:'Bearer ' + token, Accept:'application/vnd.github+json'}, cache:'no-store'}).then(r => r.ok ? r.json() : []);
    if(commits[0]) document.getElementById('meta').textContent = 'Bijgewerkt door Claude op ' +
      new Date(commits[0].commit.author.date).toLocaleString('nl-BE', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
  }catch(e){
    doc.innerHTML = `<div class="msg">Kon de status niet laden (${esc(e.message)}). Offline? <button class="btn" onclick="load()">Opnieuw</button></div>`;
  }
}
load();
</script>
</body>
</html>
